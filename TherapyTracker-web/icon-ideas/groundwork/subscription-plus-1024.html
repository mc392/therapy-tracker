<!-- Source for subscription-plus-1024.png — the App Store Connect image for the
     GroundWork Plus subscription (offer-code redemption, win-back offers, and the
     product page if App Store Promotion is enabled).

     Regenerate rather than editing the PNG:
       node scripts/render-subscription-image.mjs

     Recognisably GroundWork at redemption-sheet size, and unmistakably NOT the free app icon:
     the tallest bar carries a gold border. Lighting all three bars equally was tried first and
     reads flat — the left-to-right fade is what gives the mark its depth — so the fade stays
     and the gold does the work.

     THE THREE BARS ARE A TIER LADDER, and that is why the gold is on the third one alone.
     Today Plus is the only tier and it is the top tier, so bar 3 is gold and bars 1 and 2 are
     the plain fade. A middle tier later takes bar 2 (silver, or a lighter gold) without
     redrawing anything; a free tier is bar 1, already there and already plain. Do not move the
     gold to all three — the ladder stops meaning anything if every rung is the top.

     No text. Apple shows the subscription's name and description alongside this image, so a
     word here would be redundant, and it could not be localised. Colours are sampled from
     icon-1024.png, not guessed: #6B8B7C to #3C4F44. -->
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;background:#3C4F44}
  .plate{position:relative;width:1024px;height:1024px;
    background:linear-gradient(180deg,#6B8B7C 0%,#5F7C6E 25%,#536D60 50%,#475E52 75%,#3C4F44 100%)}
  /* A soft lift behind the leaf, so the top-right corner does not read as dead space and the
     leaf separates from the ground it sits on. */
  .glow{position:absolute;inset:0;
    background:radial-gradient(52% 46% at 68% 22%,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
  svg{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:770px;height:719px}
  /* The icon's own fade, sampled from it: #94A29A, #C2CCC6, #FBFDFB against this gradient. */
  .b1{fill:#FBFDFB;opacity:.55}
  .b2{fill:#FBFDFB;opacity:.78}
  /* Gold on the top rung. A warm gold against sage reads premium and, unlike a brighter
     yellow, does not fight the green. The stroke straddles the path, so bar 3 ends up a
     little wider than the other two — which helps rather than hurts: it is meant to be the
     one your eye lands on. */
  .b3{fill:#FBFDFB;stroke:url(#gold);stroke-width:2.6}
  .leaf{fill:#FBFDFB}
  /* Thin, and short enough to stay well inside the leaf — at 3.4 it read as a slash across a
     lens rather than a vein, and it touched the edges. */
  .vein{fill:none;stroke:#5F7C6E;stroke-width:2.2;stroke-linecap:round}
</style>
<div class="plate">
  <div class="glow"></div>
  <svg viewBox="0 0 120 112" role="img" aria-label="GroundWork Plus">
    <defs>
      <!-- Metallic rather than flat: a single gold is a yellow outline, a light-to-deep ramp
           reads as a rim catching the light. -->
      <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0%"   stop-color="#F7E3AE"/>
        <stop offset="38%"  stop-color="#E0BC6B"/>
        <stop offset="72%"  stop-color="#C99A43"/>
        <stop offset="100%" stop-color="#E7CB8B"/>
      </linearGradient>
      <filter id="goldglow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#E0BC6B" flood-opacity=".55"/>
      </filter>
    </defs>
    <rect class="b1" x="12" y="72" width="24" height="36" rx="12"/>
    <rect class="b2" x="46" y="54" width="24" height="54" rx="12"/>
    <g filter="url(#goldglow)"><rect class="b3" x="80" y="40" width="24" height="68" rx="12"/></g>
    <!-- Lifted and nudged right of the splash mark's own placement: there the leaf all but
         touches the tallest bar, which at this size reads as one shape rather than two. -->
    <g transform="translate(95 13) rotate(35) scale(1.08)">
      <path class="leaf" d="M0-17C10-9 10 9 0 17-10 9-10-9 0-17Z"/>
      <path class="vein" d="M-3.6 5 3.6-5"/>
    </g>
  </svg>
</div>
