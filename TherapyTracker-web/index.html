    '<div class="card"><div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">By tax year</h2><div class="seg" id="taxmode" style="display:inline-flex"><button data-m="proj" class="'+(taxMode==="proj"?"on":"")+'">Projected</button><button data-m="todate" class="'+(taxMode==="todate"?"on":"")+'">To date</button></div></div><div class="rawscroll"><table><thead><tr><th>Year</th><th class="num">Sess</th><th class="num">Billed</th><th class="num">Recv\'d</th><th class="num">Overdue</th><th class="num">Net</th><th class="num">Tax</th></tr></thead><tbody>'+tyTable+'</tbody></table></div><p class="small muted">Net = billed less room &amp; supervision costs. Tax = Income Tax + Class 4 NIC (sole trader); tap a figure for the breakdown. <b>*</b> in-progress year shown as '+(taxMode==="proj"?"a pro-rata projection":"tax on income to date")+'.</p></div>'+
    '<div class="card"><h2>Last 12 months</h2><table><thead><tr><th>Month</th><th class="num">Sess</th><th class="num">Billed</th><th class="num">Recv\'d</th><th class="num">Open</th></tr></thead><tbody>'+mTable+'</tbody></table></div>'+
    '<div class="card"><h2>Outstanding by client</h2>'+(byClient.length?'<table><thead><tr><th>Client</th><th class="num">Sessions</th><th class="num">Amount</th></tr></thead><tbody>'+byClient.map(x=>'<tr><td>'+esc(x.code)+'</td><td class="num">'+x.n+'</td><td class="num">'+gbp(x.amt)+'</td></tr>').join("")+'</tbody></table>':'<p class="muted small">Nothing outstanding 🎉</p>')+'</div>'+
    '<div class="card"><h2>Room payments due</h2>'+(roomRows?'<table><thead><tr><th>Room</th><th class="num">Sessions</th><th>Dates</th><th class="num">Total</th></tr></thead><tbody>'+roomRows+'</tbody></table>':'<p class="muted small">No room payments outstanding.</p>')+'</div>';
  const series=periodSeries(statGran);
  let sel=null;
  const drawCombo=()=>{v.querySelector("#chCombo").innerHTML=chartCombo(series,sel);
    v.querySelectorAll("#chCombo .hot").forEach(r=>{const set=()=>{sel=+r.dataset.i;drawCombo();};
      r.addEventListener("click",set);r.addEventListener("mouseenter",set);});};
  drawCombo();
  v.querySelector("#chCli").innerHTML=chartLine(series.map(d=>({l:d.l,v:d.clients,avg:d.cliAvg})));
  v.querySelector("#gran").querySelectorAll("button").forEach(bt=>bt.onclick=()=>{statGran=bt.dataset.g;go("income");});
  v.querySelectorAll(".taxlink").forEach(elx=>elx.onclick=()=>taxDetailsSheet(elx.dataset.y));
  var tmx=v.querySelector("#taxmode");if(tmx)tmx.querySelectorAll("button").forEach(b=>b.onclick=()=>{taxMode=b.dataset.m;go("income");});
  function paintTH(){const pen=pensionPcm();
    const mainV=thMode==="pension"?Math.round(th.monthly-pen):Math.round(th.monthly);
    const yrV=thMode==="pension"?Math.round(th.annualHome-pen*12):Math.round(th.annualHome);
    v.querySelector("#thMain").textContent=gbp(mainV);
    v.querySelector("#thMainL").textContent=thMode==="pension"?"per month, after tax & pension":"per month, after tax";
    v.querySelector("#thYr").textContent=gbp(yrV);
    v.querySelector("#thYrL").textContent=thMode==="pension"?"per year, after tax & pension":"per year, after tax";
    v.querySelector("#thNote").innerHTML=thBasis+(thMode==="pension"?(" Less pension "+gbp(pen)+"/mo."):"")+' <span class="taxlink" id="editPen">'+(thMode==="pension"?"Edit pension ›":("Pension "+gbp(pen)+"/mo ›"))+'</span>';
    const ep=v.querySelector("#editPen");if(ep)ep.onclick=()=>editPension(()=>go("income"));}
  v.querySelector("#thMode").querySelectorAll("button").forEach(bt=>bt.onclick=()=>{thMode=bt.dataset.th;
    v.querySelector("#thMode").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===bt));paintTH();});

  return v;
};

const RAWCOLS=[
 {k:"client",t:"Client"},{k:"num",t:"#",n:1},{k:"date",t:"Date",d:1},{k:"time",t:"Time"},{k:"mode",t:"Mode"},
 {k:"location",t:"Location"},{k:"room",t:"Room"},{k:"rate",t:"Rate",n:1,m:1},{k:"paidYN",t:"Paid"},{k:"paidDate",t:"Paid date",d:1},
 {k:"overdueYN",t:"Overdue"},{k:"roomRate",t:"Room £",n:1,m:1},{k:"roomPaid",t:"Room paid"},{k:"roomPaidDate",t:"Room paid date",d:1},{k:"roomDue",t:"Room due"},
 {k:"lateCancel",t:"Late cancel"},
 {k:"invoice",t:"Invoice"},{k:"notes",t:"Notes"},{k:"status",t:"Status"},{k:"taxYear",t:"Tax yr"},{k:"week",t:"Wk",n:1}];
function recOf(s,d){return {client:s.client,num:s.num,date:s.date,time:s.time||"",mode:s.mode||"",location:s.location||"",room:s.room||"",
  rate:d.rate,paidYN:d.clientPaid?"Y":"N",paidDate:s.paidDate||"",overdueYN:d.overdue?"Y":"N",roomRate:d.roomRate,roomPaid:s.roomPaid||"",
  roomPaidDate:s.roomPaidDate||"",roomDue:d.roomDue,lateCancel:isLateCancel(s)?"Y":"",invoice:s.invoice||"",notes:s.notes||"",status:d.status||"",taxYear:d.taxYear,week:d.week};}
let rawF={q:"",client:"",ty:"",paid:"",loc:"",sk:"date",sd:-1,cols:null};
let supF={q:"",sk:"date",sd:-1,cols:null};
let rawSeg="sessions";
VIEWS.raw=function(){
  const v=el('<div class="view active"></div>');
  const segHtml='<div class="seg mb" style="display:inline-flex"><button data-rs="sessions" class="'+(rawSeg==="sessions"?"on":"")+'">Sessions</button><button data-rs="supervision" class="'+(rawSeg==="supervision"?"on":"")+'">Supervision</button></div>';
  if(rawSeg==="supervision"){
    const SUPCOLS=[{k:"date",t:"Date",d:1},{k:"supervisor",t:"Supervisor"},{k:"count",t:"Client hrs",n:1},{k:"cost",t:"Cost",n:1,m:1},{k:"clients",t:"Clients discussed"},{k:"taxYear",t:"Tax yr"}];
    if(!supF.cols){try{supF.cols=JSON.parse(localStorage.getItem("tt_supcols"))}catch(e){} if(!supF.cols||!supF.cols.length)supF.cols=SUPCOLS.map(c=>c.k);}
    const fmtSupCell=(r,c)=>{if(c.m)return gbp(r[c.k]);if(c.d)return esc(fmtD(r[c.k]));return esc(r[c.k]==null?"":r[c.k]);};
    function filteredSup(){
      let rows=(S.supervision||[]).map(s=>({date:s.date||"",supervisor:s.supervisor||"",count:+(s.count)||1,cost:+(s.cost)||0,clients:(s.clients||[]).join(", "),taxYear:taxYear(s.date)}));
      const q=(supF.q||"").toLowerCase();
      if(q)rows=rows.filter(r=>SUPCOLS.some(c=>String(r[c.k]==null?"":r[c.k]).toLowerCase().includes(q)));
      const sc=SUPCOLS.find(c=>c.k===supF.sk)||{};
      rows.sort((a,b)=>{let x=a[supF.sk],y=b[supF.sk];if(supF.sk==="date"){x=x?parseD(x):0;y=y?parseD(y):0;}else if(sc.n){x=+x||0;y=+y||0;}else{x=String(x||"").toLowerCase();y=String(y||"").toLowerCase();}return(x>y?1:x<y?-1:0)*supF.sd;});
      return rows;
    }
    v.innerHTML=segHtml+'<div class="card"><div class="search"><input id="supq" placeholder="Search all fields…" value="'+esc(supF.q)+'"></div>'+
      '<details class="mt"><summary>Choose columns &amp; export</summary><div id="supColsBox" class="mt"></div><button class="btn sm sec mt" id="supcsv">Export filtered to CSV</button></details>'+
      '<div id="supcount" class="small muted mt"></div></div>'+
      '<div class="card" style="padding:6px"><div class="rawscroll"><table id="suptable"></table></div></div>';
    const scb=v.querySelector("#supColsBox");
    scb.innerHTML=SUPCOLS.map(c=>'<label class="colchk"><input type="checkbox" data-k="'+c.k+'"'+(supF.cols.includes(c.k)?" checked":"")+'> '+esc(c.t)+'</label>').join("");
    scb.querySelectorAll("input").forEach(x=>x.onchange=()=>{const k=x.dataset.k;if(x.checked){if(!supF.cols.includes(k))supF.cols.push(k);}else supF.cols=supF.cols.filter(z=>z!==k);try{localStorage.setItem("tt_supcols",JSON.stringify(supF.cols))}catch(e){} drawSup();});
    function drawSup(){
      const rows=filteredSup();const cols=SUPCOLS.filter(c=>supF.cols.includes(c.k));
      const thead='<thead><tr>'+cols.map(c=>'<th data-k="'+c.k+'"'+(c.n?' class="num"':'')+'>'+esc(c.t)+(supF.sk===c.k?(supF.sd>0?" ▲":" ▼"):"")+'</th>').join("")+'</tr></thead>';
      const tb='<tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td'+(c.n?' class="num"':'')+'>'+fmtSupCell(r,c)+'</td>').join("")+'</tr>').join("")+'</tbody>';
      v.querySelector("#suptable").innerHTML=thead+tb;
      v.querySelectorAll("#suptable th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(supF.sk===k)supF.sd=-supF.sd;else{supF.sk=k;supF.sd=1;}drawSup();});
      const totCost=rows.reduce((a,r)=>a+(+r.cost||0),0);
      v.querySelector("#supcount").textContent=rows.length+" rows · "+cols.length+" columns shown · total "+gbp(totCost);
      v.querySelector("#supcsv").onclick=()=>{const head=cols.map(c=>c.t).join(",");
        const lines=rows.map(r=>cols.map(c=>{let val=r[c.k];val=val==null?"":String(val);return /[",\n]/.test(val)?'"'+val.replace(/"/g,'""')+'"':val;}).join(","));
        download("therapy-supervision-table-"+isoD(today())+".csv",[head,...lines].join("\n"),"text/csv");toast("CSV downloaded");};
    }
    v.querySelector("#supq").oninput=e=>{supF.q=e.target.value;drawSup();};
    drawSup();
    v.querySelectorAll("[data-rs]").forEach(bt=>bt.onclick=()=>{rawSeg=bt.dataset.rs;go("raw");});
    return v;
  }
  if(!rawF.cols){try{rawF.cols=JSON.parse(localStorage.getItem("tt_cols"))}catch(e){} if(!rawF.cols||!rawF.cols.length)rawF.cols=["client","num","date","time","location","rate","paidYN","paidDate","roomPaidDate","overdueYN","status"];}
  const cOpt=["",...[...new Set(S.sessions.map(s=>s.client))].sort()];
  const tyOpt=["",...[...new Set(S.sessions.map(s=>derive(s).taxYear).filter(Boolean))].sort().reverse()];
  const lOpt=["",...S.rooms.map(r=>r.location)];
  v.innerHTML=segHtml+'<div class="card"><div class="search"><input id="rq" placeholder="Search all fields…" value="'+esc(rawF.q)+'"></div>'+
    '<div class="row" style="gap:6px;flex-wrap:wrap">'+
    '<select id="fCl">'+cOpt.map(c=>'<option value="'+esc(c)+'"'+(c===rawF.client?" selected":"")+'>'+(c||"All clients")+'</option>').join("")+'</select>'+
    '<select id="fTy">'+tyOpt.map(c=>'<option value="'+esc(c)+'"'+(c===rawF.ty?" selected":"")+'>'+(c||"All tax yrs")+'</option>').join("")+'</select>'+
    '<select id="fPaid"><option value="">Any status</option><option value="Y"'+(rawF.paid==="Y"?" selected":"")+'>Paid</option><option value="N"'+(rawF.paid==="N"?" selected":"")+'>Unpaid</option><option value="OD"'+(rawF.paid==="OD"?" selected":"")+'>Overdue</option></select>'+
    '<select id="fLoc">'+lOpt.map(c=>'<option value="'+esc(c)+'"'+(c===rawF.loc?" selected":"")+'>'+(c||"All locations")+'</option>').join("")+'</select></div>'+
    '<details class="mt"><summary>Choose columns &amp; export</summary><div id="colsBox" class="mt"></div><button class="btn sm sec mt" id="rcsv">Export filtered to CSV</button></details>'+
    '<div id="rcount" class="small muted mt"></div></div>'+
    '<div class="card" style="padding:6px"><div class="rawscroll"><table id="rtable"></table></div></div>';
  const cb=v.querySelector("#colsBox");
  cb.innerHTML=RAWCOLS.map(c=>'<label class="colchk"><input type="checkbox" data-k="'+c.k+'"'+(rawF.cols.includes(c.k)?" checked":"")+'> '+esc(c.t)+'</label>').join("");
  cb.querySelectorAll("input").forEach(x=>x.onchange=()=>{const k=x.dataset.k;if(x.checked){if(!rawF.cols.includes(k))rawF.cols.push(k);}else rawF.cols=rawF.cols.filter(z=>z!==k);try{localStorage.setItem("tt_cols",JSON.stringify(rawF.cols))}catch(e){} draw();});
  const fmtCell=(rec,c)=>{let val=rec[c.k];if(c.m)return gbp(val);if(c.d)return esc(fmtDMY(val));return esc(val==null?"":val);};
  function filtered(){
    let rows=S.sessions.map(s=>{const d=derive(s);return recOf(s,d);});
    const q=rawF.q.toLowerCase();
    if(q)rows=rows.filter(r=>RAWCOLS.some(c=>String(r[c.k]==null?"":r[c.k]).toLowerCase().includes(q)));
    if(rawF.client)rows=rows.filter(r=>r.client===rawF.client);
    if(rawF.ty)rows=rows.filter(r=>r.taxYear===rawF.ty);
    if(rawF.loc)rows=rows.filter(r=>r.location===rawF.loc);
    if(rawF.paid==="Y")rows=rows.filter(r=>r.paidYN==="Y");
    else if(rawF.paid==="N")rows=rows.filter(r=>r.paidYN==="N");
    else if(rawF.paid==="OD")rows=rows.filter(r=>r.overdueYN==="Y");
    const sc=RAWCOLS.find(c=>c.k===rawF.sk)||{};
    rows.sort((a,b)=>{let x=a[rawF.sk],y=b[rawF.sk];
      if(rawF.sk==="date"||rawF.sk==="paidDate"){x=x?parseD(x):0;y=y?parseD(y):0;}
      else if(sc.n){x=+x||0;y=+y||0;}else{x=String(x==null?"":x).toLowerCase();y=String(y==null?"":y).toLowerCase();}
      return (x>y?1:x<y?-1:0)*rawF.sd;});
    return rows;
  }
  function draw(){
    const rows=filtered();const cols=RAWCOLS.filter(c=>rawF.cols.includes(c.k));
    const thead='<thead><tr>'+cols.map(c=>'<th data-k="'+c.k+'"'+(c.n?' class="num"':'')+'>'+esc(c.t)+(rawF.sk===c.k?(rawF.sd>0?" ▲":" ▼"):"")+'</th>').join("")+'</tr></thead>';
    const tb='<tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td'+(c.n?' class="num"':'')+'>'+fmtCell(r,c)+'</td>').join("")+'</tr>').join("")+'</tbody>';
    const tbl=v.querySelector("#rtable");tbl.innerHTML=thead+tb;
    tbl.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(rawF.sk===k)rawF.sd=-rawF.sd;else{rawF.sk=k;rawF.sd=1;}draw();});
    v.querySelector("#rcount").textContent=rows.length+" rows · "+cols.length+" columns shown";
    v.querySelector("#rcsv").onclick=()=>{const head=cols.map(c=>c.t).join(",");
      const lines=rows.map(r=>cols.map(c=>{let val=c.m?r[c.k]:r[c.k];val=val==null?"":String(val);return /[",\n]/.test(val)?'"'+val.replace(/"/g,'""')+'"':val;}).join(","));
      download("therapy-table-"+isoD(today())+".csv",[head,...lines].join("\n"),"text/csv");toast("CSV downloaded");};
  }
  v.querySelector("#rq").oninput=e=>{rawF.q=e.target.value;draw();};
  v.querySelector("#fCl").onchange=e=>{rawF.client=e.target.value;draw();};
  v.querySelector("#fTy").onchange=e=>{rawF.ty=e.target.value;draw();};
  v.querySelector("#fPaid").onchange=e=>{rawF.paid=e.target.value;draw();};
  v.querySelector("#fLoc").onchange=e=>{rawF.loc=e.target.value;draw();};
  v.querySelectorAll("[data-rs]").forEach(bt=>bt.onclick=()=>{rawSeg=bt.dataset.rs;go("raw");});
  draw();return v;
};

/* ============ Suggestions ============ */
function clientList(){const order={Ongoing:0,"Initial session booked":0,Paused:1,Finished:2};
  return S.clients.slice().sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||a.code.localeCompare(b.code)).map(c=>c.code)}
function statusGroups(){
  const order=["Ongoing","Initial session booked","Active enquiry","Active","Paused","Finished"];
  const g={}; S.clients.forEach(c=>{const k=c.status||"Other";(g[k]=g[k]||[]).push(c.code)});
  return Object.keys(g).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?98:ia)-(ib<0?98:ib)||a.localeCompare(b)})
    .map(k=>[k,g[k].sort((x,y)=>x.localeCompare(y))]);
}
function clientSelectHTML(sel){
  return '<option value="">— choose client —</option>'+statusGroups().map(([st,codes])=>
    '<optgroup label="'+esc(st)+'">'+codes.map(c=>'<option value="'+esc(c)+'"'+(c===sel?" selected":"")+'>'+esc(c)+'</option>').join("")+'</optgroup>').join("");
}
function lastSessionFor(code,excludeId){
  const rs=S.sessions.filter(s=>(s.client||"").toLowerCase()===(code||"").toLowerCase()&&s._id!==excludeId);
  if(!rs.length)return null; rs.sort((a,b)=>parseD(b.date)-parseD(a.date)); return rs[0];
}
function freqDays(c){const f=(c&&c.frequency||"").toLowerCase();
  if(f.includes("2"))return 14; if(f.includes("3"))return 21; if(f.includes("month"))return 28; return 7}
function suggestFor(code){
  const rs=S.sessions.filter(s=>(s.client||"").toLowerCase()===(code||"").toLowerCase());
  if(!rs.length)return {num:1,date:isoD(today()),time:"10:00",mode:"In-person",location:"At home",room:""};
  rs.sort((a,b)=>parseD(b.date)-parseD(a.date));const last=rs[0];
  const maxNum=Math.max(...rs.map(s=>+s.num||0));
  const cl=S.clients.find(c=>c.code.toLowerCase()===code.toLowerCase());
  const nd=addDays(parseD(last.date),freqDays(cl));
  return {num:maxNum+1,date:isoD(nd),time:last.time||"10:00",mode:last.mode||"In-person",
    location:last.location||"At home",room:last.room&&last.room!=="-"?last.room:""};
}

/* ============ Export / import ============ */
function download(name,text,type){const b=new Blob([text],{type:type||"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function exportJSON(){const audit=await auditAll();
  const out={app:"TherapyTracker",version:1,exportedAt:new Date().toISOString(),state:S,audit:audit.slice(-800)};
  download("therapy-tracker-backup-"+isoD(today())+".json",JSON.stringify(out));markBackedUp();toast("Backup downloaded")}
function exportCSV(){
  const cols=["client","num","date","time","mode","location","room","invoice","paidDate","notes","roomPaid","rate","clientPaid","overdue","roomRate","roomDue","status","taxYear","week"];
  const rows=[cols.join(",")];
  S.sessions.slice().sort((a,b)=>parseD(a.date)-parseD(b.date)).forEach(s=>{const d=derive(s);
    const r=cols.map(c=>{let v=(c in s)?s[c]:d[c];if(c==="clientPaid")v=d.clientPaid?"Y":"N";if(c==="overdue")v=d.overdue?"Y":"N";
      v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v});
    rows.push(r.join(","))});
  download("therapy-sessions-"+isoD(today())+".csv",rows.join("\n"),"text/csv");toast("Sessions CSV downloaded")}
function exportSupervisionCSV(){
  const cols=["date","supervisor","clientHrsReviewed","cost","clientsDiscussed","taxYear"];
  const rows=[cols.join(",")];
  (S.supervision||[]).slice().sort((a,b)=>parseD(a.date)-parseD(b.date)).forEach(s=>{
    const rec={date:s.date||"",supervisor:s.supervisor||"",clientHrsReviewed:(+s.count||1),cost:(+s.cost||0),
      clientsDiscussed:(s.clients||[]).join("; "),taxYear:s.date?taxYear(s.date):""};
    const r=cols.map(c=>{let v=rec[c];v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v});
    rows.push(r.join(","))});
  download("therapy-supervision-"+isoD(today())+".csv",rows.join("\n"),"text/csv");toast("Supervision CSV downloaded")}
function importJSON(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{const o=JSON.parse(rd.result);const st=o.state||o;
    if(!st.sessions||!st.clients)throw new Error("Not a valid backup");
    if(!confirm("Restore this backup? It replaces current data (current state is saved as a restore point)."))return;
    S=normalize(st);
    await commit("Restored backup ("+(S.sessions.length)+" sessions)");markBackedUp();toast("Backup restored");go("home");
  }catch(err){alert("Could not import: "+err.message)}};rd.readAsText(f)}
async function showSnapshots(){if(!_db){toast("Restore points need storage");return}
  const snaps=await snapAll();snaps.sort((a,b)=>b.id-a.id);
  const body=el('<div></div>');
  body.innerHTML='<p class="muted small">Every change creates a restore point. Tap to roll back.</p>'+
    snaps.slice(0,80).map(s=>`<div class="list-item" data-id="${s.id}"><div class="li-main">
      <div class="li-title">${esc(s.label)}</div><div class="li-sub">${new Date(s.ts).toLocaleString("en-GB")} · ${s.data.sessions.length} sessions</div></div>
      <button class="btn sm sec">Restore</button></div>`).join("");
  body.querySelectorAll(".list-item").forEach(li=>li.onclick=async()=>{const id=+li.dataset.id;const snap=snaps.find(x=>x.id===id);
    if(!confirm("Roll back to: "+snap.label+"?"))return;S=clone(snap.data);await commit("Rolled back to: "+snap.label);closeSheet();toast("Restored");go("home")});
  openSheet("Restore points",body);
}

/* ============ Init ============ */
(async function(){
  try{await openDB();await loadState();}
  catch(e){ // fallback to localStorage
    try{const ls=localStorage.getItem("tt_state");S=ls?JSON.parse(ls):clone(window.SEED);}catch(_){S=clone(window.SEED);}
    if(!S.sessions)S=clone(window.SEED);
  }
  initBackupTracking();
  const bk=document.getElementById("bkNow");if(bk)bk.onclick=exportJSON;
  go("home");
})();
