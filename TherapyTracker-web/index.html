}

/* ===== Making Tax Digital =====
   MTD for Income Tax wants a digital record of every transaction, quarterly totals by SA103
   category, and a final declaration. The records and the totals are what this builds.

   It stops short of submitting, and that is a hard limit rather than a gap in the work: sending
   a quarterly update needs an OAuth client secret (which cannot live in a page anyone can view
   source on), HMRC's fraud-prevention headers, and HMRC recognition of the software itself. All
   three need a server. So the app produces the figures and hands them over -- to an accountant,
   or to bridging software -- and says so plainly rather than implying a filing it cannot do. */
function mtdQuarters(ty){
  const sy=parseInt(ty.slice(0,4));
  return [
    {n:1,from:new Date(sy,3,6),   to:new Date(sy,6,5),   label:"6 Apr – 5 Jul"},
    {n:2,from:new Date(sy,6,6),   to:new Date(sy,9,5),   label:"6 Jul – 5 Oct"},
    {n:3,from:new Date(sy,9,6),   to:new Date(sy+1,0,5), label:"6 Oct – 5 Jan"},
    {n:4,from:new Date(sy+1,0,6), to:new Date(sy+1,3,5), label:"6 Jan – 5 Apr"}
  ];
}
/* Session fees for a period, on whichever basis is in force. */
function mtdTurnover(from,to){
  const cash=taxBasis()==="cash";
  let t=0;
  S.sessions.forEach(x=>{
    const when=cash?(x.paidDate||null):x.date;
    if(!when)return;
    const d=parseD(when); if(!d||d<from||d>to)return;
    t+=derive(x).rate||0;});
  return t;
}
/* Costs for a period, totalled by the SA103 box each category maps to. */
function mtdExpenseBoxes(from,to){
  const cash=taxBasis()==="cash";
  const wide=cash?addYears(from,-2):from, wideTo=cash?addYears(to,2):to;
  const box={};
  const add=(b,amt)=>{box[b]=(box[b]||0)+amt;};
  const hit=(kind,ref,occ)=>{
    if(!cash)return (occ.date>=from&&occ.date<=to);
    const paid=chargePaidOn(chargeKey(kind,ref,occ.date));
    const when=paid?parseD(paid):occ.date;
    return when>=from&&when<=to;};
  (S.expenses||[]).forEach(x=>{const c=catOf("exp",x.cat);
    moneyOccurrences(x,wide,wideTo).forEach(o=>{if(hit("exp",x._id,o))add(c.box,o.amount);});});
  /* Per-session room fees are a cost too, and they follow their session exactly as tyNet has
     them — without this the quarters would not add up to the year. */
  S.sessions.forEach(x=>{const dv=derive(x); if(!(dv.roomRate>0))return;
    const when=cash?(x.paidDate||null):x.date; if(!when)return;
    const d=parseD(when); if(!d||d<from||d>to)return;
    add(21,dv.roomRate);});
  roomRentOccurrences(wide,wideTo).forEach(o=>{if(hit("rent",(o.location||"").toLowerCase(),o))add(21,o.amount);});
  uohOccurrences(from,to).forEach(o=>add(21,o.amount));
  /* supervision and peer supervision are professional fees */
  (S.supervision||[]).forEach(v=>{const d=v.date?parseD(v.date):null;
    if(d&&d>=from&&d<=to&&+v.cost)add(28,+v.cost);});
  (S.peerSupervision||[]).forEach(v=>{const d=v.date?parseD(v.date):null;
    if(d&&d>=from&&d<=to&&+v.cost)add(28,+v.cost);});
  return box;
}
function mtdOtherIncome(from,to){
  const cash=taxBasis()==="cash";
  const wide=cash?addYears(from,-2):from, wideTo=cash?addYears(to,2):to;
  let t=0;
  (S.otherIncome||[]).forEach(x=>{if(finPersonal(x))return;      /* a separate trade, not this one */
    moneyOccurrences(x,wide,wideTo).forEach(o=>{
      const paid=chargePaidOn(chargeKey("inc",x._id,o.date));
      const when=cash?(paid?parseD(paid):o.date):o.date;
      if(when>=from&&when<=to)t+=o.amount;});});
  return t;
}
function mtdPeriod(q){
  const turnover=mtdTurnover(q.from,q.to), other=mtdOtherIncome(q.from,q.to);
  const boxes=mtdExpenseBoxes(q.from,q.to);
  const expTotal=Object.keys(boxes).reduce((a,k)=>a+boxes[k],0);
  return {q,turnover,other,boxes,expTotal,net:turnover+other-expTotal};
}
function mtdExport(ty){
  const out={app:"TherapyTracker",generated:new Date().toISOString(),taxYear:ty,
    basis:taxBasis(),note:"Quarterly totals for MTD for Income Tax. Not a submission - hand to your accountant or bridging software.",
    periods:[]};
  mtdQuarters(ty).forEach(q=>{const p=mtdPeriod(q);
    out.periods.push({period:q.n,from:isoD(q.from),to:isoD(q.to),
      income:{turnover:Math.round(p.turnover*100)/100,other:Math.round(p.other*100)/100},
      expenses:Object.keys(p.boxes).sort((a,b)=>a-b).map(b=>({sa103Box:+b,name:SA103[b]||"",amount:Math.round(p.boxes[b]*100)/100}))});});
  download("therapy-mtd-"+ty.replace("/","-")+".json",JSON.stringify(out,null,2),"application/json");
  toast("MTD figures downloaded");
}

/* ---- Tax > Allowances ----
   Two different jobs, kept apart: the segment bar EDITS a method, and a separate deliberate
   action APPLIES one. Comparing simplified against actual is the normal thing to want to do, and
   it must not quietly change what the tax figures use. Whatever is applied is stated at the top
   and marked on the method it belongs to. */
let uohYearSel=null, uohEdit=null;
function drawAllowances(host){
  const ty=uohYearSel||curTaxYear();
  const inForce=uohForYear(ty), applied=inForce.cfg;
  const draft=uohDraft(ty);
  if(!uohEdit)uohEdit=(applied.method&&applied.method!=="none")?applied.method:"simplified";
  const b=tyBounds(ty);
  const yearAmt=uohOccurrences(b.start,b.end).reduce((a,o)=>a+o.amount,0);
  const money=x=>gbp(Math.round(x));

  const amtFor=m=>m==="simplified"?simpAmt:m==="actual"?actAmt:0;

  const years=[...new Set(S.sessions.map(x=>x.date).filter(Boolean).map(d=>taxYear(d))
    .concat(Object.keys(uohYears())).concat([curTaxYear()]))].sort().reverse();
  /* Newest first, so "‹" (back in time) moves DOWN the strip and "›" moves up it. */

      return '<button type="button" class="uohyr'+(y===ty?" on":"")+'" data-yr="'+esc(y)+'">'+
        '<b>'+esc(y)+'</b><span class="st '+st.k+'">'+(st.filed?"filed · ":"")+esc(st.label)+'</span></button>';}).join("")+'</div>'+
    '<button class="uohnav" id="uohNext" title="Later year" aria-label="Later tax year"'+(yIdx<=0?" disabled":"")+'>›</button>'+
    '</div>';
  const methodRow=m=>{
    const isApplied=(applied.method===m)&&!inForce.inherited;
    const label=m==="simplified"?"Simplified":m==="actual"?"Actual costs":"Not claiming";
    return '<div class="list-item"><div class="li-main">'+
      '<div class="li-title">'+label+(isApplied?' <span class="chip y">\ud83d\udd12 in use</span>':'')+'</div>'+

      '<div class="li-right">'+(isApplied?'<span class="small muted">applied</span>'

  };
  host.innerHTML='<div class="card"><h2>Use of home</h2>'+
    '<p class="small muted">If you see clients or do your admin at home, part of running that home is a business cost. HMRC lets you work it out two ways, and you can pick a different one each tax year.</p>'+
    yearStrip+
    (status.filed?'<div class="vmsg warn">\ud83d\uddc4 You have marked <b>'+esc(ty)+'</b> as filed. Changing anything below changes figures you have already submitted \u2014 if this is a correction, keep a note of what you changed and why.</div>':'')+
    (applied.method&&applied.method!=="none"
      ? '<div class="vmsg ok">\ud83d\udd12 <b>'+esc(applied.method==="simplified"?"Simplified":"Actual costs")+'</b> is what '+esc(ty)+' uses \u2014 '+money(uohMonthlyFor(applied))+' a month, '+money(yearAmt)+' for the year. It is already in your costs and tax estimate.'+
        (inForce.inherited?' <b>Carried forward from '+esc(inForce.from)+'</b> \u2014 it has no figures of its own yet, so editing '+esc(inForce.from)+' would move '+esc(ty)+' too.':'')+'</div>'
      : '<div class="vmsg warn">Nothing is being claimed for use of home in '+esc(ty)+'. Compare the two methods below and apply whichever suits.</div>')+
    (prevSrc&&!uohYears()[ty]
      ? '<button class="btn sec full mt" id="uohCopy">\u2398 Copy '+esc(prevSrc)+'\u2019s figures into '+esc(ty)+'</button>'+
        '<p class="prev">Gives '+esc(ty)+' its own copy of those hours, rooms and bills to edit \u2014 bills usually move by a percentage rather than wholesale. What is being claimed does not change.</p>'
      : '')+
    '<div class="grp-h" style="margin-top:16px">Compare and choose for '+esc(ty)+'</div>'+
    '<p class="small muted" style="margin:0 0 6px">Switching between these only changes what you are looking at. Your figures do not move until you tap <b>Use this</b>.</p>'+
    '<div style="padding:0 2px">'+methodRow("simplified")+methodRow("actual")+methodRow("none")+'</div>'+
    '<div class="grp-h" style="margin-top:18px">Work out the numbers for '+esc(ty)+'</div>'+
    '<div class="seg" id="uohM" style="display:inline-flex">'+
      '<button data-m="simplified" class="'+(uohEdit==="simplified"?"on":"")+'">Simplified</button>'+
      '<button data-m="actual" class="'+(uohEdit==="actual"?"on":"")+'">Actual costs</button>'+
    '</div>'+
    '<div id="uohBody" class="mt"></div>'+
    '<p class="small muted mt">Goes in box 21 of your tax return. Mortgage <b>capital</b> repayments are never allowable \u2014 only the interest.</p>'+
    '<label class="colchk" style="margin-top:14px"><input type="checkbox" id="uohFiled"'+(status.filed?" checked":"")+'> I have filed my '+esc(ty)+' return</label>'+
    '<p class="prev">Only a reminder to yourself \u2014 it never locks anything or changes a figure.</p>'+
    '</div>';
  const bodyEl=host.querySelector("#uohBody");
  const suggested=uohSessionHours();
  function saveDraft(patch,label){
    const ys=uohYears();

    ys[ty]=Object.assign(cur,patch);
    if(!ys[ty].method)ys[ty].method=applied.method||"none";

  function drawMethod(){
    if(uohEdit==="simplified"){

        '<input type="number" min="0" max="744" step="1" id="uohH" value="'+esc(draft.hours)+'">'+
        '<p class="small muted">Count everything, not just sessions: notes, admin, CPD, supervision you attend from home.'+
        (suggested?' You logged about <b>'+suggested+' sessions a month</b> at home recently \u2014 your real hours will be higher than that.':'')+'</p>'+
        '<div class="acc-work"><div>25\u201350 hrs = \u00a310/mo</div><div>51\u2013100 hrs = \u00a318/mo</div><div>101+ hrs = \u00a326/mo</div>'+
        '<div class="small muted" style="margin-top:5px">Under 25 hours a month there is no flat-rate claim. At '+esc(draft.hours||0)+' hrs this is <b>'+money(simpAmt)+'/mo</b>.</div></div>';
      bodyEl.querySelector("#uohH").onchange=async e=>{

        go("tax",{keepScroll:true});};
    }else{

      bodyEl.innerHTML='<div class="grp-h" style="margin-top:0">Your home in '+esc(ty)+'</div>'+
        '<div class="field2">'+
          '<div><label>Rooms in your home <span class="muted small">(excl. kitchen/bathroom)</span></label><input type="number" min="1" step="1" id="uohR" value="'+esc(draft.rooms)+'"></div>'+
          '<div><label>Rooms used for work</label><input type="number" min="0" step="1" id="uohW" value="'+esc(draft.workRooms)+'"></div>'+
        '</div>'+

        '<input type="number" min="1" max="100" step="1" id="uohP" value="'+esc(draft.businessPct)+'">'+
        '<p class="small muted">A room used for work in the day and family in the evening is not 100%.</p>'+
        '<div class="grp-h" style="margin-top:14px">Household costs for '+esc(ty)+'</div>'+
        '<div class="field2">'+row("rent","Rent or mortgage interest","interest only")+row("councilTax","Council tax")+'</div>'+
        '<div class="field2">'+row("gas","Gas")+row("electric","Electricity")+'</div>'+
        '<div class="field2">'+row("water","Water")+row("broadband","Broadband")+'</div>'+
        '<div class="acc-work"><div>'+money(uohActualAnnual(draft))+' a year \u00f7 12 = <b>'+money(actAmt)+'/mo</b></div>'+
        '<div class="small muted" style="margin-top:5px">Costs are held per tax year, so last year\u2019s bills stay as they were.</div></div>';
      const save=async()=>{
        const costs=Object.assign({},draft.costs||{});

    await commit((fl.checked?"Marked ":"Unmarked ")+ty+" as filed");
    go("tax",{keepScroll:true});};
  drawMethod();
}

/* ---- Settings › Cancellations & DNAs ----
   Edits `settings.cancelRules` only. Nothing here reaches an existing session: the charge was
   stamped when that session was logged (see cancelPctFor), which is the whole point of stamping
   it. Windows are stored unsorted and read longest-first by cancelPolicy. */
function wireCancelRules(v){
  const host=v.querySelector("#cxRules"); if(!host)return;
  const sg=settings();
  const rules=()=>{sg.cancelRules=sg.cancelRules||{window:[],dnaChargePct:100};
    sg.cancelRules.window=sg.cancelRules.window||[]; return sg.cancelRules;};
  const save=async label=>{await commit(label);};
  const draw=()=>{
    const w=rules().window.slice().sort((a,b)=>(+b.hoursBefore||0)-(+a.hoursBefore||0));
    host.innerHTML=w.length?w.map((r,i)=>
      '<div class="cxrow" data-i="'+i+'">'+
        '<span class="cxl">at least</span>'+
        '<input type="number" min="0" step="1" data-f="hoursBefore" value="'+(+r.hoursBefore||0)+'">'+
        '<span class="cxl">hrs notice →</span>'+
        '<input type="number" min="0" max="100" step="5" data-f="chargePct" value="'+(+r.chargePct||0)+'">'+
        '<span class="cxl">%</span>'+
        '<button class="rmx" data-x="'+i+'" title="Remove">✕</button>'+
      '</div>').join("")
      :'<p class="small muted">No notice periods set — a late cancellation will be charged in full.</p>';
    host.innerHTML+='<p class="small muted mt">Lines are ordered from most notice to least. A cancellation is charged by the first line it qualifies for. If it doesn’t reach any of them — or you didn’t record a cancellation date — you charge the <b>full fee</b>.</p>';
    host.querySelectorAll(".cxrow").forEach(row=>{
      const i=+row.dataset.i;
      row.querySelectorAll("[data-f]").forEach(inp=>inp.onchange=async()=>{
        const sorted=rules().window.slice().sort((a,b)=>(+b.hoursBefore||0)-(+a.hoursBefore||0));
        const tgt=sorted[i]; if(!tgt)return;
        const f=inp.dataset.f;
        tgt[f]=f==="chargePct"?Math.max(0,Math.min(100,Math.round(+inp.value||0))):Math.max(0,Math.round(+inp.value||0));
        await save("Cancellation policy updated"); draw();});});
    host.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
      const i=+b.dataset.x;
      const sorted=rules().window.slice().sort((a,b2)=>(+b2.hoursBefore||0)-(+a.hoursBefore||0));
      const tgt=sorted[i]; if(!tgt)return;
      rules().window=rules().window.filter(x=>x!==tgt);
      await save("Removed a cancellation notice period"); draw();});
  };
  const add=v.querySelector("#cxAdd");
  if(add)add.onclick=async()=>{rules().window.push({hoursBefore:48,chargePct:50});
    await save("Added a cancellation notice period"); draw(); Sfx.tick();};
  const dna=v.querySelector("#cxDna");
  if(dna){dna.value=rules().dnaChargePct;
    dna.onchange=async()=>{rules().dnaChargePct=Math.max(0,Math.min(100,Math.round(+dna.value||0)));
      dna.value=rules().dnaChargePct; await save("DNA charge: "+rules().dnaChargePct+"%");};}
  draw();
}

const RAWCOLS=[
 {k:"client",t:"Client"},{k:"num",t:"#",n:1},{k:"date",t:"Date",d:1},{k:"time",t:"Time"},{k:"mode",t:"Mode"},
 {k:"location",t:"Location"},{k:"room",t:"Room"},{k:"rate",t:"Rate",n:1,m:1},{k:"paidYN",t:"Paid"},{k:"paidDate",t:"Paid date",d:1},
 {k:"overdueYN",t:"Overdue"},{k:"roomRate",t:"Room £",n:1,m:1},{k:"roomPaid",t:"Room paid"},{k:"roomPaidDate",t:"Room paid date",d:1},{k:"roomDue",t:"Room due"},
 {k:"lateCancel",t:"Late cancel"},{k:"attend",t:"Attended"},{k:"chargePct",t:"Charge %",n:1},{k:"fullRate",t:"Full fee",n:1,m:1},
 {k:"invoice",t:"Invoice"},{k:"notes",t:"Notes"},{k:"status",t:"Status"},{k:"taxYear",t:"Tax yr"},{k:"week",t:"Wk",n:1}];
function recOf(s,d){return {client:s.client,num:s.num,date:s.date,time:s.time||"",mode:s.mode||"",location:s.location||"",room:s.room||"",
  rate:d.rate,paidYN:d.clientPaid?"Y":"N",paidDate:s.paidDate||"",overdueYN:d.overdue?"Y":"N",roomRate:d.roomRate,roomPaid:s.roomPaid||"",
  roomPaidDate:s.roomPaidDate||"",roomDue:d.roomDue,lateCancel:isLateCancel(s)?"Y":"",
  attend:d.cancelKind==="dna"?"DNA":d.cancelKind==="late"?"Late cancel":"Y",
  chargePct:d.cancelPct,fullRate:d.fullRate,
  invoice:s.invoice||"",notes:s.notes||"",status:d.status||"",taxYear:d.taxYear,week:d.week};}
let rawF={q:"",client:"",ty:"",paid:"",loc:"",sk:"date",sd:-1,cols:null};
let supF={q:"",sk:"date",sd:-1,cols:null};
let rawSeg="sessions";
/* A panel now, not a tab - it lives inside Money > Table (see VIEWS.money). */
function rawPanel(){
  const v=el('<div class="view active"></div>');
  const segHtml='<div class="seg mb" style="display:inline-flex"><button data-rs="sessions" class="'+(rawSeg==="sessions"?"on":"")+'">Sessions</button><button data-rs="supervision" class="'+(rawSeg==="supervision"?"on":"")+'">Supervision</button></div>';
  if(rawSeg==="supervision"){
    const SUPCOLS=[{k:"date",t:"Date",d:1},{k:"supervisor",t:"Supervisor"},{k:"count",t:"Client hrs",n:1},{k:"cost",t:"Cost",n:1,m:1},{k:"clients",t:"Clients discussed"},{k:"taxYear",t:"Tax yr"}];
    if(!supF.cols){try{supF.cols=JSON.parse(localStorage.getItem("tt_supcols"))}catch(e){} if(!supF.cols||!supF.cols.length)supF.cols=SUPCOLS.map(c=>c.k);}
    const fmtSupCell=(r,c)=>{if(c.m)return gbp(r[c.k]);if(c.d)return esc(fmtD(r[c.k]));return esc(r[c.k]==null?"":r[c.k]);};
    function filteredSup(){
      let rows=(S.supervision||[]).map(s=>({date:s.date||"",supervisor:s.supervisor||"",count:+(s.count)||1,cost:+(s.cost)||0,clients:(s.clients||[]).join(", "),taxYear:taxYear(s.date)}));
      const q=(supF.q||"").toLowerCase();
      if(q)rows=rows.filter(r=>SUPCOLS.some(c=>String(r[c.k]==null?"":r[c.k]).toLowerCase().includes(q)));
      const sc=SUPCOLS.find(c=>c.k===supF.sk)||{};
      rows.sort((a,b)=>{let x=a[supF.sk],y=b[supF.sk];if(supF.sk==="date"){x=x?parseD(x):0;y=y?parseD(y):0;}else if(sc.n){x=+x||0;y=+y||0;}else{x=String(x||"").toLowerCase();y=String(y||"").toLowerCase();}return(x>y?1:x<y?-1:0)*supF.sd;});
      return rows;
    }
    v.innerHTML=segHtml+'<div class="card"><div class="search"><input id="supq" placeholder="Search all fields…" value="'+esc(supF.q)+'"></div>'+
      '<details class="mt"><summary>Choose columns &amp; export</summary><div id="supColsBox" class="mt"></div><button class="btn sm sec mt" id="supcsv">Export filtered to CSV</button></details>'+
      '<div id="supcount" class="small muted mt"></div></div>'+
      '<div class="card" style="padding:6px"><div class="rawscroll"><table id="suptable"></table></div></div>';
    const scb=v.querySelector("#supColsBox");
    scb.innerHTML=SUPCOLS.map(c=>'<label class="colchk"><input type="checkbox" data-k="'+c.k+'"'+(supF.cols.includes(c.k)?" checked":"")+'> '+esc(c.t)+'</label>').join("");
    scb.querySelectorAll("input").forEach(x=>x.onchange=()=>{const k=x.dataset.k;if(x.checked){if(!supF.cols.includes(k))supF.cols.push(k);}else supF.cols=supF.cols.filter(z=>z!==k);try{localStorage.setItem("tt_supcols",JSON.stringify(supF.cols))}catch(e){} drawSup();});
    function drawSup(){
      const rows=filteredSup();const cols=SUPCOLS.filter(c=>supF.cols.includes(c.k));
      const thead='<thead><tr>'+cols.map(c=>'<th data-k="'+c.k+'"'+(c.n?' class="num"':'')+'>'+esc(c.t)+(supF.sk===c.k?(supF.sd>0?" ▲":" ▼"):"")+'</th>').join("")+'</tr></thead>';
      const tb='<tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td'+(c.n?' class="num"':'')+'>'+fmtSupCell(r,c)+'</td>').join("")+'</tr>').join("")+'</tbody>';
      v.querySelector("#suptable").innerHTML=thead+tb;
      v.querySelectorAll("#suptable th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(supF.sk===k)supF.sd=-supF.sd;else{supF.sk=k;supF.sd=1;}drawSup();});
      const totCost=rows.reduce((a,r)=>a+(+r.cost||0),0);
      v.querySelector("#supcount").textContent=rows.length+" rows · "+cols.length+" columns shown · total "+gbp(totCost);
      v.querySelector("#supcsv").onclick=()=>{const head=cols.map(c=>c.t).join(",");
        const lines=rows.map(r=>cols.map(c=>{let val=r[c.k];val=val==null?"":String(val);return /[",\n]/.test(val)?'"'+val.replace(/"/g,'""')+'"':val;}).join(","));
        download("therapy-supervision-table-"+isoD(today())+".csv",[head,...lines].join("\n"),"text/csv");toast("CSV downloaded");};
    }
    v.querySelector("#supq").oninput=e=>{supF.q=e.target.value;drawSup();};
    drawSup();
    v.querySelectorAll("[data-rs]").forEach(bt=>bt.onclick=()=>{rawSeg=bt.dataset.rs;go("money",{seg:"table",keepScroll:true});});
    return v;
  }
  if(!rawF.cols){try{rawF.cols=JSON.parse(localStorage.getItem("tt_cols"))}catch(e){} if(!rawF.cols||!rawF.cols.length)rawF.cols=["client","num","date","time","location","rate","paidYN","paidDate","roomPaidDate","overdueYN","status"];}
  const cOpt=["",...[...new Set(S.sessions.map(s=>s.client))].sort()];
  const tyOpt=["",...[...new Set(S.sessions.map(s=>derive(s).taxYear).filter(Boolean))].sort().reverse()];
  const lOpt=["",...S.rooms.map(r=>r.location)];
  v.innerHTML=segHtml+'<div class="card"><div class="search"><input id="rq" placeholder="Search all fields…" value="'+esc(rawF.q)+'"></div>'+
    '<div class="row" style="gap:6px;flex-wrap:wrap">'+
    '<select id="fCl">'+cOpt.map(c=>'<option value="'+esc(c)+'"'+(c===rawF.client?" selected":"")+'>'+(c||"All clients")+'</option>').join("")+'</select>'+
    '<select id="fTy">'+tyOpt.map(c=>'<option value="'+esc(c)+'"'+(c===rawF.ty?" selected":"")+'>'+(c||"All tax yrs")+'</option>').join("")+'</select>'+
    '<select id="fPaid"><option value="">Any status</option><option value="Y"'+(rawF.paid==="Y"?" selected":"")+'>Paid</option><option value="N"'+(rawF.paid==="N"?" selected":"")+'>Unpaid</option><option value="OD"'+(rawF.paid==="OD"?" selected":"")+'>Overdue</option></select>'+
    '<select id="fLoc">'+lOpt.map(c=>'<option value="'+esc(c)+'"'+(c===rawF.loc?" selected":"")+'>'+(c||"All locations")+'</option>').join("")+'</select></div>'+
    '<details class="mt"><summary>Choose columns &amp; export</summary><div id="colsBox" class="mt"></div><button class="btn sm sec mt" id="rcsv">Export filtered to CSV</button></details>'+
    '<div id="rcount" class="small muted mt"></div></div>'+
    '<div class="card" style="padding:6px"><div class="rawscroll"><table id="rtable"></table></div></div>';
  const cb=v.querySelector("#colsBox");
  cb.innerHTML=RAWCOLS.map(c=>'<label class="colchk"><input type="checkbox" data-k="'+c.k+'"'+(rawF.cols.includes(c.k)?" checked":"")+'> '+esc(c.t)+'</label>').join("");
  cb.querySelectorAll("input").forEach(x=>x.onchange=()=>{const k=x.dataset.k;if(x.checked){if(!rawF.cols.includes(k))rawF.cols.push(k);}else rawF.cols=rawF.cols.filter(z=>z!==k);try{localStorage.setItem("tt_cols",JSON.stringify(rawF.cols))}catch(e){} draw();});
  const fmtCell=(rec,c)=>{let val=rec[c.k];if(c.m)return gbp(val);if(c.d)return esc(fmtDMY(val));return esc(val==null?"":val);};
  function filtered(){
    let rows=S.sessions.map(s=>{const d=derive(s);return recOf(s,d);});
    const q=rawF.q.toLowerCase();
    if(q)rows=rows.filter(r=>RAWCOLS.some(c=>String(r[c.k]==null?"":r[c.k]).toLowerCase().includes(q)));
    if(rawF.client)rows=rows.filter(r=>r.client===rawF.client);
    if(rawF.ty)rows=rows.filter(r=>r.taxYear===rawF.ty);
    if(rawF.loc)rows=rows.filter(r=>r.location===rawF.loc);
    if(rawF.paid==="Y")rows=rows.filter(r=>r.paidYN==="Y");
    else if(rawF.paid==="N")rows=rows.filter(r=>r.paidYN==="N");
    else if(rawF.paid==="OD")rows=rows.filter(r=>r.overdueYN==="Y");
    const sc=RAWCOLS.find(c=>c.k===rawF.sk)||{};
    rows.sort((a,b)=>{let x=a[rawF.sk],y=b[rawF.sk];
      if(rawF.sk==="date"||rawF.sk==="paidDate"){x=x?parseD(x):0;y=y?parseD(y):0;}
      else if(sc.n){x=+x||0;y=+y||0;}else{x=String(x==null?"":x).toLowerCase();y=String(y==null?"":y).toLowerCase();}
      return (x>y?1:x<y?-1:0)*rawF.sd;});
    return rows;
  }
  function draw(){
    const rows=filtered();const cols=RAWCOLS.filter(c=>rawF.cols.includes(c.k));
    const thead='<thead><tr>'+cols.map(c=>'<th data-k="'+c.k+'"'+(c.n?' class="num"':'')+'>'+esc(c.t)+(rawF.sk===c.k?(rawF.sd>0?" ▲":" ▼"):"")+'</th>').join("")+'</tr></thead>';
    const tb='<tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td'+(c.n?' class="num"':'')+'>'+fmtCell(r,c)+'</td>').join("")+'</tr>').join("")+'</tbody>';
    const tbl=v.querySelector("#rtable");tbl.innerHTML=thead+tb;
    tbl.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(rawF.sk===k)rawF.sd=-rawF.sd;else{rawF.sk=k;rawF.sd=1;}draw();});
    v.querySelector("#rcount").textContent=rows.length+" rows · "+cols.length+" columns shown";
    v.querySelector("#rcsv").onclick=()=>{const head=cols.map(c=>c.t).join(",");
      const lines=rows.map(r=>cols.map(c=>{let val=c.m?r[c.k]:r[c.k];val=val==null?"":String(val);return /[",\n]/.test(val)?'"'+val.replace(/"/g,'""')+'"':val;}).join(","));
      download("therapy-table-"+isoD(today())+".csv",[head,...lines].join("\n"),"text/csv");toast("CSV downloaded");};
  }
  v.querySelector("#rq").oninput=e=>{rawF.q=e.target.value;draw();};
  v.querySelector("#fCl").onchange=e=>{rawF.client=e.target.value;draw();};
  v.querySelector("#fTy").onchange=e=>{rawF.ty=e.target.value;draw();};
  v.querySelector("#fPaid").onchange=e=>{rawF.paid=e.target.value;draw();};
  v.querySelector("#fLoc").onchange=e=>{rawF.loc=e.target.value;draw();};
  v.querySelectorAll("[data-rs]").forEach(bt=>bt.onclick=()=>{rawSeg=bt.dataset.rs;go("money",{seg:"table",keepScroll:true});});
  draw();return v;
}

function freqDays(c){const f=(c&&c.frequency||"").toLowerCase();

/* Attendance: how regularly a client attends vs their expected frequency, since their first session.
   Gaps of 3× the expected interval or more are treated as "pauses" and excluded from the denominator
   (but recorded so they can be shown as a footnote). For Ongoing clients a pause running up to today is
   flagged separately so their status can be reviewed. */
/* ===== Trends: current vs historical =====
   Every list on Trends grows with each client the practice has ever had, and a therapist five
   years in does not want to scroll two hundred finished clients to reach the eight they are
   seeing this month. A client who has finished still counts — in the average, the totals, the
   funnel — but their individual row has stopped earning its place, so it folds into an aggregate
   that expands on demand.

   ONE definition, shared by every card, so the same client cannot be listed as current in one and
   folded as historical in the next. Status leads, because it is the therapist's own word for it;
   recency is the backstop, because a status nobody remembered to change is exactly what the
   "Review status" card above exists to catch. */
const TRENDS_RECENT_DAYS=365;
const SESS_VISIBLE=60;      /* most recent sessions listed in full before the tax-year folds */
/* Folding only earns its place once there is something to fold. Below this, hiding a handful of
   finished clients behind a tap costs a reader more than the rows ever did — a three-client
   practice should look exactly as it always has. */
const AGED_MIN=8;
function lastSessionDates(){
  const m={};
  S.sessions.forEach(s=>{const k=(s.client||"").toLowerCase();if(!k)return;
    const d=parseD(s.date);if(!d)return;
    if(!m[k]||d>m[k])m[k]=d;});

}
function trendsIsCurrent(c,last){
  if(!c)return false;

  if(!last)return true;                       /* nothing logged yet — nothing to age out on */
  return (today()-last)/86400000<=TRENDS_RECENT_DAYS;
}

function clientAttendance(c){
  const code=(c&&c.code||"").toLowerCase(); if(!code)return null;
  const rs=S.sessions.filter(s=>(s.client||"").toLowerCase()===code)
    .map(s=>({d:parseD(s.date),lc:isCancelled(s)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
  if(!rs.length)return null;
  const fd=freqDays(c);
  const ongoing=(c.status||"")==="Ongoing";
  const first=rs[0].d, last=rs[rs.length-1].d;
  const end=ongoing?today():last;
  const pauses=[]; let pauseDays=0;
  for(let i=1;i<rs.length;i++){
    const gap=(rs[i].d-rs[i-1].d)/86400000;
    if(gap>=3*fd){ pauses.push({from:rs[i-1].d,to:rs[i].d,days:Math.round(gap)}); pauseDays+=gap-fd; }
  }
  let currentPause=null;
  if(ongoing){ const tail=(end-last)/86400000;
    if(tail>=3*fd){ currentPause={from:last,to:end,days:Math.round(tail)}; pauseDays+=tail-fd; } }
  const spanDays=Math.max(0,(end-first)/86400000-pauseDays);
  const expected=Math.max(1,Math.round(spanDays/fd)+1);
  const attended=rs.filter(x=>!x.lc).length;
  const pct=Math.min(100,Math.round(attended/expected*100));
  return {pct,attended,expected,pauses,currentPause,first,last,ongoing,fd,n:rs.length};
}
/* Rolling attendance over time: bucket every month from the earliest first-session to now,
   summing attended vs expected sessions across all tracked clients (same active-span / pause
   logic as clientAttendance, clipped to the month). The plotted line is a 3-month moving
   ratio of attended/expected, which smooths the noise of individual months. */
function rollingAttendanceSeries(rows){
  if(!rows.length)return [];
  const DAY=86400000,t=today();
  let minD=null; rows.forEach(x=>{if(!minD||x.a.first<minD)minD=x.a.first;});
  if(!minD)return [];
  const months=[];
  let cur=new Date(minD.getFullYear(),minD.getMonth(),1);
  const stop=new Date(t.getFullYear(),t.getMonth(),1);
  while(cur<=stop){
    const start=new Date(cur.getFullYear(),cur.getMonth(),1);
    const end=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    months.push({lab:start.toLocaleDateString("en-GB",{month:"short",year:"2-digit"}),start,end,attended:0,expected:0});
    cur=end;
  }
  const overlap=(a0,a1,b0,b1)=>Math.max(0,Math.min(a1,b1)-Math.max(a0,b0));
  rows.forEach(x=>{
    const a=x.a,code=(x.c.code||"").toLowerCase();
    const dates=S.sessions.filter(s=>(s.client||"").toLowerCase()===code&&!isCancelled(s))
      .map(s=>parseD(s.date)).filter(Boolean);
    const activeEnd=(a.ongoing?t:a.last).getTime();
    const pauses=a.pauses.slice(); if(a.currentPause)pauses.push(a.currentPause);
    months.forEach(m=>{
      const ms=m.start.getTime(),me=m.end.getTime();
      let act=overlap(ms,me,a.first.getTime(),activeEnd);
      pauses.forEach(p=>{act-=overlap(ms,me,p.from.getTime(),p.to.getTime());});
      if(act>0)m.expected+=act/DAY/a.fd;
      m.attended+=dates.filter(d=>d>=m.start&&d<m.end).length;
    });
  });
  const W=3;
  return months.map((m,i)=>{let sa=0,se=0;for(let q=Math.max(0,i-W+1);q<=i;q++){sa+=months[q].attended;se+=months[q].expected;}
    return {lab:m.lab,avg:se>0?Math.round(sa/se*100):null};});
}

     <label>Notes done?</label><input id="f_notes" value="${esc(m.notes||"")}" placeholder="Y / note">
     <p class="small muted">A marker that your notes are written up, not the notes themselves — keep the clinical record where you normally do.</p>
     <label style="margin-top:14px">Did it go ahead?</label>
     <select id="f_attend">${opts2([["","Yes — attended"],["late","Late cancellation"],["dna","Did not attend (DNA)"]],attendVal(m))}</select>
     <div id="f_cxWrap" style="display:none">
       <div class="field2">
         <div><label>Cancelled on <span class="muted small">(optional)</span></label><input type="date" id="f_cxOn" value="${esc(m.cancelledAt||"")}"></div>
         <div><label>Charge (% of fee)</label><input type="number" min="0" max="100" step="5" id="f_cxPct" value="${esc(m.cancelCharge==null?"":m.cancelCharge)}"></div>
       </div>
       <p class="small muted" id="f_cxNote"></p>
     </div>
     <div class="vbanner" id="vbanner"></div>
     <div class="row mt" style="gap:8px"><button class="btn full" id="save">Save session</button></div>
     ${isNew?"":'<button class="btn danger full mt" id="del">Delete session</button>'}`;
    const g=id=>body.querySelector(id);
    const sync=()=>{m.client=g("#f_client").value;m.date=g("#f_date").value;m.time=g("#f_time").value;m.mode=g("#f_mode").value;
      m.num=g("#f_num").value;m.location=g("#f_loc").value;m.room=g("#f_room").value;m.paidDate=g("#f_paid").value;
      m.invoice=g("#f_inv").value;m.roomPaid=g("#f_rp").value;m.roomPaidDate=g("#f_rpd").value;m.notes=g("#f_notes").value;
      /* `lateCancel` stays the flag it always was, so older builds and the notes convention still
         read correctly; `cancelKind` carries the finer distinction and `cancelCharge` the money. */
      const kind=g("#f_attend").value;
      m.cancelKind=kind||null;
      m.lateCancel=(kind==="late");
      if(!kind){m.cancelledAt="";m.cancelCharge=null;}
      else{
        m.cancelledAt=g("#f_cxOn").value||"";
        const raw=g("#f_cxPct").value.trim();
        m.cancelCharge=raw===""?cancelPolicyPct(kind,cancelNoticeHrs(m)):Math.max(0,Math.min(100,+raw||0));
      }};
    g("#f_client").onchange=()=>{const code=g("#f_client").value; sync(); m.client=code;
      if(isNew&&code){const sg=suggestFor(code);Object.assign(m,{num:sg.num,time:sg.time,mode:sg.mode,location:sg.location,room:sg.room});
        if(!lockDate)m.date=sg.date;}
      draw();
      if(isNew&&code)body.querySelector("#sugHint").innerHTML='<div class="hint">✨ Pre-filled from this client’s last session — adjust anything, then Save.</div>';};
    /* A room billed as monthly rent is settled once a month in Business costs, so asking whether
       this session's room fee was paid is a question with no answer. Hide it and say where it went. */
    const paintRoomPaid=()=>{
      const rm=roomFor(g("#f_loc").value), monthly=rm&&roomBilling(rm)==="monthly";
      g("#f_rpWrap").style.display=monthly?"none":"";
      const note=g("#f_rpNote"); note.style.display=monthly?"":"none";
      if(monthly)note.innerHTML="🏠 <b>"+esc(rm.location)+"</b> is on a monthly rent, so there’s nothing to settle per session. "+
        "Tick its rent off each month in <b>Revenue › Business costs</b>.";
    };
    paintRoomPaid();
    const refreshHint=()=>{const d=derive(m);
      body.querySelector(".hint").innerHTML=`Rate: <b>${gbp(d.rate)}</b>`+
        (d.cancelPct<100?` <span class="muted">(${d.cancelPct}% of ${gbp(d.fullRate)})</span>`:"")+
        `${d.roomRate?` · Room: ${gbp(d.roomRate)} (${esc(d.due)})`:""} · ${d.taxYear} ${d.past?"· past":"· upcoming"}`;};
    /* The policy supplies the opening figure; it is only ever a starting point, and whatever is
       left in the box is what gets stamped on this session.
       `data-auto` marks a figure this code put there rather than one the therapist typed, so
       adding the cancellation date afterwards re-derives it — without that, the 100% filled in
       while the date was unknown would silently stick even once the notice was known. Typing in
       the box clears the mark and the number is then left alone. */
    const paintCancel=()=>{
      const kind=g("#f_attend").value;
      g("#f_cxWrap").style.display=kind?"":"none";
      if(!kind){refreshHint();return;}
      const pctIn=g("#f_cxPct");
      const probe={date:g("#f_date").value,time:g("#f_time").value,cancelledAt:g("#f_cxOn").value||""};
      const hrs=cancelNoticeHrs(probe);
      if(pctIn.value.trim()===""||pctIn.dataset.auto==="1"){
        pctIn.value=cancelPolicyPct(kind,hrs); pctIn.dataset.auto="1";
      }
      const pct=Math.max(0,Math.min(100,+pctIn.value||0));
      const full=effRate(g("#f_client").value,g("#f_date").value)||0;
      g("#f_cxNote").innerHTML=(hrs==null
          ? "No cancellation date given, so the full fee is assumed — add the date or set the charge yourself. "
          : Math.max(0,Math.round(hrs))+" hours’ notice. ")+
        "Charging <b>"+pct+"%</b> of "+gbp(full)+" = <b>"+gbp(Math.round(full*pct)/100)+"</b>. "+
        "Change it here for this session only — the policy itself lives in <b>⚙ Settings › Cancellations &amp; DNAs</b>.";
      refreshHint();
    };
    g("#f_attend").addEventListener("change",()=>{const p=g("#f_cxPct");p.value="";delete p.dataset.auto;sync();paintCancel();});
    g("#f_cxOn").addEventListener("change",()=>{sync();paintCancel();});
    g("#f_cxPct").addEventListener("input",()=>{delete g("#f_cxPct").dataset.auto;});
    g("#f_cxPct").addEventListener("change",()=>{sync();paintCancel();});
    paintCancel();
    ["#f_date","#f_loc","#f_paid","#f_rp"].forEach(id=>g(id).addEventListener("change",()=>{sync();paintRoomPaid();paintCancel();}));
    g("#save").onclick=async()=>{sync();
      if(!m.client){toast("Choose a client");Sfx.error();return}
      if(!m.date){toast("Add a date");Sfx.error();return}
      if(!m.room)m.room="-";
      const vr=validateSession(m);renderValidation(vr.errors,vr.warnings);
      if(vr.errors.length){Sfx.error();const vb=body.querySelector("#vbanner");if(vb)vb.scrollIntoView({behavior:"smooth",block:"nearest"});return;}
      if(vr.warnings.length&&!pendingWarn){pendingWarn=true;const sb=body.querySelector("#save");if(sb)sb.textContent="Save anyway";Sfx.error();const vb=body.querySelector("#vbanner");if(vb)vb.scrollIntoView({behavior:"smooth",block:"nearest"});return;}
      const exists=S.sessions.find(x=>x._id===m._id);
      const prevComplete=exists?derive(exists).complete:false;
      if(exists){Object.assign(exists,m);await commit("Edited session: "+m.client+" "+m.date);}
      else{S.sessions.push(m);await commit("Added session: "+m.client+" "+m.date);}
      const dNow=derive(m);const justCompleted=dNow.past&&dNow.complete&&!prevComplete;
      let milestone=null;
      if(!exists&&!isCancelled(m)){const cnt=S.sessions.filter(x=>(x.client||"").toLowerCase()===(m.client||"").toLowerCase()&&!isCancelled(x)).length;
        milestone=[6,12,20,30,50,75,100].find(T=>cnt-1<T&&cnt>=T)||null;}
      closeSheet();
      gameShow({batch:1,completed:justCompleted,milestone:milestone,milestoneClient:m.client,toast:justCompleted?"Session complete ✓":(exists?"Saved":"Session logged ✨")},{});
      go(cur);};
    if(!isNew)g("#del").onclick=async()=>{if(!confirm("Delete this session?"))return;
      S.sessions=S.sessions.filter(x=>x._id!==m._id);await commit("Deleted session: "+m.client+" "+m.date);closeSheet();toast("Deleted");go(cur);};
  };
  draw();
  body.addEventListener("input",resetWarn);body.addEventListener("change",resetWarn);
  openSheet(isNew?"New session":"Edit session",body);
}

/* ============ Quick-log command bar (natural-language session entry) ============ */
function parseQuickLog(text){
  const raw=(text||"").trim(); if(!raw)return null;
  const toks=raw.split(/\s+/);
  const res={client:null,clientAmbig:[],date:null,time:null,mode:null,location:null,paid:false,unmatched:[]};
  const codes=S.clients.map(c=>c.code);
  const locs=S.rooms.map(r=>r.location);
  const wd={mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6,sun:0,sunday:0};
  toks.forEach(tok=>{
    const w=tok.toLowerCase().replace(/[.,;]+$/,"");
    if(!w)return;
    if(w==="paid"){res.paid=true;return;}
    if(w==="online"){res.mode="Online";return;}
    if(w==="in-person"||w==="inperson"||w==="f2f"){res.mode="In-person";return;}
    if(w==="today"){res.date=isoD(today());return;}
    if(w==="yesterday"){res.date=isoD(addDays(today(),-1));return;}
    if(w==="tomorrow"){res.date=isoD(addDays(today(),1));return;}
    if(wd[w]!=null){const t=today();let diff=wd[w]-t.getDay();
      if(diff>3)diff-=7; if(diff<-3)diff+=7;
      res.date=isoD(addDays(t,diff));return;}
    let m2=w.match(/^(\d{1,2}):(\d{2})$/);
    if(m2){res.time=String(+m2[1]).padStart(2,"0")+":"+m2[2];return;}
    m2=w.match(/^(\d{1,2})(am|pm)$/);
    if(m2){let h=(+m2[1])%12;if(m2[2]==="pm")h+=12;res.time=String(h).padStart(2,"0")+":00";return;}
    m2=w.match(/^\d{4}-\d{2}-\d{2}$/);
    if(m2&&parseD(w)){res.date=w;return;}
    m2=w.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if(m2){const t=today();let y=m2[3]?+m2[3]:t.getFullYear();if(y<100)y+=2000;
      res.date=y+"-"+String(+m2[2]).padStart(2,"0")+"-"+String(+m2[1]).padStart(2,"0");return;}
    if(!res.client){
      const exact=codes.filter(c=>c.toLowerCase()===w);
      const pref=exact.length?exact:codes.filter(c=>c.toLowerCase().startsWith(w));
      const cand=pref.length?pref:codes.filter(c=>c.toLowerCase().includes(w));
      if(cand.length===1){res.client=cand[0];return;}
      if(cand.length>1){res.clientAmbig=cand.slice(0,4);return;}
    }
    if(!res.location){
      const lm=locs.find(L=>{const ll=L.toLowerCase();return ll===w||ll.startsWith(w)||ll.split(/\s+/).indexOf(w)>=0;});
      if(lm){res.location=lm;return;}
    }
    res.unmatched.push(tok);
  });
  return res;
}

  const inp=host.querySelector("#ql"),out=host.querySelector("#qlout"),btn=host.querySelector("#qlGo");
  let cur=null,armed=false;
  const chip=(txt,cls)=>'<span class="chip '+(cls||"s")+'">'+txt+'</span>';
  function paint(){
    const p=parseQuickLog(inp.value);
    armed=false;btn.textContent="Log it";
    if(!p){out.innerHTML='';btn.style.display="none";cur=null;return;}
    let h="";
    if(p.client)h+=chip("👤 "+esc(p.client),"y");
    else if(p.clientAmbig.length)h+=chip("who? "+p.clientAmbig.map(esc).join(" / "),"n");
    else h+=chip("client?","n");
    const m=p.client?quickLogBuild(p):null;
    if(m){
      h+=chip(fmtDshort(m.date));
      h+=chip(m.time)+chip(esc(m.mode))+chip(esc(m.location))+chip("#"+m.num,"f");
      const r=effRate(m.client,m.date);
      h+=chip(gbp(r));
      h+=p.paid?chip("paid today","y"):chip("awaiting","na");
      if(p.unmatched.length)h+=chip("ignored: "+esc(p.unmatched.join(" ")),"na");
      cur=m;btn.style.display="inline-flex";
    }else{cur=null;btn.style.display="none";}
    out.innerHTML=h;
  }
  inp.addEventListener("input",paint);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();btn.click();}});
  btn.onclick=async()=>{
    if(!cur){toast("Name a client first");Sfx.error();return;}
    const vr=validateSession(cur);
    if(vr.errors.length){out.innerHTML='<span class="chip n">⛔ '+vr.errors[0].msg+'</span>';Sfx.error();return;}
    if(vr.warnings.length&&!armed){armed=true;btn.textContent="Log anyway";
      out.innerHTML='<span class="chip f">⚠️ '+vr.warnings[0].msg+'</span>';Sfx.error();return;}
    S.sessions.push(cur);
    await commit("Quick-logged session: "+cur.client+" "+cur.date);renderTabs();
    const logged=cur;cur=null;inp.value="";out.innerHTML="";btn.style.display="none";
    gameShow({batch:1,toast:logged.client+" logged ✨"},{});
    go(curTab());
  };
}

  if(sups.length){const days=Math.floor((t-parseD(sups[0].date))/86400000);

/* ============ Swipe-to-mark-paid ============ */
function attachSwipe(container,refresh){
  container.querySelectorAll(".swrow").forEach(w=>{
    const over=w.querySelector(".swover");const id=w.dataset.swipe;
    let sx=null,sy=null,dx=0,drag=false;
    over.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;dx=0;drag=false;over.classList.remove("snap");});
    over.addEventListener("pointermove",e=>{if(sx==null)return;
      const mx=e.clientX-sx,my=e.clientY-sy;
      if(!drag){if(Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my)*1.2){drag=true;try{over.setPointerCapture(e.pointerId);}catch(_){}}else return;}
      dx=Math.min(0,Math.max(-130,mx));over.style.transform="translateX("+dx+"px)";});
    const end=async()=>{if(sx==null)return;
      const fired=drag&&dx<-80;sx=null;
      over.classList.add("snap");over.style.transform="translateX(0)";
      if(drag){const block=ev=>{ev.stopPropagation();ev.preventDefault();};
        over.addEventListener("click",block,true);setTimeout(()=>over.removeEventListener("click",block,true),400);}
      drag=false;
      if(fired){const ss=S.sessions.find(z=>z._id===id);
        if(ss&&!ss.paidDate){ss.paidDate=isoD(today());
          const amt=derive(ss).rate||0;
          gameNoteBatch({cleared:1});
          await commit("Marked paid (swipe): "+ss.client+" "+ss.date);renderTabs();
          Sfx.complete();Confetti.burst(16,{up:8,spread:0.8});
          toast(ss.client+" marked paid ✓");
          if(refresh)refresh();}}};
    over.addEventListener("pointerup",end);over.addEventListener("pointercancel",end);
  });
}

/* ============ Invoice / receipt generator ============ */
function receiptRows(c,per){
  const lc=(c.code||"").toLowerCase(),t=today();
  let from=null,to=null,label="";
  if(per==="month"){from=new Date(t.getFullYear(),t.getMonth(),1);to=eomonth(t);label=t.toLocaleDateString("en-GB",{month:"long",year:"numeric"});}
  else if(per==="lastmonth"){from=new Date(t.getFullYear(),t.getMonth()-1,1);to=eomonth(from);label=from.toLocaleDateString("en-GB",{month:"long",year:"numeric"});}
  else if(per==="taxyear"){const b=tyBounds(curTaxYear());from=b.start;to=b.end;label="Tax year "+curTaxYear();}
  else label="All sessions";
  const rows=S.sessions.filter(s=>(s.client||"").toLowerCase()===lc).map(s=>({s,d:derive(s)}))
    /* A missed session that carried no fee has nothing to state; one that WAS charged belongs on
       the statement, or the total would not match what the client was actually asked to pay. */
    .filter(x=>{const d=parseD(x.s.date);if(!d)return false;if(from&&(d<from||d>to))return false;
      return d<=t&&(!isCancelled(x.s)||(x.d.rate||0)>0);})
    .sort((a,b)=>parseD(a.s.date)-parseD(b.s.date));
  return {rows,label};
}

/* ============ Year heatmap + income forecast ============ */
function yearHeatmapHTML(){
  const t=today();const counts={};
  S.sessions.forEach(s=>{const d=parseD(s.date);if(d&&d<=t)counts[isoD(d)]=(counts[isoD(d)]||0)+1;});
  const start=weekMonday(addDays(t,-364));
  let cells="";let d=new Date(start);
  while(d<=t||d.getDay()!==1){
    if(d>t){cells+='<i style="visibility:hidden"></i>';}
    else{const n=counts[isoD(d)]||0;const cls=n>=3?"l3":n===2?"l2":n===1?"l1":"";
      cells+='<i class="'+cls+'" title="'+fmtDM(d)+': '+n+' session'+(n===1?'':'s')+'"></i>';}
    d=addDays(d,1);
    if(d>t&&d.getDay()===1)break;
  }
  return '<div class="hmgrid">'+cells+'</div><div class="hmleg">Less <i style="background:var(--soft)"></i><i style="background:color-mix(in srgb,var(--brand) 32%,var(--soft))"></i><i style="background:color-mix(in srgb,var(--brand) 62%,var(--soft))"></i><i style="background:var(--brand)"></i> More</div>';
}
function incomeForecast(){
  const t=today();const der=S.sessions.map(s=>({s,d:derive(s)}));
  const mStart=new Date(t.getFullYear(),t.getMonth(),1),mEnd=eomonth(t);
  const mtd=der.filter(x=>{const d=parseD(x.s.date);return d&&d>=mStart&&d<=t;}).reduce((a,x)=>a+(x.d.rate||0),0);
  const booked=der.filter(x=>{const d=parseD(x.s.date);return d&&d>t&&d<=mEnd;}).reduce((a,x)=>a+(x.d.rate||0),0);
  const hFrom=addDays(weekMonday(t),-56),hTo=weekMonday(t);
  const hist=der.filter(x=>{const d=parseD(x.s.date);return d&&d>=hFrom&&d<hTo;}).reduce((a,x)=>a+(x.d.rate||0),0)/56;
  const remDays=Math.max(0,Math.round((mEnd-t)/86400000));
  const proj=Math.round(mtd+Math.max(booked,hist*remDays));
  const lmStart=new Date(t.getFullYear(),t.getMonth()-1,1),lmEnd=eomonth(lmStart);
  const lastM=der.filter(x=>{const d=parseD(x.s.date);return d&&d>=lmStart&&d<=lmEnd;}).reduce((a,x)=>a+(x.d.rate||0),0);
  const delta=lastM>0?Math.round((proj-lastM)/lastM*100):null;
  const dayN=[0,0,0,0,0,0,0];
  der.forEach(x=>{const d=parseD(x.s.date);if(d&&d<=t&&(t-d)/86400000<=182&&!isCancelled(x.s))dayN[d.getDay()]++;});
  const bestI=dayN.indexOf(Math.max(...dayN));
  const busiest=Math.max(...dayN)>0?["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][bestI]:"—";
  return {mtd:Math.round(mtd),proj,lastM:Math.round(lastM),delta,busiest};
}

/* ===== Encrypted backups (AES-256-GCM via WebCrypto, passphrase-derived key) =====
   The passphrase is never stored. A non-extractable AES key derived from it (PBKDF2, 210k iterations)
   is kept in IndexedDB so backups can be written silently; the backup FILE can only be read with the
   passphrase, so it's safe in iCloud/Drive/email. Restoring prompts for the passphrase. */
const ENC_ITER=210000;
function bufToB64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64ToBuf(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
async function encDeriveKey(pass,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ENC_ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
function encReady(){try{return _db&&localStorage.getItem("tt_enc")==="on";}catch(e){return false;}}
async function encSetup(pass){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await encDeriveKey(pass,salt);
  await kvPut("encKey",key);await kvPut("encSalt",bufToB64(salt.buffer));
  try{localStorage.setItem("tt_enc","on");}catch(e){}
}
async function encDisable(){await kvPut("encKey",null);await kvPut("encSalt",null);await kvPut("encHandle",null);
  try{localStorage.removeItem("tt_enc");}catch(e){}}
async function encPayload(){
  const key=await kvGet("encKey"),saltB=await kvGet("encSalt");
  if(!key||!saltB)throw new Error("no passphrase set");
  const audit=_db?await auditAll():[];
  const plain=JSON.stringify({app:"TherapyTracker",version:1,schemaVersion:SCHEMA_VERSION,note:NOTES_SCOPE,exportedAt:new Date().toISOString(),state:S,audit:audit.slice(-800)});
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(plain));
  return JSON.stringify({app:"TherapyTracker",enc:1,cipher:"AES-256-GCM",kdf:"PBKDF2-SHA256",iter:ENC_ITER,salt:saltB,iv:bufToB64(iv.buffer),data:bufToB64(ct)});
}
async function encWriteToHandle(txt,interactive){
  const h=await kvGet("encHandle");if(!h)return false;
  try{
    let perm=await h.queryPermission({mode:"readwrite"});
    if(perm!=="granted"){if(!interactive)return false;perm=await h.requestPermission({mode:"readwrite"});}
    if(perm!=="granted")return false;
    const w=await h.createWritable();await w.write(txt);await w.close();return true;
  }catch(e){return false;}
}
async function encBackupNow(){

    if(!wrote)download("therapy-tracker-backup-"+isoD(today())+".enc.json",txt);
    markBackedUp();toast(wrote?"Encrypted backup saved to your file":"Encrypted backup downloaded");
  }catch(e){toast("Backup failed: "+e.message);Sfx.error();}
}

/* Passphrase entry uses a masked sheet, not window.prompt: prompt() shows the passphrase in
   clear text over the page and behaves badly in iOS home-screen apps. Resolves null if the
   sheet is dismissed by any route. */
const PP_ATTRS='type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••••"';
function sheetPromise(title,body,wire){
  return new Promise(res=>{
    let settled=false;
    const sheet=$("#sheet");
    const obs=new MutationObserver(()=>{if(!sheet.classList.contains("open"))fin(null);});
    function fin(v){if(settled)return;settled=true;obs.disconnect();if(sheet.classList.contains("open"))closeSheet();res(v);}
    wire(body,fin);
    obs.observe(sheet,{attributes:true,attributeFilter:["class"]});
    openSheet(title,body);
  });
}
function showToggle(body,inputSel,chkSel){

  chk.onchange=()=>body.querySelectorAll(inputSel).forEach(i=>i.type=chk.checked?"text":"password");

/* ===== Import validation (schema + sanity report before restore) ===== */
function validateImport(st){
  const problems=[];
  if(!st||typeof st!=="object")return {ok:false,problems:["Not a recognisable backup file"]};
  if(!Array.isArray(st.sessions)||!Array.isArray(st.clients))return {ok:false,problems:["Missing sessions or clients — not a Therapy Tracker backup"]};
  /* Refuse anything written by a newer build. Importing it would silently drop the fields this
     version doesn't know about, and then save that loss back over the good data. */
  const sv=stateSchemaVersion(st);
  if(sv>SCHEMA_VERSION)return {ok:false,problems:[
    "This backup was made by a newer version of Therapy Tracker (data version "+sv+"; this app reads version "+SCHEMA_VERSION+"). "+
    "Restoring it here would quietly discard the newer information. Open the app on this device while online to update it first, then try again."]};
  const badDates=st.sessions.filter(s=>!s||!s.date||!/^\d{4}-\d{2}-\d{2}$/.test(String(s.date))).length;
  if(badDates)problems.push(badDates+" session(s) with missing/invalid dates");
  const codeSet=new Set((st.clients||[]).map(c=>(c&&c.code||"").toLowerCase()));
  const orphans=st.sessions.filter(s=>s&&s.client&&!codeSet.has(String(s.client).toLowerCase())).length;
  if(orphans)problems.push(orphans+" session(s) referencing clients not in the backup");
  const dupIds={};let dups=0;
  st.sessions.forEach(s=>{if(s&&s._id){if(dupIds[s._id])dups++;dupIds[s._id]=1;}});
  if(dups)problems.push(dups+" duplicate internal id(s)");
  return {ok:true,problems,counts:{sessions:st.sessions.length,clients:st.clients.length,
    supervision:(st.supervision||[]).length,rooms:(st.rooms||[]).length,
    peer:(st.peerSupervision||[]).length,expenses:(st.expenses||[]).length,otherIncome:(st.otherIncome||[]).length}};
}

   sessions, auto-creates the clients and rooms they reference, and builds dated
   fee history so past sessions keep the fee they were actually charged.
   A snapshot is taken before the write, so one Undo reverses the whole import.
   ============================================================ */

/* ---- tolerant parsing helpers (dirty spreadsheet values) ---- */
function impCountOutside(line,d){let n=0,q=false;
  for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){q=!q;continue}if(!q&&c===d)n++;}return n;}
/* RFC4180-ish splitter. Delimiter is whichever of tab/comma/semicolon/pipe appears most on the
   header line outside quotes — a paste from Excel is tab-separated, a saved file is comma. */
function impSplit(text){
  const t=String(text||"").replace(/^﻿/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  if(!t.trim())return [];
  let best="\t",bestN=-1;
  ["\t",",",";","|"].forEach(d=>{const n=impCountOutside(t.split("\n")[0],d);if(n>bestN){bestN=n;best=d;}});
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"')q=true;
    else if(c===best){row.push(cell);cell="";}
    else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  row.push(cell);rows.push(row);
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
const IMP_MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function impYear(y){return y<100?(y<70?2000+y:1900+y):y;}
/* Returns {y, a, b, iso} where for iso a=month/b=day; for an ambiguous d/m/y style
   a and b are simply the first and second numbers, resolved later by the column-wide order. */
function impDateParts(v){
  const s=String(v==null?"":v).trim();
  if(!s)return null;
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if(m)return {y:+m[1],a:+m[2],b:+m[3],iso:true};
  m=s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s-]*([A-Za-z]{3,9})[\s-,]+(\d{2,4})$/);          /* 12 Mar 2025 */
  if(m){const mo=IMP_MONTHS[m[2].slice(0,3).toLowerCase()];if(mo)return {y:impYear(+m[3]),a:mo,b:+m[1],iso:true};}
  m=s.match(/^([A-Za-z]{3,9})[\s-]+(\d{1,2})(?:st|nd|rd|th)?[\s-,]+(\d{2,4})$/);           /* Mar 12, 2025 */
  if(m){const mo=IMP_MONTHS[m[1].slice(0,3).toLowerCase()];if(mo)return {y:impYear(+m[3]),a:mo,b:+m[2],iso:true};}
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);                                    /* ambiguous */
  if(m)return {y:impYear(+m[3]),a:+m[1],b:+m[2],iso:false};
  if(/^\d{5}(\.\d+)?$/.test(s)){                                                           /* Excel serial */
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(+s)*86400000);
    return {y:d.getUTCFullYear(),a:d.getUTCMonth()+1,b:d.getUTCDate(),iso:true};
  }
  return null;
}
/* 03/04/2026 is 3 April here and 4 March to a US reader. Decide once for the whole column —
   any single row with a first number above 12 settles it — and show the user the reading chosen. */
function impDateScan(values){
  let dmy=0,mdy=0,unres=0,bad=0,ok=0,iso=0;
  values.forEach(v=>{
    if(v==null||String(v).trim()==="")return;
    const p=impDateParts(v);
    if(!p){bad++;return}
    ok++;
    if(p.iso){iso++;return}
    if(p.a>12&&p.b<=12)dmy++;
    else if(p.b>12&&p.a<=12)mdy++;
    else if(p.a>12&&p.b>12)bad++;
    else unres++;
  });
  let order="DMY",why,conflict=false;
  if(dmy&&mdy){conflict=true;order="DMY";
    why="Mixed: "+dmy+" row(s) only read as day-first and "+mdy+" only as month-first. Check the file — some dates will be wrong whichever you pick.";}
  else if(dmy)why=dmy+" row"+(dmy===1?"":"s")+" can only be day-first (a day above 12), so day-first it is.";
  else if(mdy){order="MDY";why=mdy+" row"+(mdy===1?"":"s")+" can only be month-first (a month above 12), so month-first it is.";}
  else if(unres)why="Every day and month is 12 or under, so the file can’t prove which it is. Defaulting to UK day-first — check the preview.";
  else why=iso?"Already in an unambiguous format (year-first or a named month).":"No dates read yet.";
  return {order,why,conflict,ambiguous:!!unres&&!dmy&&!mdy,counts:{ok,bad,iso,unres,dmy,mdy}};
}
function impDate(v,order){
  const p=impDateParts(v);if(!p)return null;
  let d,mo;
  if(p.iso){mo=p.a;d=p.b;}
  else if(order==="MDY"){mo=p.a;d=p.b;}
  else {d=p.a;mo=p.b;}
  if(mo<1||mo>12||d<1||d>31)return null;
  const dt=new Date(p.y,mo-1,d);
  if(dt.getMonth()!==mo-1||dt.getDate()!==d)return null;  /* 31 Feb and friends */
  return isoD(dt);
}
function impMoney(v){
  if(v==null)return null;
  let s=String(v).trim();if(!s)return null;
  let neg=/^\(.*\)$/.test(s);
  s=s.replace(/[()]/g,"").replace(/[£$€\s,]/g,"");
  if(s.charAt(0)==="-"){neg=true;s=s.slice(1);}
  if(s===""||!/^\d*\.?\d+$/.test(s))return null;
  const n=parseFloat(s);
  return isNaN(n)?null:(neg?-n:n);
}
function impYN(v){
  const s=String(v==null?"":v).trim().toLowerCase();
  if(!s)return "";
  if(/^(n\/a|na|none|not applicable|-|—)$/.test(s))return "n/a";
  if(/^(y|yes|true|1|paid|done|complete|✓|✔|x)$/.test(s))return "Y";
  if(/^(n|no|false|0|unpaid|outstanding|due|✗|✘)$/.test(s))return "N";
  return "";
}
/* Which kind of missed session an imported row describes: "" attended | "late" | "dna".
   A spreadsheet's one "late cancel" column is commonly used for both, so the words are read
   directly before falling back to impYN's plain Y/N. Notes are honoured for the historical
   "Y (late cancellation)" convention exactly as isLateCancel does. */
function impLateCancel(v,notes){
  const s=String(v==null?"":v).trim().toLowerCase();
  if(/(^|\b)(dna|no.?show|didn.?t attend|did not attend)(\b|$)/.test(s))return "dna";
  if(/late.?cancel/.test(s))return "late";
  if(impYN(v)==="Y")return "late";
  if(notes&&/\bdna\b|did not attend|no.?show/i.test(String(notes)))return "dna";
  if(notes&&/late cancellation/i.test(String(notes)))return "late";
  return "";
}
function impTime(v){
  let s=String(v==null?"":v).trim().toLowerCase();
  if(!s)return "";
  if(/^0?\.\d+$/.test(s)){                                  /* Excel stores times as a day fraction */
    const tot=Math.round(parseFloat(s)*1440)%1440;          /* round to the minute first, so .5833 → 14:00 not 13:60 */
    return String(Math.floor(tot/60)).padStart(2,"0")+":"+String(tot%60).padStart(2,"0");
  }
  const ap=/(a\.?m\.?|p\.?m\.?)$/.exec(s);
  let pm=false,am=false;
  if(ap){pm=/p/.test(ap[1]);am=!pm;s=s.slice(0,ap.index).trim();}
  const m=s.match(/^(\d{1,2})(?:[:.h]?(\d{2}))?$/);
  if(!m)return "";
  let h=+m[1];const mi=+(m[2]||0);
  if(pm&&h<12)h+=12;
  if(am&&h===12)h=0;
  if(h>23||mi>59)return "";
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}
function impMode(v){
  const s=String(v==null?"":v).trim().toLowerCase();
  if(!s)return "";
  if(/online|zoom|teams|video|remote|virtual|skype|phone|tel/.test(s))return "Online";
  if(/person|face|f2f|ftf|clinic|office|room|studio/.test(s))return "In-person";
  return "";
}
function impNorm(h){return String(h==null?"":h).toLowerCase().replace(/[^a-z0-9]/g,"");}
/* Guess field per column: exact header match first across all columns, then substring.
   One field per column, one column per field. */
function impGuess(headers){
  const map=headers.map(()=>null), used={};
  for(let pass=0;pass<2;pass++){
    headers.forEach((h,i)=>{
      if(map[i])return;
      const n=impNorm(h);if(!n)return;
      for(const f of IMP_FIELDS){
        if(used[f.k])continue;
        const hit=f.syn.some(s=>{const sn=impNorm(s);
          return pass===0?n===sn:(sn.length>=4&&n.indexOf(sn)>=0);});
        if(hit){map[i]=f.k;used[f.k]=1;break;}
      }
    });
  }
  return map;
}
function impSame(a,b){return String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();}
function impKey(client,date,time){return String(client||"").trim().toLowerCase()+"|"+(date||"")+"|"+(time||"");}

/* ---- dry run: build the full plan without touching S ---- */
function impPlan(rows,map,order,opt){
  const body=rows.slice(1), col={};
  map.forEach((k,i)=>{if(k&&col[k]==null)col[k]=i;});
  const get=(r,k)=>col[k]==null?"":String(r[col[k]]==null?"":r[col[k]]).trim();
  const plan={recs:[],skipped:[],warn:[],newClients:new Map(),newRooms:new Map(),
              fresh:0,updates:0,dupes:0,order};
  const seen=new Map();
  const existing=new Map();
  S.sessions.forEach(s=>existing.set(impKey(s.client,s.date,s.time),s));
  body.forEach((r,n)=>{
    const line=n+2;                                   /* +1 for the header, +1 for 1-based */
    const code=get(r,"client");
    if(!code){plan.skipped.push({line,why:"no client code"});return;}
    const rawD=get(r,"date");
    const date=impDate(rawD,order);
    if(!date){plan.skipped.push({line,why:rawD?("date not understood — “"+rawD+"”"):"no date"});return;}
    const time=impTime(get(r,"time"));
    const key=impKey(code,date,time);
    if(seen.has(key)){plan.skipped.push({line,why:"same client, date and time as line "+seen.get(key)});return;}
    seen.set(key,line);
    const prior=existing.get(key);
    if(prior&&opt.onDupe!=="update"){plan.dupes++;plan.skipped.push({line,why:"already in the app"});return;}

    const notes=get(r,"notes");
    const num=parseInt(get(r,"num").replace(/[^0-9]/g,""),10);
    const paidYN=impYN(get(r,"paidYN"));
    const paidOn=impDate(get(r,"paidDate"),order);
    const roomPaidOn=impDate(get(r,"roomPaidDate"),order);
    let roomPaid=impYN(get(r,"roomPaid"));
    if(!roomPaid&&roomPaidOn)roomPaid="Y";
    const loc=get(r,"location")||"At home";
    const rec={
      _id:prior?prior._id:uid(),
      client:code,
      num:isNaN(num)?"":num,
      date, time,
      mode:impMode(get(r,"mode"))||"In-person",
      location:loc,
      room:get(r,"room"),
      invoice:get(r,"invoice"),
      /* paid-on date wins; a bare "Y" with no date means paid on the day */
      paidDate:paidOn||(paidYN==="Y"?date:""),
      receipt:"",
      notes,
      roomPaid,
      roomPaidDate:roomPaidOn||"",
      /* historical convention put this in the notes text; honour both (see isLateCancel) */
      lateCancel:impLateCancel(get(r,"lateCancel"),notes)==="late",
      cancelKind:impLateCancel(get(r,"lateCancel"),notes),
      /* An imported missed session was charged whatever the sheet says, or -- with no column for
         it -- the full fee, which is what every such session carried before this field existed.
         The policy is deliberately NOT consulted: it describes what to charge from now on, not
         what was actually charged years ago. */
      cancelCharge:impLateCancel(get(r,"lateCancel"),notes)
        ? (impMoney(get(r,"cancelCharge"))==null?100:Math.max(0,Math.min(100,impMoney(get(r,"cancelCharge")))))
        : null,
      _rate:impMoney(get(r,"rate")),
      _roomRate:impMoney(get(r,"roomRate")),
      _update:!!prior,_line:line
    };
    if(prior)plan.updates++;else plan.fresh++;
    plan.recs.push(rec);

    const ck=code.toLowerCase();
    if(!S.clients.some(c=>impSame(c.code,code))&&!plan.newClients.has(ck))
      plan.newClients.set(ck,{code,status:get(r,"status")||"Ongoing",first:date});
    const lk=loc.toLowerCase();
    if(loc&&lk!=="at home"&&!S.rooms.some(x=>impSame(x.location,loc))){
      const nr=plan.newRooms.get(lk)||{location:loc,rate:0};
      if(!nr.rate&&rec._roomRate)nr.rate=rec._roomRate;
      plan.newRooms.set(lk,nr);
    }
    if(!prior&&plan.warn.length<12&&S.sessions.some(s=>impSame(s.client,code)&&s.date===date))
      plan.warn.push("Line "+line+": "+code+" already has a session on "+fmtDMY(date)+" at a different time — check it isn’t the same one.");
  });
  /* keep the earliest date per new client for their "created" stamp */
  plan.recs.forEach(rec=>{const c=plan.newClients.get(rec.client.toLowerCase());
    if(c&&rec.date<c.first)c.first=rec.date;});
  return plan;
}

/* ---- apply: merge into S, then one commit (undoable in a single tap) ---- */
async function impCommit(plan){
  /* commit() snapshots the state it writes, so the snapshot already sitting at the top of the
     stack IS the pre-import state — one Undo is enough. Only a database with no snapshots at all
     (a first run that has never committed) needs one laying down first, or there'd be nothing
     to go back to. */
  try{ if(_db && (await snapCount())===0)
    await snapAdd({ts:new Date().toISOString(),label:"Before spreadsheet import",data:clone(S)}); }
  catch(e){ console.warn("pre-import snapshot failed",e); }

  plan.newClients.forEach(c=>{
    const cat=S.clientCategories.find(x=>x.status===c.status);
    S.clients.push({_id:uid(),code:c.code,status:c.status,category:cat?cat.category:c.status,
      frequency:"Weekly",insurance:"N",notes:"",rate:0,created:c.first});
  });
  plan.newRooms.forEach(r=>{
    S.rooms.push({_id:uid(),location:r.location,rate:r.rate,due:"n/a"});
    S.roomRateHistory.push({_id:uid(),location:r.location,effectiveFrom:"2000-01-01",rate:r.rate});
  });

  /* oldest first, so each fee change is stamped from the session that first charged it */
  const recs=plan.recs.slice().sort((a,b)=>parseD(a.date)-parseD(b.date));
  const touchedC=new Set(), touchedR=new Set();
  recs.forEach(rec=>{
    if(rec._rate!=null){
      const first=!S.rateHistory.some(h=>impSame(h.client,rec.client));
      if(first||Math.abs((+effRate(rec.client,rec.date)||0)-rec._rate)>0.005){
        S.rateHistory.push({_id:uid(),client:rec.client,
          effectiveFrom:first?"2000-01-01":rec.date,rate:rec._rate});
        touchedC.add(rec.client.toLowerCase());
      }
    }
    if(rec._roomRate!=null&&rec.location&&!impSame(rec.location,"At home")){
      const first=!S.roomRateHistory.some(h=>impSame(h.location,rec.location));
      if(first||Math.abs((+effRoomRate(rec.location,rec.date)||0)-rec._roomRate)>0.005){
        S.roomRateHistory.push({_id:uid(),location:rec.location,
          effectiveFrom:first?"2000-01-01":rec.date,rate:rec._roomRate});
        touchedR.add(rec.location.toLowerCase());
      }
    }
    const clean=Object.assign({},rec);
    delete clean._rate;delete clean._roomRate;delete clean._update;delete clean._line;
    if(rec._update){
      const ex=S.sessions.find(s=>s._id===rec._id);
      if(ex)Object.assign(ex,clean); else S.sessions.push(clean);
    }else S.sessions.push(clean);
  });
  /* headline rate on the client/room record = whatever is effective today */
  const t=isoD(today());
  S.clients.forEach(c=>{if(touchedC.has((c.code||"").toLowerCase()))c.rate=effRate(c.code,t);});
  S.rooms.forEach(r=>{if(touchedR.has((r.location||"").toLowerCase()))r.rate=effRoomRate(r.location,t);});

  const n=plan.fresh+plan.updates;
  const ok=await commit("Imported "+n+" session"+(n===1?"":"s")+" from a spreadsheet");
  return {ok,n};
}

/* ---- template: generated from IMP_FIELDS, so headers can never drift from the parser ---- */
function impTemplate(){
  const cols=IMP_FIELDS.filter(f=>f.k!=="status").map(f=>f.k);
  const ex=[
    {client:"AB",num:1,date:"2026-04-07",time:"10:00",mode:"In-person",location:"At home",room:"",
     rate:"60",paidDate:"2026-04-07",paidYN:"Y",invoice:"INV-001",notes:"First session",
     roomPaid:"n/a",roomPaidDate:"",roomRate:"0",lateCancel:"N"},
    {client:"CD",num:12,date:"2026-04-09",time:"14:30",mode:"Online",location:"The Practice Rooms",room:"2",
     rate:"55",paidDate:"",paidYN:"N",invoice:"",notes:"",
     roomPaid:"N",roomPaidDate:"",roomRate:"15",lateCancel:"N"}
  ];
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};

function impTake(text){

  impStageMap();
}

function importJSON(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{let o=JSON.parse(rd.result);
    if(o&&o.enc===1){
      const pass=await askPassphrase({title:"Encrypted backup",verb:"Unlock backup",
        msg:"This backup file is encrypted. Enter the passphrase it was saved with."});
      if(!pass)return;
      try{
        const key=await encDeriveKey(pass,new Uint8Array(b64ToBuf(o.salt)));
        const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(b64ToBuf(o.iv))},key,b64ToBuf(o.data));
        o=JSON.parse(new TextDecoder().decode(pt));
      }catch(err2){alert("Wrong passphrase or corrupted file — nothing changed.");return;}
    }
    const st=o.state||o;
    const rep=validateImport(st);
    if(!rep.ok)throw new Error(rep.problems.join("; "));
    let msg="Restore this backup?\n\n"+rep.counts.sessions+" sessions · "+rep.counts.clients+" clients · "+rep.counts.supervision+" supervision · "+rep.counts.rooms+" rooms";
    if(rep.counts.peer)msg+=" · "+rep.counts.peer+" peer supervision";
    if(rep.counts.expenses||rep.counts.otherIncome)msg+="\n"+rep.counts.expenses+" business costs · "+rep.counts.otherIncome+" other income";
    if(rep.problems.length)msg+="\n\n⚠️ Checks found:\n– "+rep.problems.join("\n– ");
    msg+="\n\nCurrent data is kept as a restore point.";
    if(!confirm(msg))return;
    S=normalize(st);
    await commit("Restored backup ("+(S.sessions.length)+" sessions)");markBackedUp();
    applySettings();toast("Backup restored");go("home");
  }catch(err){alert("Could not import: "+err.message)}};rd.readAsText(f);e.target.value="";}
async function showSnapshots(){if(!_db){toast("Restore points need storage");return}
  const snaps=await snapRecent(80); // newest first, straight off the cursor
  const body=el('<div></div>');
  body.innerHTML='<p class="muted small">Every change creates a restore point. Tap to roll back.</p>'+
    snaps.map(s=>`<div class="list-item" data-id="${s.id}"><div class="li-main">
      <div class="li-title">${esc(s.label)}</div><div class="li-sub">${new Date(s.ts).toLocaleString("en-GB")} · ${s.data.sessions.length} sessions</div></div>
      <button class="btn sm sec">Restore</button></div>`).join("");
  body.querySelectorAll(".list-item").forEach(li=>li.onclick=async()=>{const id=+li.dataset.id;const snap=snaps.find(x=>x.id===id);
    if(!confirm("Roll back to: "+snap.label+"?"))return;S=normalize(clone(snap.data));await commit("Rolled back to: "+snap.label);
    applySettings();closeSheet();toast("Restored");go("home")});
  openSheet("Restore points",body);
}

/* ============ Gradual reveal ============
   Nothing new gates the UI: this only decides which of the EXISTING feature flags start off for
   a brand-new install, and then offers them back one at a time as the practice grows into them.
   feat() is still the only thing any view asks.

   REVEAL_CORE is what a therapist needs on day one to log a session and see what they are owed.
   Everything else is real but not yet earned, and each entry below says what earns it. */
const REVEAL_CORE=["supervision","money","gamify","attention","receipts"];
/* `keys` may hold more than one flag: some features are only worth meeting together. Tax and
   business costs are the case in point — an estimate that ignores what the practice costs you is
   not an estimate worth setting money aside against, so revealing one without the other would
   put a knowingly overstated figure in front of someone. */
const REVEAL_STEPS=[
  {keys:["tax","finances"], when:st=>st.sessions.length>=10,
   emoji:"🧾", title:"Ready to think about tax?",
   sub:"Ten sessions in. <b>Tax</b> turns them into a running estimate of what to set aside — including the January payment on account that catches people out — and <b>Costs &amp; other income</b> takes insurance, supervision, room rent and CPD off the profit it is worked out from. They arrive together because the estimate is wrong without the costs."},
  {keys:["trends"],   when:st=>st.sessions.length>=20,
   emoji:"📈", title:"Enough history to see a pattern",
   sub:"Twenty sessions is about where <b>Practice › Trends</b> starts telling you something true: who stays, who drifts, how attendance holds up against the frequency you agreed, and what missed sessions are costing."},
  {keys:["quickadd"], when:st=>st.sessions.length>=25,
   emoji:"⌨", title:"A faster way to log",
   sub:"You have logged plenty by hand now. The quick-add bar takes a whole session as one line — “AB tue 14:00 paid”."},
  {keys:["raw"],      when:st=>st.sessions.length>=40&&(st.settings.features||{}).money!==false,
   emoji:"▦", title:"Every session in one table",
   sub:"Enough history to be worth browsing as a spreadsheet — sortable columns, a column picker and a filtered CSV export."}

function revealCfg(){const sg=settings();sg.reveal=sg.reveal||{mode:"all",shown:[]};
  if(!Array.isArray(sg.reveal.shown))sg.reveal.shown=[];return sg.reveal;}
/* Apply the "start simple" choice to the feature flags. Only ever switches things OFF, and only
   on a fresh install — see stepDepth's guard. */
function revealApplySimple(w){
  /* accreditation and peer are left alone: stepCPD asks about both directly a couple of screens
     later, and a question the therapist answers beats a default either way. */
  FEATURES.forEach(f=>{if(REVEAL_CORE.indexOf(f.k)<0&&f.k!=="accreditation"&&f.k!=="peer")w.features[f.k]=false;});
  REVEAL_CORE.forEach(k=>{if(w.features[k]===false)delete w.features[k];});

let _revealBusy=false;
/* Called from gameTouch, which commit() already runs on every save. Offers at most one feature
   per save, and records the key either way, so a decline is as final as an accept. */
function revealCheck(){
  try{
    const cfg=revealCfg();
    if(cfg.mode!=="simple"||_revealBusy||_flow)return;
    const sg=settings(); sg.features=sg.features||{};
    /* a step is due while ANY of its keys is still hidden and it has not been answered before */
    const step=REVEAL_STEPS.find(x=>
      cfg.shown.indexOf(x.keys[0])<0 && x.keys.some(k=>sg.features[k]===false) && x.when(S));
    if(!step)return;
    _revealBusy=true;
    setTimeout(()=>revealOffer(step),900);   /* let the save's own toast land first */
  }catch(e){/* a nudge is never worth breaking a save over */}
}
function revealOffer(step){
  const fs=step.keys.map(k=>FEATURES.find(x=>x.k===k)||{k,n:k,d:""});
  const names=fs.map(f=>f.n).join(" and ");
  const body=el('<div></div>');
  body.innerHTML='<div style="text-align:center;font-size:40px;line-height:1">'+step.emoji+'</div>'+
    '<h3 style="text-align:center;margin:8px 0 4px">'+esc(step.title)+'</h3>'+
    '<p class="small muted" style="text-align:center">'+step.sub+'</p>'+
    fs.map(f=>'<div class="vmsg ok mt">'+esc(f.n)+' — '+f.d+'</div>').join("")+
    '<button class="btn full mt" id="rvYes">'+(fs.length>1?"Turn them on":"Turn it on")+'</button>'+
    '<button class="btn ghost full mt" id="rvNo">Not for me</button>'+
    '<p class="prev" style="text-align:center">Either way you can change your mind in <b>⚙ Settings › Features</b>.</p>';
  const finish=async(on)=>{
    const cfg=revealCfg();
    if(cfg.shown.indexOf(step.keys[0])<0)cfg.shown.push(step.keys[0]);
    if(on)step.keys.forEach(k=>{settings().features[k]=true;});
    _revealBusy=false;

    closeSheet();
    if(on){renderTabs();toast(names+(fs.length>1?" are on":" is on"));Sfx.pop();}
    go(curTab());
  };
  body.querySelector("#rvYes").onclick=()=>finish(true);
  body.querySelector("#rvNo").onclick=()=>finish(false);

  sheetPromise().then(r=>{if(r===null)_revealBusy=false;});

/* ---- generic step-flow overlay, shared by setup and the tour ---- */
let _flow=null;
function flowRoot(){
  let r=document.getElementById("ovRoot");
  if(r)return r;
  r=el('<div class="ov" id="ovRoot">'+
    '<div class="ovtop"><span class="ovttl" id="ovTtl"></span><button class="ovskip" id="ovSkip">Skip</button></div>'+
    '<div class="ovdots" id="ovDots"></div>'+
    '<div class="ovbody" id="ovScroll"><div class="ovinner" id="ovBody"></div></div>'+
    '<div class="ovfoot"><div class="ovinner ovbtns">'+
      '<button class="btn ghost" id="ovBack">Back</button><button class="btn" id="ovNext">Continue</button>'+
    '</div></div></div>');
  document.body.appendChild(r);
  r.querySelector("#ovBack").onclick=()=>{if(_flow)flowGo(_flow.i-1);};
  r.querySelector("#ovNext").onclick=()=>flowNext();
  r.querySelector("#ovSkip").onclick=()=>{if(_flow&&_flow.onSkip)_flow.onSkip();};
  return r;
}
function flowStart(cfg){_flow=Object.assign({i:0},cfg);
  const r=flowRoot();r.classList.add("show");flowGo(0);}
function flowClose(){const r=document.getElementById("ovRoot");if(r)r.classList.remove("show");_flow=null;}
function flowGo(i){
  if(!_flow)return;
  const steps=_flow.steps; i=Math.max(0,Math.min(steps.length-1,i)); _flow.i=i;
  const st=steps[i], r=flowRoot();
  r.querySelector("#ovTtl").textContent=_flow.title;
  r.querySelector("#ovDots").innerHTML=steps.map((_,n)=>'<i class="'+(n===i?"on":(n<i?"done":""))+'"></i>').join("");
  const body=r.querySelector("#ovBody");
  body.innerHTML='<div class="ovhero">'+(st.emoji||"✨")+'</div>'+
    '<h2 class="ovh">'+esc(st.h||"")+'</h2>'+
    (st.sub?'<p class="ovsub">'+st.sub+'</p>':'')+
    '<div id="ovStep">'+(st.html||"")+'</div>';
  if(st.mount)st.mount(body.querySelector("#ovStep"));
  r.querySelector("#ovBack").style.visibility=i>0?"visible":"hidden";
  r.querySelector("#ovNext").textContent=(i===steps.length-1)?(_flow.doneLabel||"Finish"):(st.nextLabel||"Continue");
  r.querySelector("#ovSkip").style.display=_flow.onSkip?"":"none";
  r.querySelector("#ovScroll").scrollTop=0;
}
function flowNext(){
  if(!_flow)return;
  const st=_flow.steps[_flow.i];
  if(st.validate&&st.validate()===false)return;
  if(st.onLeave)st.onLeave();
  if(_flow.i===_flow.steps.length-1){const done=_flow.onDone;flowClose();if(done)done();}
  else flowGo(_flow.i+1);
}
