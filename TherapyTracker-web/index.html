      sb.querySelector("#addPeer").onclick=()=>peerForm(null);
      sb.querySelectorAll(".list-item[data-id]").forEach(li=>li.onclick=()=>peerForm((S.peerSupervision||[]).find(p=>p._id===li.dataset.id)));
    }
    function drawMetrics(){
      const t=today();
      const sup=(S.supervision||[]).slice().filter(s=>s.date).sort((a,b)=>parseD(a.date)-parseD(b.date));
      const totalSess=sup.length;
      const totalCost=sup.reduce((a,s)=>a+(+s.cost||0),0);
      const totalHrs=sup.reduce((a,s)=>a+(+s.count||0),0);
      const ty=curTaxYear();
      const tyCost=sup.filter(s=>taxYear(s.date)===ty).reduce((a,s)=>a+(+s.cost||0),0);
      let avgGap=null;
      if(sup.length>=2)avgGap=Math.round((parseD(sup[sup.length-1].date)-parseD(sup[0].date))/86400000/(sup.length-1));
      const lastDisc={};
      sup.forEach(s=>{const d=parseD(s.date);if(!d)return;(s.clients||[]).forEach(code=>{const k=code.toLowerCase();if(!lastDisc[k]||d>lastDisc[k])lastDisc[k]=d;});});
      const active=S.clients.filter(c=>clientCategory(c.status)==="Active");
      const rows=active.map(c=>{const ld=lastDisc[c.code.toLowerCase()];
        return {code:c.code,date:ld||null,days:ld?Math.floor((t-ld)/86400000):null};})
        .sort((a,b)=>{if(a.days==null&&b.days==null)return a.code.localeCompare(b.code);if(a.days==null)return -1;if(b.days==null)return 1;return b.days-a.days;});
      const recencyChip=r=>r.days==null?'<span class="chip n">never</span>':r.days>56?'<span class="chip n">'+r.days+'d</span>':r.days>28?'<span class="chip f">'+r.days+'d</span>':'<span class="chip y">'+r.days+'d</span>';
      sb.innerHTML='<div id="cpdMount"></div><div id="accMount"></div><div class="kpis mb">'+
        '<div class="kpi"><div class="v">'+totalSess+'</div><div class="l">Sessions logged</div></div>'+
        '<div class="kpi"><div class="v">'+gbp(Math.round(totalCost))+'</div><div class="l">Total spent</div></div>'+
        '<div class="kpi"><div class="v">'+(Math.round(totalHrs*10)/10)+'</div><div class="l">Client-hrs reviewed</div></div>'+
        '<div class="kpi"><div class="v">'+gbp(Math.round(tyCost))+'</div><div class="l">'+ty+' spend</div></div>'+
        '</div>'+
        '<div class="card"><h2>Client discussion recency</h2><p class="small muted" style="margin:0 0 6px">Time since each active client was last discussed in supervision'+(avgGap!=null?' · avg '+avgGap+' days between supervisions':'')+'.</p>'+
        (rows.length?'<div style="padding:0 2px">'+rows.map(r=>'<div class="list-item"><div class="li-main"><div class="li-title">'+esc(r.code)+'</div><div class="li-sub">'+(r.date?'Last discussed '+fmtD(r.date):'Not yet discussed in supervision')+'</div></div><div class="li-right">'+recencyChip(r)+'</div></div>').join("")+'</div>':'<p class="muted small">No active clients to show.</p>')+
        '<div class="legend" style="margin-top:10px"><span class="lgi"><i style="background:var(--good)"></i>≤4 wks</span><span class="lgi"><i style="background:var(--accent)"></i>4–8 wks</span><span class="lgi"><i style="background:var(--bad)"></i>8+ wks / never</span></div></div>';
      mountCPD(sb.querySelector("#cpdMount"));
      mountAccreditation(sb.querySelector("#accMount"));
    }
    if(supTab==="peer"&&!feat("peer"))supTab="log";   // feature switched off since it was last open
    const route=()=>supTab==="metrics"?drawMetrics():supTab==="peer"?drawPeer():drawLog();
    v.querySelector("#suptab").querySelectorAll("button").forEach(bt=>bt.onclick=()=>{supTab=bt.dataset.st;
      v.querySelector("#suptab").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===bt));route();});
    route();
  }
  return v;
}

/* Practice - the clinical side in one place: who you see, where you see them, and the
   supervision and CPD behind it. Merged from the old Clients and Supervision tabs. */
VIEWS.practice=function(){
  const v=el('<div class="view active"></div>');
  const segs=[["clients","Clients"]];
  if(feat("trends"))segs.push(["trends","Trends"]);
  segs.push(["rooms","Rooms"]);
  if(feat("supervision"))segs.push(["supervision","Supervision"]);
  if(pracTab==="supervision"&&!feat("supervision"))pracTab="clients";
  if(pracTab==="trends"&&!feat("trends"))pracTab="clients";
  v.innerHTML=segBar("crtab",segs,pracTab)+'<div id="crbody"></div>';
  const body=v.querySelector("#crbody");
  function renderClients(){
    body.innerHTML='<div class="toolbar"><button class="btn sm" id="addC">＋ New client</button></div><div class="search"><input id="cq" placeholder="Search clients…"></div><div id="clist"></div>';
    const render=()=>{
      const q=(body.querySelector("#cq").value||"").toLowerCase();
      const order={Ongoing:0,"Initial session booked":0,Paused:1,Finished:2};
      const lastSeen=lastSessionDates(), counts=clientSessionCounts();
      let cs=S.clients.slice().sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||a.code.localeCompare(b.code));
      if(q)cs=cs.filter(c=>(c.code+" "+(c.notes||"")+" "+(c.status||"")).toLowerCase().includes(q));
      const li=c=>{
        const r=effRate(c.code,isoD(today()));const ch=c.status==="Ongoing"?'y':c.status==="Paused"?'f':'na';
        const seen=lastSeen[(c.code||"").toLowerCase()];
        return '<div class="list-item" data-id="'+c._id+'"><div class="li-main"><div class="li-title">'+esc(c.code)+' <span class="chip '+ch+'">'+esc(c.status||"")+'</span></div><div class="li-sub">'+esc(c.frequency||"")+(seen?' · last seen '+fmtDMY(seen):'')+(c.notes?" · "+esc(c.notes):"")+'</div></div><div class="li-right">'+gbp(r)+'</div></div>';};
      /* A search is someone looking for a specific person, very possibly one who finished years
         ago — so it never folds. Folding only applies to the unfiltered list, and only once
         there are enough finished clients for it to be worth a tap. */
      const aged=q?[]:cs.filter(c=>!trendsIsCurrent(c,lastSeen[(c.code||"").toLowerCase()]));
      const doFold=aged.length>=AGED_MIN;
      const cur=doFold?cs.filter(c=>trendsIsCurrent(c,lastSeen[(c.code||"").toLowerCase()])):cs;
      const old=doFold?aged:[];
      const oldSessions=old.reduce((a,c)=>a+(counts[(c.code||"").toLowerCase()]||0),0);
      const oldLast=old.map(c=>lastSeen[(c.code||"").toLowerCase()]).filter(Boolean).sort((a,b)=>b-a)[0];
      body.querySelector("#clist").innerHTML='<div class="card" style="padding:4px 12px">'+
        (cur.length?cur.map(li).join("")
          :'<p class="muted small center" style="padding:14px">'+(q?"No clients match.":"No current clients — everyone is in the list below.")+'</p>')+
        (old.length?agedFold("cl","Finished & long inactive · "+plural(old.length,"client"),
          plural(oldSessions,"session")+' between them'+(oldLast?' · last seen '+fmtDMY(oldLast):'')):"")+
        '</div>';
      body.querySelectorAll("#clist .list-item").forEach(l=>l.onclick=()=>clientProfile(S.clients.find(c=>c._id===l.dataset.id)));
      wireAgedFolds(body,{cl:()=>old.map(li).join("")},id=>{
        const c=S.clients.find(x=>x._id===id); if(c)clientProfile(c);});
    };
    body.querySelector("#cq").oninput=render; body.querySelector("#addC").onclick=()=>clientForm(null); render();
  }
  function renderRooms(){
    body.innerHTML='<div class="toolbar"><button class="btn sm" id="addR">＋ New room / location</button></div><div id="rlist"></div>';
    const r=()=>{
      body.querySelector("#rlist").innerHTML='<div class="card" style="padding:4px 12px">'+S.rooms.map(rm=>{
        const monthly=roomBilling(rm)==="monthly";
        return '<div class="list-item" data-id="'+rm._id+'"><div class="li-main"><div class="li-title">'+esc(rm.location)+
          (monthly?' <span class="chip f">monthly</span>':'')+'</div><div class="li-sub">Payment due: '+esc(rm.due||"n/a")+'</div></div>'+
          '<div class="li-right">'+roomCostLabel(rm)+'</div></div>';}).join("")+'</div>'+
        '<p class="small muted">Tap a room to edit it, change its cost from a date, or switch it between a per-session cost and a flat monthly rent (history is kept, like client rates).</p>';
      body.querySelectorAll("#rlist .list-item").forEach(li=>li.onclick=()=>roomForm(S.rooms.find(x=>x._id===li.dataset.id)));
    };
    body.querySelector("#addR").onclick=()=>roomForm(null); r();
  }
  function renderMetrics(){
    const counts=clientSessionCounts();
    const lastSeen=lastSessionDates();   /* drives the current/historical split on every list below */
    const withSess=S.clients.map(c=>({c,n:counts[c.code.toLowerCase()]||0}));
    const base=withSess.filter(x=>x.n>=1).length;
    const max=Math.max(1,base);
    const tiers=[{t:1,l:"In therapy",d:"1+ sessions",e:"🌱"},{t:6,l:"Building",d:"6+ sessions",e:"🌿"},{t:12,l:"Established",d:"12+ sessions",e:"🌳"},{t:20,l:"Long-term",d:"20+ sessions",e:"🌲"}];
    const rows=tiers.map(tr=>{const n=withSess.filter(x=>x.n>=tr.t).length;const pct=base?Math.round(n/base*100):0;const w=Math.round(n/max*100);
      return '<div class="fr"><div class="ftop"><span>'+tr.e+' <b>'+tr.l+'</b> · '+tr.d+'</span><span>'+n+' '+(n===1?'client':'clients')+(tr.t>1&&base?' · '+pct+'%':'')+'</span></div><div class="fbar"><i data-w="'+w+'" style="width:0"></i></div></div>';}).join("");
    const deep=withSess.filter(x=>x.n>=20).sort((a,b)=>b.n-a.n);
    const deepLi=x=>'<div class="list-item" data-id="'+x.c._id+'"><div class="li-main"><div class="li-title">'+esc(x.c.code)+'</div><div class="li-sub">'+esc(x.c.status||"")+'</div></div><div class="li-right"><b style="color:var(--brand-dark)">'+x.n+'</b> <span class="small muted">sessions</span></div></div>';
    const deepAged=deep.filter(x=>!trendsIsCurrent(x.c,lastSeen[(x.c.code||"").toLowerCase()]));
    const deepFold=deepAged.length>=AGED_MIN;
    const deepCur=deepFold?deep.filter(x=>trendsIsCurrent(x.c,lastSeen[(x.c.code||"").toLowerCase()])):deep;
    const deepOld=deepFold?deepAged:[];
    const deepOldSessions=deepOld.reduce((s,x)=>s+x.n,0);
    const totalSessions=withSess.reduce((a,x)=>a+x.n,0);
    const avg=base?Math.round(totalSessions/base*10)/10:0;

    /* ---- missed sessions: late cancellations and DNAs ----
       `lost` is the fee that never arrived: full fee less what was actually charged, summed over
       every missed session. It is the number that answers "what is this costing me?", and it
       moves when the charging policy changes -- which is the point of being able to set one. */
    const t=today();
    const missed=S.sessions.filter(isCancelled);
    const totalLC=missed.length;
    const totalDNA=missed.filter(isDNA).length;
    const lcPct=S.sessions.length?Math.round(totalLC/S.sessions.length*1000)/10:0;
    let lost=0,charged=0;
    missed.forEach(s=>{const d=derive(s);lost+=Math.max(0,(d.fullRate||0)-(d.rate||0));charged+=(d.rate||0);});
    const byClient={};
    S.sessions.forEach(s=>{const k=(s.client||"").toLowerCase();if(!k)return;
      const e=byClient[k]||(byClient[k]={code:s.client,total:0,lc:0,dna:0,lost:0,recent:0,prev:0,last:null});
      e.total++;
      if(isCancelled(s)){e.lc++;if(isDNA(s))e.dna++;
        const dv=derive(s);e.lost+=Math.max(0,(dv.fullRate||0)-(dv.rate||0));
        const d=parseD(s.date);if(d){if(!e.last||d>e.last)e.last=d;
          const days=(t-d)/86400000;if(days<=90)e.recent++;else if(days<=180)e.prev++;}}});
    const lcClients=Object.values(byClient).filter(e=>e.lc>0).sort((a,b)=>b.lc-a.lc||b.total-a.total);
    const affected=lcClients.length;
    let recent90=0,prev90=0;
    missed.forEach(s=>{const d=parseD(s.date);if(!d)return;const days=(t-d)/86400000;if(days<=90)recent90++;else if(days<=180)prev90++;});
    /* a year's worth of the last 90 days, so the annual cost of the current rate is visible */
    let lost90=0;
    missed.forEach(s=>{const d=parseD(s.date);if(!d||(t-d)/86400000>90)return;
      const dv=derive(s);lost90+=Math.max(0,(dv.fullRate||0)-(dv.rate||0));});
    const projLost=Math.round(lost90*(365/90));
    const trendChip=(r,p)=>r>p?'<span class="chip n">↑ rising</span>':r<p?'<span class="chip y">↓ falling</span>':'<span class="chip na">→ steady</span>';
    const pctOf=e=>e.total?Math.round(e.lc/e.total*1000)/10:0;
    const rateChip=e=>{const p=pctOf(e);return '<span class="chip '+(p>=15?'n':p>=5?'f':'s')+'">'+p+'%</span>';};
    const lcLi=e=>{const cl=S.clients.find(c=>(c.code||"").toLowerCase()===(e.code||"").toLowerCase());
      return '<div class="list-item"'+(cl?' data-id="'+cl._id+'"':'')+'><div class="li-main"><div class="li-title">'+esc(e.code)+' '+rateChip(e)+'</div><div class="li-sub">'+e.lc+' of '+e.total+' sessions'+(e.dna?' · '+e.dna+' DNA':'')+(e.lost>0?' · '+gbp(Math.round(e.lost))+' not charged':'')+(e.last?' · last '+fmtDMY(e.last):'')+'</div></div><div class="li-right">'+trendChip(e.recent,e.prev)+'</div></div>';};
    const lcOf=e=>S.clients.find(c=>(c.code||"").toLowerCase()===(e.code||"").toLowerCase());
    const lcAged=lcClients.filter(e=>!trendsIsCurrent(lcOf(e),lastSeen[(e.code||"").toLowerCase()]));
    const lcFold=lcAged.length>=AGED_MIN;
    const lcCur=lcFold?lcClients.filter(e=>trendsIsCurrent(lcOf(e),lastSeen[(e.code||"").toLowerCase()])):lcClients;
    const lcOld=lcFold?lcAged:[];
    const lcOldMissed=lcOld.reduce((s,e)=>s+e.lc,0), lcOldLost=lcOld.reduce((s,e)=>s+e.lost,0);
    const lcCard='<div class="card"><h2>Missed sessions</h2>'+
      '<div class="kpis mb">'+
        '<div class="kpi"><div class="v">'+totalLC+'</div><div class="l">Missed'+(totalDNA?' · '+totalDNA+' DNA':'')+'</div></div>'+
        '<div class="kpi"><div class="v">'+lcPct+'%</div><div class="l">Of all sessions</div></div>'+
        '<div class="kpi'+(lost>0?' bad':'')+'"><div class="v">'+gbp(Math.round(lost))+'</div><div class="l">Fees not charged</div></div>'+
        '<div class="kpi"><div class="v">'+gbp(Math.round(charged))+'</div><div class="l">Charged anyway</div></div>'+
        '<div class="kpi"><div class="v">'+affected+'</div><div class="l">Clients affected</div></div>'+
        '<div class="kpi"><div class="v">'+recent90+'</div><div class="l">In the last 90 days</div></div>'+
      '</div>'+
      '<p class="small muted" style="margin:0 0 6px">Trend '+trendChip(recent90,prev90)+' — '+recent90+' in the last 90 days vs '+prev90+' in the previous 90.'+
        (projLost>0?' At the last 90 days’ rate that is about <b>'+gbp(projLost)+' a year</b> in fees you don’t charge.':'')+
        ' The per-client % is each client’s share of their own sessions.</p>'+
      (lcClients.length?lcCur.map(lcLi).join("")+
          (lcOld.length?agedFold("lc","Finished & long inactive · "+plural(lcOld.length,"client"),
            plural(lcOldMissed,"missed session")+(lcOldLost>0?' · '+gbp(Math.round(lcOldLost))+' not charged':'')):"")
        :'<p class="muted small">No missed sessions recorded yet.</p>')+'</div>';

    /* ---- attendance ---- */
    const attRows=S.clients.map(c=>({c,a:clientAttendance(c)})).filter(x=>x.a&&x.a.n>=2);
    const attPctChip=p=>'<span class="chip '+(p>=85?'s':p>=65?'f':'n')+'">'+p+'%</span>';
    const fmtRange=(a,b)=>fmtDM(a)+'–'+fmtDM(b);
    const pauseNote=a=>{const parts=[];
      if(a.pauses.length)parts.push(a.pauses.length+' pause'+(a.pauses.length>1?'s':'')+' (excluded): '+a.pauses.map(p=>fmtRange(p.from,p.to)).join(', '));
      if(a.currentPause)parts.push('on a pause since '+fmtDM(a.currentPause.from)+' ('+a.currentPause.days+'d)');
      return parts.length?'<div class="li-sub" style="color:var(--accent-ink)">⏸ '+esc(parts.join(' · '))+'</div>':'';};
    const attAvg=attRows.length?Math.round(attRows.reduce((s,x)=>s+x.a.pct,0)/attRows.length):0;
    const attSorted=attRows.slice().sort((a,b)=>a.a.pct-b.a.pct||b.a.n-a.a.n);
    const attLi=x=>{const a=x.a;
      return '<div class="list-item" data-id="'+x.c._id+'"><div class="li-main"><div class="li-title">'+esc(x.c.code)+' '+attPctChip(a.pct)+'</div><div class="li-sub">'+a.attended+' of '+a.expected+' expected · '+esc(x.c.frequency||"")+'</div>'+pauseNote(a)+'</div><div class="li-right"><span class="small muted">since '+fmtDM(a.first)+'</span></div></div>';};
    const grpAvg=arr=>arr.length?Math.round(arr.reduce((s,x)=>s+x.a.pct,0)/arr.length):0;
    /* current clients stay listed and keep their Ongoing / other grouping; the rest fold away,
       but only once there are enough of them to be worth folding (see AGED_MIN) */
    const attAged=attSorted.filter(x=>!trendsIsCurrent(x.c,lastSeen[(x.c.code||"").toLowerCase()]));
    const attFold=attAged.length>=AGED_MIN;
    const attCur=attFold?attSorted.filter(x=>trendsIsCurrent(x.c,lastSeen[(x.c.code||"").toLowerCase()])):attSorted;
    const attOld=attFold?attAged:[];
    const attOngoing=attCur.filter(x=>(x.c.status||"")==="Ongoing");
    const attOther=attCur.filter(x=>(x.c.status||"")!=="Ongoing");
    const attSection=(title,arr)=>arr.length?'<div class="grp-h">'+title+' <span class="muted" style="font-weight:600">· '+arr.length+' client'+(arr.length>1?'s':'')+' · avg '+grpAvg(arr)+'%</span></div>'+arr.map(attLi).join(""):"";
    const attOldSessions=attOld.reduce((s,x)=>s+x.a.n,0);
    const attSeries=rollingAttendanceSeries(attRows);   /* the chart keeps everyone — it is history */
    const attCard='<div class="card"><h2>Attendance</h2>'+
      '<p class="small muted" style="margin:0 0 8px">How regularly each client attends vs their expected frequency, since their first session. Long gaps (3× the interval or more) count as a pause and are excluded from the rate (but noted ⏸). Missed sessions don’t count as attended.</p>'+
      '<div class="kpis mb">'+
        '<div class="kpi"><div class="v">'+attAvg+'%</div><div class="l">Avg attendance</div></div>'+
        '<div class="kpi"><div class="v">'+attRows.length+'</div><div class="l">Clients tracked</div></div>'+
      '</div>'+
      (attRows.length?'<p class="small muted" style="margin:0 0 2px">3-month rolling attendance rate across all tracked clients.</p>'+chartAttendance(attSeries):"")+
      (attSorted.length?attSection('Ongoing',attOngoing)+attSection('Paused',attOther)+
          (attOld.length?agedFold("att","Finished & long inactive · "+plural(attOld.length,"client"),
            'avg '+grpAvg(attOld)+'% attendance · '+plural(attOldSessions,"session")+' between them'):"")
        :'<p class="muted small">Need at least two sessions per client to measure attendance.</p>')+'</div>';
    /* ---- ongoing clients on a current pause: prompt to review status ---- */
    const review=attRows.filter(x=>x.a.currentPause);
    const reviewCard=review.length?'<div class="card" style="border:1px solid var(--accent)"><h2>⏸ Review status</h2>'+
      '<p class="small muted" style="margin:0 0 6px">These clients are marked <b>Ongoing</b> but haven’t had a session in 3× their usual interval or more. Consider updating them to <b>Paused</b> or <b>Finished</b>.</p>'+
      review.sort((a,b)=>b.a.currentPause.days-a.a.currentPause.days).map(x=>'<div class="list-item" data-id="'+x.c._id+'"><div class="li-main"><div class="li-title">'+esc(x.c.code)+' <span class="chip f">'+x.a.currentPause.days+'d gap</span></div><div class="li-sub">Last session '+fmtDMY(x.a.last)+' · '+esc(x.c.frequency||"")+'</div></div><div class="li-right"><span class="small muted">tap to update ›</span></div></div>').join("")+'</div>':'';

    const foldedTotal=attOld.length+lcOld.length+deepOld.length;
    body.innerHTML=(foldedTotal?'<p class="small muted" style="margin:-2px 0 10px">Lists below show clients you are currently seeing. Anyone finished, or not seen for over a year, is folded into a ⌄ summary row — they still count in every total and chart, they are just out of the way. Tap one to see them.</p>':'')+
      '<div class="card"><h2>Client retention funnel</h2><p class="small muted" style="margin:0 0 10px">How clients progress over time, by number of sessions.</p><div class="funnel">'+rows+'</div></div>'+
      '<div class="kpis mb">'+
        '<div class="kpi"><div class="v">'+base+'</div><div class="l">Clients seen</div></div>'+
        '<div class="kpi"><div class="v">'+avg+'</div><div class="l">Avg sessions / client</div></div>'+
      '</div>'+
      reviewCard+
      attCard+
      lcCard+
      (deep.length?'<div class="card"><h2>Long-term clients</h2><p class="small muted" style="margin:0 0 6px">Clients seen for 20+ sessions.</p>'+
        deepCur.map(deepLi).join("")+
        (deepOld.length?agedFold("deep","Finished & long inactive · "+plural(deepOld.length,"client"),
          plural(deepOldSessions,"session")+' between them'):"")+'</div>':'');
    body.querySelectorAll(".list-item[data-id]").forEach(li=>li.onclick=()=>clientForm(S.clients.find(c=>c._id===li.dataset.id)));
    /* folded rows are built the first time each block is opened, not now */
    wireAgedFolds(body,{
      att:()=>attOld.map(attLi).join(""),
      lc:()=>lcOld.map(lcLi).join(""),
      deep:()=>deepOld.map(deepLi).join("")
    });
    requestAnimationFrame(()=>body.querySelectorAll(".funnel .fbar>i").forEach(i=>{i.style.width=(+i.dataset.w)+"%";}));
  }
  /* Supervision keeps its own inner Log / Peer / Insights bar - mounted whole rather than
     rebuilt, so peer supervision, CPD and accreditation all come across unchanged. */
  function renderSupervision(){body.innerHTML="";body.appendChild(supervisionPanel());}
  const route=()=>pracTab==="rooms"?renderRooms():pracTab==="trends"?renderMetrics()
    :pracTab==="supervision"?renderSupervision():renderClients();
  wireSegBar(v,"crtab","practice",route);
  route();return v;
};
/* Rooms bill one of two ways. Per-session is the original: a dated roomRateHistory step that
   derive() picks up per session. Monthly is a dated roomRentHistory step that the finances
   ledger charges once a month, with the per-session rate held at 0 so the same room can never
   charge twice for the same booking. Switching modes writes both steps — see roomBillingSwitch. */
function roomBilling(rm){return (rm&&rm.billing==="monthly")?"monthly":"session";}
function roomCostLabel(rm){
  const monthly=roomBilling(rm)==="monthly", iso=isoD(today());
  const unit=monthly?" / month":" / session";
  const now=monthly?effRoomRent(rm.location,iso):effRoomRate(rm.location,iso);
  if(!now){
    /* a change dated in the future would otherwise read as "£0" until the day it lands */
    const arr=monthly?(S.roomRentHistory||[]):(S.roomRateHistory||[]);
    const next=arr.filter(h=>(h.location||"").toLowerCase()===(rm.location||"").toLowerCase()&&parseD(h.effectiveFrom)>today())
      .sort((a,b)=>parseD(a.effectiveFrom)-parseD(b.effectiveFrom))[0];
    const amt=next?(monthly?+next.amount:+next.rate):0;
    if(amt)return gbp(amt)+unit+' <span class="small muted">from '+fmtDshort(next.effectiveFrom)+'</span>';
  }
  return gbp(now)+unit;
}
/* Frequency + the day it lands on, in one control. Mutates the `sched` object it's handed and
   shows the next two real dates underneath, so "the 31st" in February is never a surprise. */
function mountSchedulePicker(host,sched,o){
  if(!host)return;
  o=o||{};
  const dayOpts=[["last","the last day"]].concat(
    Array.from({length:31},(_,i)=>[String(i+1),"the "+ordinalDay(i+1)]));
  const draw=()=>{
    const wk=(sched.freq==="weekly"||sched.freq==="fortnightly");
    const none=(sched.freq==="none"||!sched.freq);
    host.innerHTML='<label>'+esc(o.label||"When is it due?")+'</label>'+
      '<div class="field2"><div><select id="sc_f">'+
        opts2([["none","No set date"]].concat(FREQS.filter(f=>f[0]!=="once")),sched.freq||"none")+'</select></div>'+
        '<div>'+(none?'':'<select id="sc_d">'+opts2(wk?WEEKDAYS:dayOpts,String(sched.day))+'</select>')+'</div></div>'+
      (o.hint?'<p class="small muted">'+o.hint+'</p>':'')+
      '<p class="small muted" id="sc_prev"></p>';
    const prev=host.querySelector("#sc_prev");
    if(none)prev.textContent="No reminder — nothing will appear in your payments list.";
    else{
      const t=today();const dates=[];let cur=t;
      for(let i=0;i<2;i++){const d=schedNext(sched,cur);if(!d)break;dates.push(fmtD(d));cur=addDays(d,1);}
      prev.innerHTML=dates.length?("Next: <b>"+dates.join("</b>, then <b>")+"</b>"):"";
    }
    const f=host.querySelector("#sc_f");
    f.onchange=()=>{const was=sched.freq;sched.freq=f.value;
      const wasWk=(was==="weekly"||was==="fortnightly"), nowWk=(sched.freq==="weekly"||sched.freq==="fortnightly");
      if(wasWk!==nowWk)sched.day=nowWk?"0":"1";            /* day means a different thing either side */
      draw();};
    const dsel=host.querySelector("#sc_d");
    if(dsel)dsel.onchange=()=>{sched.day=dsel.value;draw();};
  };
  draw();
}

/* Switch a room between billing modes from a date. Both histories get a step, so the room is
   charged exactly one way on any given day and nothing already logged is rewritten. */
function roomBillingSwitch(rm){
  const to=roomBilling(rm)==="monthly"?"session":"monthly";
  const loc=rm.location;
  const body=el('<div></div>');
  const suggest=to==="monthly"?(effRoomRent(loc,isoD(today()))||0):(effRoomRate(loc,isoD(today()))||0);
  body.innerHTML='<p class="muted small">'+(to==="monthly"
      ? 'From this date <b>'+esc(loc)+'</b> costs a flat monthly rent, and sessions there stop carrying a per-session room cost.'
      : 'From this date <b>'+esc(loc)+'</b> costs a set amount per session again, and the monthly rent stops.')+
    ' <b>Sessions before it keep exactly what they cost at the time.</b></p>'+
    '<label>Effective from</label><input type="date" id="rbD" value="'+isoD(today())+'">'+
    '<label>'+(to==="monthly"?"Monthly rent (£)":"Cost per session (£)")+'</label>'+
    '<input type="number" id="rbA" value="'+suggest+'">'+
    '<button class="btn full mt" id="rbS">Switch to '+(to==="monthly"?"monthly rent":"a per-session cost")+'</button>';
  body.querySelector("#rbS").onclick=async()=>{
    const dt=body.querySelector("#rbD").value, amt=+body.querySelector("#rbA").value;
    if(!dt||isNaN(amt)){toast("Enter date and amount");return}
    const ex=S.rooms.find(x=>x._id===rm._id); if(!ex){toast("Room not found");return}
    if(to==="monthly"){
      S.roomRateHistory.push({_id:uid(),location:loc,effectiveFrom:dt,rate:0});
      S.roomRentHistory.push({_id:uid(),location:loc,effectiveFrom:dt,amount:amt});
      ex.billing="monthly"; if(parseD(dt)<=today())ex.rate=0;
    }else{
      S.roomRentHistory.push({_id:uid(),location:loc,effectiveFrom:dt,amount:0});
      S.roomRateHistory.push({_id:uid(),location:loc,effectiveFrom:dt,rate:amt});
      ex.billing="session"; if(parseD(dt)<=today())ex.rate=amt;
    }
    await commit("Room billing: "+loc+" → "+(to==="monthly"?gbp(amt)+"/month":gbp(amt)+"/session")+" from "+dt);
    closeSheet();toast("Billing updated");go("practice",{seg:"rooms",keepScroll:true});};
  openSheet("Switch billing · "+loc,body);
}

/* ===== Business costs & other income =====
   Two ledgers with the same shape, so one form serves both. A monthly row is stored once and
   expanded at read time by ledgerBetween — editing the amount corrects every month it covers. */
/* ===== HMRC self-employment categories =====
   Each cost maps to a box on the SA103 self-employment pages. That mapping is what makes the
   quarterly MTD totals possible later, and it is why categories are keyed objects rather than
   free text: the label can be reworded without silently re-pointing anyone's figures.

   `risk` marks a deduction HMRC frequently challenges. The app does not hide these -- it is not
   the app's job to make that call -- but it will not present a contested position as settled
   either. Anything with a `risk` shows an amber note wherever it is chosen. */
const SA103={
  20:"Car, van and travel expenses",
  21:"Rent, rates, power and insurance costs",
  23:"Phone, fax, stationery and other office costs",
  24:"Advertising and business entertainment costs",
  26:"Bank, credit card and other financial charges",
  28:"Accountancy, legal and other professional fees",
  30:"Other business expenses",
  16:"Any other business income"
};
const EXP_CATS=[
  {k:"supervision", n:"Clinical supervision",            box:28, hint:"Required to practise, so squarely allowable."},
  {k:"memberships", n:"Professional memberships",        box:28, hint:"BACP, UKCP, BABCP and other bodies on HMRC's approved list."},
  {k:"insurance",   n:"Professional indemnity insurance",box:21},
  {k:"roomhire",    n:"Room hire",                       box:21, hint:"Rooms you rent monthly are counted from Practice \u203a Rooms \u2014 only add one-off hire here."},
  {k:"useofhome",   n:"Use of home",                     box:21, auto:true},
  {k:"utilities",   n:"Utilities at a practice premises",box:21},
  {k:"cpd",         n:"CPD & training",                  box:30,
    risk:"Training that keeps your existing skills current is allowable. A course that qualifies you to do something new reads as capital, or as starting a new trade, and generally is not."},
  {k:"therapy",     n:"Personal therapy",                box:30,
    risk:"HMRC often disallows this. There is normally a personal benefit alongside the professional one, so it can fail the \u2018wholly and exclusively\u2019 test. Some accountants do claim it where a training body requires it \u2014 worth agreeing with yours before you rely on it."},
  {k:"dbs",         n:"DBS checks & registrations",      box:30},
  {k:"ico",         n:"ICO data protection fee",         box:30},
  {k:"website",     n:"Website & hosting",               box:24},
  {k:"marketing",   n:"Advertising & directories",       box:24},
  {k:"phone",       n:"Phone & internet",                box:23, hint:"Business proportion only if the line is also personal."},
  {k:"office",      n:"Stationery, postage & printing",  box:23},
  {k:"software",    n:"Software & subscriptions",        box:23},
  {k:"travel",      n:"Travel between work locations",   box:20,
    hint:"Travel between places you work is allowable. Ordinary commuting to a regular workplace is not."},
  {k:"bank",        n:"Bank & card charges",             box:26},
  {k:"accountancy", n:"Accountancy & legal",             box:28},
  {k:"equipment",   n:"Equipment & furniture",           box:30, hint:"On the cash basis most equipment is deductible when bought. Cars are the exception."},
  {k:"other",       n:"Other business costs",            box:30}
];
const INC_CATS=[
  {k:"sublet",      n:"Room sublet",            box:16},
  {k:"workshops",   n:"Workshops & training",   box:16},
  {k:"supervising", n:"Supervision provided",   box:16},
  {k:"writing",     n:"Writing & consultancy",  box:16},
  {k:"other",       n:"Other income",           box:16}
];
function catList(kind){return kind==="inc"?INC_CATS:EXP_CATS;}
function catOf(kind,key){const l=catList(kind);return l.find(c=>c.k===key)||l[l.length-1];}
/* Old free-text categories -> new keys. Anything unrecognised keeps its original text on the
   record and lands in "other", so a migration can never quietly bin someone's labelling. */
const CAT_MIGRATE={
  "insurance":"insurance","utilities":"utilities","professional fees":"memberships",
  "training & cpd":"cpd","travel":"travel","equipment":"equipment","software":"software",
  "marketing":"marketing","bank & card fees":"bank","room hire":"roomhire","room rent":"roomhire",
  "other":"other","room sublet":"sublet","workshops & training":"workshops",
  "supervision provided":"supervising","writing & consultancy":"writing"
};
function migrateCat(kind,txt){
  const k=CAT_MIGRATE[String(txt||"").trim().toLowerCase()];
  if(k&&catList(kind).some(c=>c.k===k))return k;
  return "other";
}
/* Kept for the few places that still want a plain label. */
const FIN_CATS={exp:EXP_CATS.map(c=>c.n),inc:INC_CATS.map(c=>c.n)};
function finArr(kind){return kind==="exp"?(S.expenses=S.expenses||[]):(S.otherIncome=S.otherIncome||[]);}
function finRecurring(x){return String(x&&x.recurrence||"once")!=="once";}

/* ===== Payments due =====
   The point of this card is not accounting — it's not missing a payment. Anything overdue or
   landing in the next few weeks, newest first, each with one tap to tick it off. */
function paymentsDueCard(){
  if(!feat("finances"))return "";
  const t=today();
  const from=addDays(t,-120), to=addDays(t,35);
  const rows=chargesBetween(from,to).filter(c=>{
    if(c.personal)return false;                       /* separate work isn't the practice's diary */
    /* Keep it visible for a fortnight after it was TICKED, not after it fell due — otherwise
       settling an old overdue charge makes the row vanish the instant you tap it, with no ✓ and
       no way back if you tapped it by mistake. */
    if(c.paidOn)return parseD(c.paidOn)>=addDays(t,-14);
    return true;
  });
  const overdue=rows.filter(c=>!c.paidOn&&c.due<t);

      :late?(days===0?'due today':days+' day'+(days===1?'':'s')+' late')
      :('due '+fmtD(c.due));

      '<div class="li-title">'+esc(c.label)+' '+
        (c.kind==="inc"?'<span class="chip na">expected in</span>':'')+
        (late?'<span class="chip n">overdue</span>':'')+
        (c.paidOn?'<span class="chip y">✓</span>':'')+'</div>'+
      '<div class="li-sub">'+esc(when)+(c.paidOn?'':' · '+fmtD(c.due))+'</div></div>'+
      '<div class="li-right" style="display:flex;align-items:center;gap:8px">'+gbp(c.amount)+
        '<button class="btn sm '+(c.paidOn?'ghost':'sec')+'" data-pay="'+esc(c.key)+'" data-lbl="'+esc(c.label)+'" data-on="'+(c.paidOn?'1':'0')+'">'+
          (c.paidOn?'Undo':(c.kind==="inc"?'Received':'Paid'))+'</button>'+
      '</div></div>';
  };
  const body=(overdue.length||soon.length||done.length)
    ? (overdue.length?'<div class="grp-h" style="margin-top:10px">Overdue</div>'+overdue.map(row).join(""):'')+

      (done.length?'<details class="dz" style="margin-top:10px"><summary>Recently settled ('+done.length+')</summary>'+done.map(row).join("")+'</details>':'')
    : '<p class="muted small mt">Nothing due. Costs and rents with a repeat show up here as their date approaches.</p>';
  return '<div class="card"><h2>Payments due</h2>'+
    '<p class="small muted">Room rent and repeating costs, so nothing slips. Ticking one off changes nothing in your tax figures — a cost still counts in the year it fell due.</p>'+
    (overdue.length?'<div class="vmsg warn" style="margin-top:10px">⚠️ '+overdue.length+' payment'+(overdue.length===1?'':'s')+' overdue'+(owed?', '+gbp(Math.round(owed))+' outstanding':'')+'.</div>':'')+
    '<div style="padding:0 2px">'+body+'</div></div>';
}

/* ===== UK sole-trader tax (Income Tax + Class 4/2 NIC) ===== */
function taxRates(ty){const sy=parseInt(ty.slice(0,4));
  const r={pa:12570,basicTop:50270,higherTop:125140,c4lpl:12570,c4upl:50270,c4upper:0.02};
  r.c4main=(sy>=2024)?0.06:0.09;
  /* Class 2 stopped being compulsory from 2024/25 -- but it can still be paid VOLUNTARILY below
     the Small Profits Threshold to keep a State Pension qualifying year, which matters a lot to a
     part-time practice. Mandatory before that, optional after. */
  r.spt=6725; r.class2week=(sy>=2025)?3.50:3.45;
  r.class2Mandatory=(sy<2024);
  return r;}
/* Scotland sets its own income tax bands on non-savings income. Anything else -- the personal
   allowance, both classes of NI -- stays UK-wide. */
/* Absolute income thresholds, not widths. These were previously the widths ABOVE the personal
   allowance for the first four bands and absolute for the last two, while the loop below
   treats every entry as absolute -- which pushed income into the higher bands far too early
   and overstated Scottish tax by up to ~3,300 a year. */
const SCOT_BANDS=[[15397,0.19],[27491,0.20],[43662,0.21],[75000,0.42],[125140,0.45],[Infinity,0.48]];
function taxRegion(){return settings().taxRegion==="scotland"?"scotland":"rUK";}
const SL_PLANS={
  none:null,
  plan1:{n:"Plan 1",thr:26065,rate:0.09},
  plan2:{n:"Plan 2",thr:28470,rate:0.09},
  plan4:{n:"Plan 4",thr:32745,rate:0.09},
  plan5:{n:"Plan 5",thr:25000,rate:0.09},
  pg:{n:"Postgraduate",thr:21000,rate:0.06}
};
function studentLoanDue(profit){
  const p=SL_PLANS[settings().studentLoan]; if(!p)return 0;
  return Math.max(0,profit-p.thr)*p.rate;
}
function ukTax(profit,ty){profit=Math.max(0,profit||0);const r=taxRates(ty);
  let pa=r.pa;if(profit>100000)pa=Math.max(0,r.pa-(profit-100000)/2);
  /* Personal pension contributions are paid net and extend the basic-rate band by the gross
     amount, so higher-rate relief arrives through the bands rather than as a deduction. */
  const penGross=Math.round(pensionAmt()*12/0.8);
  const basicTop=r.basicTop+penGross, higherTop=r.higherTop+penGross;
  let b1=0,b2=0,b3=0,scot=null;
  if(taxRegion()==="scotland"){
    scot=[];let lower=pa;
    SCOT_BANDS.forEach(bd=>{const top=(bd[0]===Infinity)?Infinity:bd[0]+penGross;
      const amt=Math.max(0,Math.min(profit,top)-lower);
      if(amt>0)scot.push({top:bd[0],rate:bd[1],amt,tax:amt*bd[1]});
      lower=Math.max(lower,top);});
    b1=scot.reduce((a,x)=>a+x.tax,0);
  }else{
    b1=Math.max(0,Math.min(profit,basicTop)-pa)*0.20;
    b2=Math.max(0,Math.min(profit,higherTop)-basicTop)*0.40;
    b3=Math.max(0,profit-higherTop)*0.45;
  }
  const incomeTax=b1+b2+b3;
  const n1=Math.max(0,Math.min(profit,r.c4upl)-r.c4lpl)*r.c4main;
  const n2=Math.max(0,profit-r.c4upl)*r.c4upper;
  let class2=0;
  if(r.class2Mandatory)class2=profit>=r.spt?r.class2week*52:0;
  else if(settings().class2Voluntary&&profit<r.spt)class2=r.class2week*52;
  const sl=studentLoanDue(profit);
  const total=incomeTax+n1+n2+class2+sl;
  return {profit,pa,penGross,scot,b1,b2,b3,incomeTax,n1,n2,class2,sl,total,
    effective:profit>0?total/profit:0,r};}
function tyBounds(ty){const sy=parseInt(ty.slice(0,4));return {start:new Date(sy,3,6),end:new Date(sy+1,3,5)};}

/* ===== Business finances ledger: expenses, other income and monthly room rent =====
   Recurring rows are stored once and expanded here rather than generated into the data, so
   correcting an amount corrects every period it applies to and there is nothing to keep in sync.
   Every figure that reports money comes through ledgerBetween(), so the Net column, the tax
   estimate and the charts cannot drift apart. */

/* ===== Repeat schedules =====
   One vocabulary for every recurring thing: room rent, business costs, other income. A monthly
   (or quarterly / annual) repeat lands on its anchor date's day of the month, clamped in short
   months so 31 Jan → 28 Feb → 31 Mar with no drift. Weekly repeats keep the anchor's weekday. */
const FREQS=[["once","One-off"],["weekly","Every week"],["fortnightly","Every 2 weeks"],
             ["monthly","Every month"],["quarterly","Every 3 months"],["annually","Every year"]];
function freqLabel(f){const p=FREQS.find(x=>x[0]===String(f||"once"));return p?p[1]:"One-off";}
function freqShort(f){switch(String(f||"once")){
  case "weekly":return "weekly"; case "fortnightly":return "fortnightly"; case "monthly":return "monthly";
  case "quarterly":return "quarterly"; case "annually":return "yearly"; default:return "";}}
/* nth occurrence of a schedule anchored at `start` (n = 0 is the anchor itself) */
function freqStep(start,freq,n){
  const dom=start.getDate();
  switch(String(freq)){
    case "weekly":      return addDays(start,7*n);
    case "fortnightly": return addDays(start,14*n);
    case "monthly":
    case "quarterly":
    case "annually":{
      const mult=(freq==="monthly")?1:(freq==="quarterly")?3:12;
      const y=start.getFullYear(), m=start.getMonth()+mult*n;
      const dim=new Date(y,m+1,0).getDate();
      return new Date(y,m,Math.min(dom,dim));
    }
    default: return n===0?new Date(start):null;
  }
}
/* Occurrences of one expense/income row inside [from,to], honouring its end date. */
function moneyOccurrences(item,from,to){
  const start=item&&item.date?parseD(item.date):null;
  if(!start)return [];
  const amount=+item.amount||0, freq=String(item.recurrence||"once");
  if(freq==="once"||!FREQS.some(f=>f[0]===freq&&f[0]!=="once"))
    return (start>=from&&start<=to)?[{date:start,amount}]:[];
  const stop=item.endDate?parseD(item.endDate):null;
  const last=(stop&&stop<to)?stop:to;
  const out=[];
  for(let n=0;n<4000;n++){                                  /* a long life, then give up */
    const d=freqStep(start,freq,n);
    if(!d||d>last)break;
    if(d>=from)out.push({date:d,amount});
  }
  return out;
}
/* Next scheduled date on or after `from` for a room's payment schedule. */
function schedNext(sched,from){
  if(!sched||sched.freq==="none"||!sched.freq)return null;
  const anchor=schedAnchor(sched);
  if(!anchor)return null;
  for(let n=0;n<4000;n++){
    const d=freqStep(anchor,sched.freq,n);
    if(!d)return null;
    if(d>=from)return d;
  }
  return null;
}
/* The schedule's first date, derived from its day-of-month (or weekday) near the epoch of use. */
function schedAnchor(sched){
  const base=new Date(2000,0,1);
  if(sched.freq==="weekly"||sched.freq==="fortnightly"){
    const want=(+sched.day||0)%7;                            /* 0 = Monday */
    const cur=(base.getDay()+6)%7;
    return addDays(base,(want-cur+7)%7);
  }
  if(String(sched.day)==="last")return new Date(2000,1,0);   /* 31 Jan 2000 — clamps to each month's end */
  const dom=Math.max(1,Math.min(31,+sched.day||1));
  return new Date(2000,0,dom);
}
const WEEKDAYS=[["0","Monday"],["1","Tuesday"],["2","Wednesday"],["3","Thursday"],["4","Friday"],["5","Saturday"],["6","Sunday"]];
function ordinalDay(n){n=+n;const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
/* Legacy rooms stored due as n/a | EOM | EOW. Read either shape, always return the new one. */
function roomSchedule(rm){
  const p=rm&&rm.pay;
  if(p&&p.freq)return {freq:p.freq,day:(p.day==null?1:p.day)};
  const due=String(rm&&rm.due||"n/a");
  if(due==="EOM")return {freq:"monthly",day:"last"};
  if(due==="EOW")return {freq:"weekly",day:"6"};             /* end of week = Sunday */
  return {freq:"none",day:1};
}
function schedLabel(sched){
  if(!sched||sched.freq==="none")return "No set payment date";
  if(sched.freq==="weekly"||sched.freq==="fortnightly"){
    const wd=(WEEKDAYS.find(w=>w[0]===String(sched.day))||WEEKDAYS[0])[1];
    return (sched.freq==="weekly"?"Every ":"Every other ")+wd;
  }
  const day=String(sched.day)==="last"?"the last day":"the "+ordinalDay(sched.day);
  return (sched.freq==="monthly"?"Monthly on ":sched.freq==="quarterly"?"Quarterly on ":"Yearly on ")+day;
}
/* Monthly rent effective on a date — dated steps, exactly like effRoomRate. 0 = no rent. */
function effRoomRent(loc,dateStr){const d=parseD(dateStr);const L=(loc||"").toLowerCase();let best=null;
  for(const h of (S.roomRentHistory||[])){ if((h.location||"").toLowerCase()!==L)continue;
    const ef=parseD(h.effectiveFrom); if(d&&ef<=d){ if(!best||parseD(best.effectiveFrom)<ef)best=h; } }
  return best?(+best.amount||0):0;}
/* Rent charges landing inside [from,to]. Each room bills on the day of the month its rent
   started, so a mid-month tax-year boundary lands the charge in the year it was actually due. */
function roomRentOccurrences(from,to){
  const out=[],byLoc={};
  (S.roomRentHistory||[]).forEach(h=>{const k=(h.location||"").toLowerCase();if(!k)return;(byLoc[k]=byLoc[k]||[]).push(h);});
  Object.keys(byLoc).forEach(k=>{
    const steps=byLoc[k].slice().sort((a,b)=>parseD(a.effectiveFrom)-parseD(b.effectiveFrom));
    const first=parseD(steps[0].effectiveFrom); if(!first)return;
    const loc=steps[0].location;
    /* The accrual date stays anchored to when the rent started, NOT to the payment schedule:
       the schedule is a reminder the therapist can change at any time, and letting it move this
       date would silently shift historical rent between tax years. Each occurrence carries its
       payment date separately (see `due` below) for the payments-due list. */
    const rm=roomFor(loc), sc=rm?roomSchedule(rm):null, dom=first.getDate();
    let cur=new Date(first.getFullYear(),first.getMonth(),1);
    for(let i=0;i<1200;i++){
      const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      const d=new Date(cur.getFullYear(),cur.getMonth(),Math.min(dom,dim));
      if(d>to)break;
      if(d>=first&&d>=from){const amt=effRoomRent(loc,isoD(d));
        if(amt>0)out.push({location:loc,date:d,amount:amt,due:(sc&&schedNext(sc,d))||d});}
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
  });
  return out;
}
/* ===== Which basis the tax figures are computed on =====
   Cash: counted when money actually moved. Accruals: counted when the work was done or the cost
   fell due. Where a payment date has not been recorded, cash falls back to the accrual date --
   otherwise an untidied tick-list would silently wipe every cost out of the return. */
function taxBasis(){const b=settings().taxBasis;return b==="accruals"?"accruals":"cash";}
function basisLabel(){return taxBasis()==="cash"?"Cash basis":"Accruals basis";}
function basisNote(){return taxBasis()==="cash"
  ? "Counted when the money moved \u2014 HMRC's default for sole traders. Sessions count when paid; costs count when you tick them off (or on their due date if you have not)."
  : "Counted when the work was done and costs fell due, whether or not they have been settled. This is an election you make on your tax return.";}

/* ===== Use of home =====
   Two ways HMRC lets a sole trader claim for working at home.

   Simplified: a flat monthly amount by hours worked at home. No records to keep, no
   apportionment to defend, and for most part-time practices it is within a few pounds of the
   actual figure anyway.
   Actual: apportion real household bills by rooms used and the share of time they are used for
   work. Mortgage capital repayments are never allowable -- interest only.

   Either way this generates a monthly cost at read time; nothing is written into the ledger. */
const UOH_BANDS=[[25,10],[51,18],[101,26]];   /* [hours from, GBP per month] */
function uohRate(hours){let r=0;UOH_BANDS.forEach(b=>{if(hours>=b[0])r=b[1];});return r;}
function uohYears(){const u=settings().useOfHome||{};return (u.years=u.years||{});}
function uohBlank(){return {method:"none",hours:0,rooms:0,workRooms:0,businessPct:100,costs:{}};}
/* The record actually in force for a year: its own if it has one, otherwise the most recent
   earlier year's, carried forward. `inherited` tells the UI to say so. */
function uohForYear(ty){
  const ys=uohYears();
  if(ys[ty])return {cfg:Object.assign(uohBlank(),ys[ty]),inherited:false,from:ty};
  const earlier=Object.keys(ys).filter(k=>k<ty).sort();
  if(earlier.length){const k=earlier[earlier.length-1];
    return {cfg:Object.assign(uohBlank(),ys[k]),inherited:true,from:k};}
  return {cfg:uohBlank(),inherited:false,from:null};
}
/* The draft a year is being edited with -- saved inputs, but not necessarily the applied method. */
function uohDraft(ty){const ys=uohYears();return Object.assign(uohBlank(),ys[ty]||uohForYear(ty).cfg);}
/* "I have filed this year" is a note to self, kept OUTSIDE the per-year config on purpose:
   writing it into the config would give an inheriting year a record of its own, silently turning
   it from "carried" into "set" as a side effect of ticking a checkbox. Nothing reads it but the UI. */
function uohFiled(){const u=settings().useOfHome||{};return (u.filed=u.filed||{});}
/* What a year is, in one word, for the year strip. Reads uohForYear so the strip and the card
   below it can never tell different stories about the same year. */
function uohYearStatus(y){
  const filed=!!uohFiled()[y], own=uohYears()[y];
  if(own){const claiming=own.method&&own.method!=="none";
    return {k:claiming?"set":"none",label:claiming?"set":"no claim",filed};}
  const inf=uohForYear(y);
  if(inf.inherited)return {k:"carried",label:"carried",from:inf.from,filed};
  return {k:"empty",label:"not set",filed};
}
/* The most recent EARLIER year that has a record of its own -- the one worth copying from. */
function uohPrevSource(ty){return Object.keys(uohYears()).filter(k=>k<ty).sort().pop()||null;}
/* Bills usually move by a percentage, not wholesale, so last year's figures are the right
   starting point for editing. Copies the INPUTS and carries across whatever method is already
   in force for this year -- the year was inheriting that method anyway, so nothing about what is
   claimed changes here; it just stops this year drifting when the earlier year is next edited. */
function uohCopyFrom(src,ty){
  const ys=uohYears(), from=ys[src]; if(!from)return false;
  const own=ys[ty], inForce=uohForYear(ty).cfg;
  const cur=Object.assign(uohBlank(),own||inForce);
  cur.hours=+from.hours||0; cur.rooms=+from.rooms||0; cur.workRooms=+from.workRooms||0;
  cur.businessPct=(from.businessPct==null?100:+from.businessPct);
  cur.costs=Object.assign({},from.costs||{});
  cur.method=inForce.method||"none";
  /* appliedAt is this year's own, never the source's -- `cur` was seeded from the inherited
     config, which carries the earlier year's date with it. uohOccurrences starts from the
     EARLIEST appliedAt across all years, so this changes no figure; it stops the record
     claiming it was applied in a year it wasn't. */
  if(cur.method==="none")delete cur.appliedAt;
  else cur.appliedAt=(own&&own.appliedAt)||isoD(tyBounds(ty).start);
  ys[ty]=cur;
  return true;
}
function uohConfig(ty){return uohForYear(ty||curTaxYear()).cfg;}
function uohMonthlyFor(cfg){
  if(!cfg)return 0;
  if(cfg.method==="simplified")return uohRate(+cfg.hours||0);
  if(cfg.method==="actual")return uohActualAnnual(cfg)/12;
  return 0;
}
function uohActualAnnual(c){
  const t=c.costs||{};
  const total=(+t.rent||0)+(+t.councilTax||0)+(+t.gas||0)+(+t.electric||0)+(+t.water||0)+(+t.broadband||0)+(+t.other||0);
  if(!c.rooms||!c.workRooms)return 0;
  return total*(Math.min(c.workRooms,c.rooms)/c.rooms)*(Math.max(0,Math.min(100,c.businessPct))/100);
}
function uohMonthly(ty){return uohMonthlyFor(uohConfig(ty));}
/* Sessions logged at home, per month, over the last three months -- a starting point for the
   hours question. Deliberately an underestimate: it counts client contact only. */
function uohSessionHours(){
  const t=today(), from=new Date(t.getFullYear(),t.getMonth()-3,1);
  const homeish=r=>/home/i.test(r.location||"");
  const homes=S.rooms.filter(homeish).map(r=>(r.location||"").toLowerCase());
  let n=0;
  S.sessions.forEach(sx=>{const d=parseD(sx.date);if(!d||d<from||d>t)return;
    const loc=(sx.location||"").toLowerCase();
    if(homes.indexOf(loc)>=0||/home/i.test(loc))n++;});
  return Math.round(n/3);
}
/* One charge a month, each month valued by whatever method that month's TAX YEAR is using --
   so a year on the simplified rate and the next on actual costs both come out right. */
function uohOccurrences(from,to){
  const ys=uohYears();
  if(!Object.keys(ys).length)return [];
  const first=Object.keys(ys).sort()[0];
  const startISO=Object.values(ys).map(y=>y.appliedAt).filter(Boolean).sort()[0]
    ||isoD(tyBounds(first).start);
  const start=parseD(startISO); if(!start)return [];
  const out=[];
  let cur=new Date(start.getFullYear(),start.getMonth(),1);
  for(let i=0;i<1200;i++){
    const d=new Date(cur.getFullYear(),cur.getMonth(),1);
    if(d>to)break;
    if(d>=from&&d>=new Date(start.getFullYear(),start.getMonth(),1)){
      const amt=uohMonthlyFor(uohConfig(taxYear(d)));
      if(amt>0)out.push({date:d,amount:amt});
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out;
}

/* Totals for a date range. `total` is the effect on taxable profit: practice income less costs.
   Income marked personal (a second job, tutoring — a different trade) is counted separately and
   deliberately kept out of `total`, so it never inflates the practice's Self Assessment figure. */
/* ===== Which charges have actually been paid =====
   Accrual is what the tax figures use, so ledgerBetween ignores this entirely — a cost counts in
   the year it fell due whether or not it's been settled. This map exists purely so the therapist
   can tick things off and see what's overdue. Key: kind:ref|dueDate. */
function paidMap(){return (S.paidCharges=S.paidCharges||{});}
function chargeKey(kind,ref,date){return kind+":"+String(ref||"").toLowerCase()+"|"+isoD(date);}
function chargePaidOn(key){const v=paidMap()[key];return v||null;}
async function setChargePaid(key,paidOn,label){
  const m=paidMap();
  if(paidOn)m[key]=paidOn; else delete m[key];
  return commit((paidOn?"Marked paid: ":"Marked unpaid: ")+(label||key));
}
/* Every individual charge falling in [from,to] — rent, costs and expected income — each tagged
   with whether it's been ticked off. This is what the "payments due" list reads. */
function chargesBetween(from,to){
  const out=[];
  (S.expenses||[]).forEach(x=>moneyOccurrences(x,from,to).forEach(o=>out.push(
    {kind:"exp",ref:x._id,label:x.desc||"Cost",cat:catOf("exp",x.cat).n,box:catOf("exp",x.cat).box,date:o.date,amount:o.amount,freq:x.recurrence})));
  (S.otherIncome||[]).forEach(x=>moneyOccurrences(x,from,to).forEach(o=>out.push(
    {kind:"inc",ref:x._id,label:x.desc||"Income",cat:catOf("inc",x.cat).n,box:16,date:o.date,amount:o.amount,freq:x.recurrence,personal:finPersonal(x)})));
  roomRentOccurrences(from,to).forEach(o=>out.push(
    {kind:"rent",ref:(o.location||"").toLowerCase(),label:(o.location||"Room")+" rent",cat:"Room rent",
     date:o.date,due:o.due,amount:o.amount,freq:"monthly"}));
  /* `date` is when it was incurred (identity, and what the tax figures use); `due` is when it
     actually has to be handed over — that's what the list sorts and reads by. */
  out.forEach(c=>{if(!c.due)c.due=c.date;c.key=chargeKey(c.kind,c.ref,c.date);c.paidOn=chargePaidOn(c.key);});
  return out.sort((a,b)=>a.due-b.due);
}
function ledgerBetween(from,to,opts){
  opts=opts||{};
  if(typeof from==="string")from=parseD(from);
  if(typeof to==="string")to=parseD(to);
  if(opts.toDate){const t=today();if(to&&to>t)to=t;}
  const zero={expenses:0,otherIncome:0,personalIncome:0,roomRent:0,useOfHome:0,total:0};
  if(!from||!to||from>to)return zero;
  let expenses=0,otherIncome=0,personalIncome=0,roomRent=0;
  const cash=(opts.basis||taxBasis())==="cash";
  /* Under cash, an occurrence counts in the period its payment landed in. A wide window is
     scanned so a charge incurred before `from` but paid inside it is still picked up. */
  const wide=cash?addYears(from,-2):from, wideTo=cash?addYears(to,2):to;
  const hit=(kind,ref,occ)=>{
    if(!cash)return (occ.date>=from&&occ.date<=to);
    const paid=chargePaidOn(chargeKey(kind,ref,occ.date));
    const when=paid?parseD(paid):occ.date;                  /* not ticked: fall back to due date */
    return when>=from&&when<=to;
  };
  (S.expenses||[]).forEach(x=>moneyOccurrences(x,wide,wideTo).forEach(o=>{if(hit("exp",x._id,o))expenses+=o.amount;}));
  (S.otherIncome||[]).forEach(x=>{const personal=String(x.scope||"practice")==="personal";
    moneyOccurrences(x,wide,wideTo).forEach(o=>{if(!hit("inc",x._id,o))return;
      if(personal)personalIncome+=o.amount;else otherIncome+=o.amount;});});
  roomRentOccurrences(wide,wideTo).forEach(o=>{if(hit("rent",(o.location||"").toLowerCase(),o))roomRent+=o.amount;});
  /* Use of home is a computed allowance, not a bill anyone sends -- it is never "unpaid", so it
     counts on its own date under both bases. */
  let useOfHome=0;
  uohOccurrences(from,to).forEach(o=>{useOfHome+=o.amount;});
  expenses+=useOfHome;
  return {expenses,otherIncome,personalIncome,roomRent,useOfHome,total:otherIncome-expenses-roomRent};
}

function tyNet(y,toDateOnly){const t=today();let net=0;
  const cash=taxBasis()==="cash";
  S.sessions.forEach(s=>{const d=derive(s);
    /* Cash: the fee counts in the year it was received, and an unpaid session counts nowhere yet.
       The room charge follows the session either way -- it is incurred by seeing the client. */
    const when=cash?(s.paidDate||null):s.date;
    if(cash&&!when)return;
    if(taxYear(when)!==y)return;
    if(toDateOnly){const dd=parseD(when);if(!dd||dd>t)return;}
    net+=(d.rate||0)-(d.roomRate||0);});
  (S.supervision||[]).forEach(sv=>{if(!sv.date||taxYear(sv.date)!==y)return;if(toDateOnly){const dd=parseD(sv.date);if(!dd||dd>t)return;}net-=(+sv.cost||0);});
  (S.peerSupervision||[]).forEach(pv=>{if(!pv.date||taxYear(pv.date)!==y)return;if(toDateOnly){const dd=parseD(pv.date);if(!dd||dd>t)return;}net-=(+pv.cost||0);});
  const b=tyBounds(y);
  net+=ledgerBetween(b.start,b.end,{toDate:toDateOnly}).total;
  return Math.round(net);}
function taxForYear(y){const b=tyBounds(y),t=today();
  const status=b.end<t?"complete":(b.start<=t?"inprogress":"future");
  const netAll=tyNet(y,false);
  if(status==="future")return {status,netAll,display:null};
  if(status==="complete"){const calc=ukTax(netAll,y);return {status,netAll,calc,display:calc.total};}
  const netTD=tyNet(y,true);
  const yearDays=Math.round((b.end-b.start)/86400000)+1;
  const elapsed=Math.min(yearDays,Math.max(1,Math.round((t-b.start)/86400000)+1));
  const frac=elapsed/yearDays;
  const calcI=ukTax(netTD,y);
  const projAnnual=frac>0?netTD/frac:netTD;
  const calcProj=ukTax(projAnnual,y);
  const proRata=calcProj.total*frac;
  return {status,netAll,netTD,yearDays,elapsed,frac,calcI,calcProj,proRata,projAnnual,display:{proj:proRata,todate:calcI.total}};}
/* ===== What HMRC actually asks for, and when =====
   The bill is not just last year's tax. Once the liability passes GBP 1,000, HMRC also takes two
   payments on account towards NEXT year -- so the first January after a good year can be 150% of
   the tax due. That is the single thing that catches sole traders out, so the pot plans for it.
   Class 2 and student loan are never included in payments on account. */
const POA_THRESHOLD=1000;
function poaBase(calc){return Math.max(0,(calc.total||0)-(calc.class2||0)-(calc.sl||0));}
function taxSchedule(ty){
  const sy=parseInt(ty.slice(0,4));
  const calc=ukTax(Math.max(0,tyNet(ty,false)),ty);
  const prev=String(sy-1)+"-"+String(sy).slice(2);
  const prevCalc=ukTax(Math.max(0,tyNet(prev,false)),prev);
  const poaPrev=poaBase(prevCalc)>=POA_THRESHOLD?poaBase(prevCalc)/2:0;   /* each of last year's two */
  const balancing=calc.total-poaPrev*2;
  const poaThis=poaBase(calc)>=POA_THRESHOLD?poaBase(calc)/2:0;
  return {ty,calc,prev,prevCalc,poaPrev,
    jan:{date:new Date(sy+2,0,31),balancing,poa:poaThis,total:balancing+poaThis},
    jul:{date:new Date(sy+2,6,31),poa:poaThis,total:poaThis},
    firstYear:poaPrev===0&&poaThis>0};
}
function nextTaxPayment(){
  const t=today();
  const cands=[];
  [curTaxYear(),prevTaxYear()].forEach(y=>{const sc=taxSchedule(y);
    if(sc.jan.total>0)cands.push({when:sc.jan.date,amount:sc.jan.total,what:"Balancing payment for "+y+(sc.jan.poa>0?" + first payment on account":""),ty:y});
    if(sc.jul.total>0)cands.push({when:sc.jul.date,amount:sc.jul.total,what:"Second payment on account for "+y,ty:y});});
  cands.sort((a,b)=>a.when-b.when);
  return cands.find(c=>c.when>=t)||null;
}
function prevTaxYear(){const sy=parseInt(curTaxYear().slice(0,4))-1;return String(sy)+"-"+String(sy+1).slice(2);}
function trow(l,v,b){return '<tr><td>'+(b?'<b>'+l+'</b>':l)+'</td><td class="num">'+(b?'<b>'+v+'</b>':v)+'</td></tr>';}
function gbpR(n){return gbp(Math.round(n||0));}
function taxBreakdown(c){return '<table>'+
  trow('Taxable profit',gbpR(c.profit))+
  trow('Personal allowance',gbpR(c.pa))+
  trow('Income tax @ 20%',gbpR(c.b1))+
  (c.b2?trow('Income tax @ 40%',gbpR(c.b2)):'')+
  (c.b3?trow('Income tax @ 45%',gbpR(c.b3)):'')+
  trow('Class 4 NIC @ '+Math.round(c.r.c4main*100)+'%',gbpR(c.n1))+
  (c.n2?trow('Class 4 NIC @ 2%',gbpR(c.n2)):'')+
  (c.class2?trow('Class 2 NIC'+(c.r.class2Mandatory?'':' (voluntary)'),gbpR(c.class2)):'')+
  (c.sl?trow('Student loan'+(SL_PLANS[settings().studentLoan]?' ('+SL_PLANS[settings().studentLoan].n+')':''),gbpR(c.sl)):'')+
  (c.penGross?trow('Basic-rate band extended by pension',gbpR(c.penGross)):'')+
  trow('Total tax',gbpR(c.total),true)+
  trow('Effective rate',(c.effective*100).toFixed(1)+'%')+'</table>';}
function taxDetailsSheet(y){const tx=taxForYear(y);const body=el('<div></div>');let html='';
  const bnd=tyBounds(y), bd=profitBreakdown(bnd.start,bnd.end);
  const sched=taxSchedule(y);
  if(tx.status==="complete"){html='<div class="hint">Completed tax year.</div>'+taxBreakdown(tx.calc);}
  else if(tx.status==="inprogress"){const pc=Math.round(tx.frac*100);
    html='<div class="hint">In progress — '+tx.elapsed+' of '+tx.yearDays+' days ('+pc+'%) elapsed.</div>'+
      '<h3>Projected pro-rata'+(taxMode==="proj"?' · shown in table':'')+'</h3>'+
      '<p class="small muted">Net to date '+gbpR(tx.netTD)+' → projected full year '+gbpR(tx.projAnnual)+'. Full-year tax '+gbpR(tx.calcProj.total)+' × '+pc+'% = <b>'+gbpR(tx.proRata)+'</b>.</p>'+
      taxBreakdown(tx.calcProj)+
      '<h3 style="margin-top:16px">If you stopped today'+(taxMode==="todate"?' · shown in table':'')+'</h3>'+
      '<p class="small muted">Tax on net to date '+gbpR(tx.netTD)+' = <b>'+gbpR(tx.calcI.total)+'</b>.</p>'+
      taxBreakdown(tx.calcI);}
  else {html='<p class="muted">This tax year hasn’t started yet.</p>';}
  /* How the profit was arrived at comes FIRST -- the bands mean nothing without it. */
  html='<div class="grp-h">How the profit was worked out</div>'+breakdownHTML(bd,{clients:true})+
    '<div class="grp-h" style="margin-top:18px">The tax on it</div>'+html+
    '<div class="grp-h" style="margin-top:18px">When HMRC wants it</div>'+
    '<table>'+
      trow('31 Jan '+(parseInt(y)+2)+' \u2014 balancing payment',gbpR(sched.jan.balancing))+
      (sched.jan.poa?trow('31 Jan '+(parseInt(y)+2)+' \u2014 payment on account',gbpR(sched.jan.poa)):'')+
      trow('<b>Total due 31 Jan</b>','<b>'+gbpR(sched.jan.total)+'</b>',true)+
      (sched.jul.total?trow('31 Jul '+(parseInt(y)+2)+' \u2014 payment on account',gbpR(sched.jul.total)):'')+
    '</table>'+
    (sched.jan.poa?'<p class="small muted">Payments on account are advance instalments towards the <i>following</i> year, due because this bill passes \u00a3'+POA_THRESHOLD+'. Class 2 and student loan are never part of them.</p>':'');
  body.innerHTML=html+'<p class="small muted mt">Covers Income Tax, Class 4'+(parseInt(y)<2024?' and Class 2':'')+' National Insurance'+(settings().studentLoan!=="none"?', student loan':'')+' for a sole trader'+(taxRegion()==="scotland"?', at Scottish rates':'')+'. <b>An estimate from your own records, not tax advice</b> — it does not know your wider circumstances, and it cannot file for you.</p>';
  openSheet("Tax \u00b7 "+y,body);}

/* ===== Monthly take-home & pension =====
   Both of these return **null when the therapist has never set one**, which is deliberately not
   the same as zero. Suggesting a fee or a pension figure puts a number on someone's records that
   they never chose — so nothing is pre-filled, and every caller has to decide what "unset" looks
   like on its own screen. Use `pensionAmt()` where a number is needed for arithmetic. */
function pensionPcm(){try{const s=localStorage.getItem("tt_pension");if(s!==null&&s!==""&&!isNaN(+s))return +s;}catch(e){}return null;}
function setPensionPcm(v){try{if(v==null||v==="")localStorage.removeItem("tt_pension");else localStorage.setItem("tt_pension",String(v));}catch(e){}}
function pensionAmt(){return +pensionPcm()||0;}
function defaultRate(){try{const s=localStorage.getItem("tt_default_rate");if(s!=null&&s!==""&&!isNaN(+s))return +s;}catch(e){}return null;}
function setDefaultRate(v){try{if(v==null||v==="")localStorage.removeItem("tt_default_rate");else localStorage.setItem("tt_default_rate",String(v));}catch(e){}}
function clientCategory(status){const c=(S.clientCategories||[]).find(x=>x.status===status);return c?c.category:(status||"");}
function monthlyTakeHome(){const ty=curTaxYear();const tx=taxForYear(ty);
  let annualNet=0,annualTax=0;
  if(tx.status==="complete"){annualNet=tx.netAll;annualTax=tx.calc.total;}
  else if(tx.status==="inprogress"){annualNet=tx.projAnnual;annualTax=tx.calcProj.total;}
  const annualHome=annualNet-annualTax;
  return {ty,status:tx.status,annualNet,annualTax,annualHome,monthly:annualHome/12};}
function editPension(after){const body=el('<div></div>');
  const cur=pensionPcm();
  body.innerHTML='<p class="muted small">Set your monthly pension contribution. It’s deducted from your after-tax take-home in the “After pension” view (higher-rate relief is modelled by extending your basic-rate band).</p>'+
    '<label>Monthly pension contribution (£)</label><input type="number" min="0" id="penA" placeholder="Not set" value="'+(cur==null?"":esc(cur))+'">'+
    '<p class="small muted">Leave it blank if you don’t pay into a pension — the app won’t assume a figure.</p>'+
    '<div class="row mt" style="gap:8px"><button class="btn" id="penS">Save</button>'+
      (cur==null?"":'<button class="btn ghost" id="penClr">Clear</button>')+'</div>';
  body.querySelector("#penS").onclick=()=>{const raw=body.querySelector("#penA").value.trim();
    if(raw===""){setPensionPcm(null);closeSheet();toast("Pension cleared");if(after)after();return;}
    const val=+raw;
    if(isNaN(val)||val<0){toast("Enter an amount");Sfx.error();return;}
    setPensionPcm(val);closeSheet();toast("Pension updated");if(after)after();};
  const clr=body.querySelector("#penClr");
  if(clr)clr.onclick=()=>{setPensionPcm(null);closeSheet();toast("Pension cleared");if(after)after();};
  openSheet("Monthly pension",body);}

/* ===== Money — the day-to-day cash picture =====
   Overview (what came in), Costs & income (what goes out, what else comes in), and the
   spreadsheet-style Table. The tax-year machinery lives on its own tab; see VIEWS.tax. */
VIEWS.money=function(){
  const v=el('<div class="view active"></div>');
  const segs=[["overview","Overview"],["costs","Costs & income"]];
  if(feat("raw"))segs.push(["table","Table"]);
  if(moneySeg==="table"&&!feat("raw"))moneySeg="overview";
  v.innerHTML=segBar("moneyseg",segs,moneySeg)+'<div id="moneybody"></div>';
  const body=v.querySelector("#moneybody");

  function drawOverview(){
    const der=S.sessions.map(s=>({s,d:derive(s)}));
    const sum=(rows,f)=>rows.reduce((a,x)=>a+(f(x)||0),0);
    const t=today();const months=[];for(let i=0;i<12;i++)months.push(new Date(t.getFullYear(),t.getMonth()-i,1));
    const mTable=months.map(m=>{const end=new Date(m.getFullYear(),m.getMonth()+1,1);
      const rs=der.filter(x=>{const d=parseD(x.s.date);return d&&d>=m&&d<end});
      const billed=sum(rs,x=>x.d.rate),rec=sum(rs.filter(x=>x.d.clientPaid),x=>x.d.rate);
      return '<tr><td>'+m.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})+'</td><td class="num">'+rs.length+'</td><td class="num">'+gbp(billed)+'</td><td class="num">'+gbp(rec)+'</td><td class="num">'+(billed-rec?gbp(billed-rec):"–")+'</td></tr>';}).join("");
    const byClient=S.clients.map(c=>{const rs=der.filter(x=>(x.s.client||"").toLowerCase()===c.code.toLowerCase()&&x.d.overdue);
      return{code:c.code,n:rs.length,amt:sum(rs,x=>x.d.rate)}}).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);
    const due=der.filter(x=>x.d.roomDue==="Y");
    const roomGrp={}; due.forEach(x=>{const k=x.s.location||"?";const g=roomGrp[k]||(roomGrp[k]={n:0,amt:0,min:null,max:null});
      g.n++;g.amt+=x.d.roomRate||0;const d=parseD(x.s.date);if(!g.min||d<g.min)g.min=d;if(!g.max||d>g.max)g.max=d;});
    const roomRows=Object.keys(roomGrp).map(k=>{const g=roomGrp[k];
      const rng=g.min?(fmtDM(g.min)+(g.max&&+g.max!==+g.min?" – "+fmtDM(g.max):"")):"";
      return '<tr><td>'+esc(k)+'</td><td class="num">'+g.n+'</td><td>'+rng+'</td><td class="num">'+gbp(g.amt)+'</td></tr>';}).join("");
    const fc=incomeForecast();
    const fcCard='<div class="card"><h2>This month &amp; year at a glance</h2>'+
      '<div class="kpis mt">'+
        '<div class="kpi"><div class="v">'+gbp(fc.mtd)+'</div><div class="l">Billed so far this month</div></div>'+
        '<div class="kpi good"><div class="v">'+gbp(fc.proj)+'</div><div class="l">Projected month total</div></div>'+
        '<div class="kpi'+(fc.delta==null?'':(fc.delta>=0?' good':' bad'))+'"><div class="v">'+(fc.delta==null?'—':(fc.delta>=0?'+':'')+fc.delta+'%')+'</div><div class="l">vs last month ('+gbp(fc.lastM)+')</div></div>'+
        '<div class="kpi"><div class="v">'+esc(fc.busiest)+'</div><div class="l">Busiest day (6 mo)</div></div>'+
      '</div>'+
      '<p class="small muted" style="margin:12px 0 4px">Sessions per day, last 12 months — each column is a week.</p>'+
      yearHeatmapHTML()+
      '<p class="small muted" style="margin:8px 0 0">Projection = billed to date + the larger of (sessions already booked this month) and (your 8-week average daily revenue × days left).</p></div>';
    const series=periodSeries(statGran);
    body.innerHTML=fcCard+
      '<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Revenue &amp; net income</h2>'+

      comboLegend(series)+'<div id="chCombo"></div><p class="small muted center" id="comboHint">Tap a bar to break the period down.</p>'+
      '<div class="small muted mt" style="font-weight:600">Clients seen per '+statGran+'</div><div id="chCli"></div></div>'+
      '<div class="card"><h2>Last 12 months</h2><table><thead><tr><th>Month</th><th class="num">Sess</th><th class="num">Billed</th><th class="num">Recv\'d</th><th class="num">Open</th></tr></thead><tbody>'+mTable+'</tbody></table></div>'+
      '<div class="card"><h2>Outstanding by client</h2>'+(byClient.length?'<table><thead><tr><th>Client</th><th class="num">Sessions</th><th class="num">Amount</th></tr></thead><tbody>'+byClient.map(x=>'<tr><td>'+esc(x.code)+'</td><td class="num">'+x.n+'</td><td class="num">'+gbp(x.amt)+'</td></tr>').join("")+'</tbody></table>':'<p class="muted small">Nothing outstanding 🎉</p>')+'</div>'+

/* ===== Where a figure came from =====
   One breakdown for any date range, used by the tax-year sheet and by each MTD quarter, so the
   two can never tell different stories about the same period. It reports what went IN and, just
   as importantly, what was left OUT and why -- an unpaid session and a second job are excluded
   for completely different reasons, and a therapist checking a number needs to see both. */
function profitBreakdown(from,to){
  const cash=taxBasis()==="cash";
  const group=(arr)=>{const m={};arr.forEach(x=>{const k=x.label;
    const g=m[k]||(m[k]={label:k,amt:0,n:0});g.amt+=x.amt;g.n++;});
    return Object.keys(m).map(k=>m[k]).sort((a,b)=>b.amt-a.amt);};
  const inSpan=d=>d&&d>=from&&d<=to;
  const sessions=[],unpaid=[],roomCosts=[];
  S.sessions.forEach(x=>{
    const dv=derive(x), when=cash?(x.paidDate||null):x.date, sd=parseD(x.date);
    if(cash&&!when){                                   /* billed but not yet received */
      if(inSpan(sd))unpaid.push({label:(x.client||"?"),amt:dv.rate||0});
      return;}
    const w=parseD(when); if(!inSpan(w))return;
    sessions.push({label:(x.client||"?"),amt:dv.rate||0});
    if(dv.roomRate>0)roomCosts.push({label:"Room \u2014 "+(x.location||"?"),amt:dv.roomRate});
  });
  const wide=cash?addYears(from,-2):from, wideTo=cash?addYears(to,2):to;
  const hit=(kind,ref,occ)=>{
    if(!cash)return inSpan(occ.date);
    const paid=chargePaidOn(chargeKey(kind,ref,occ.date));
    return inSpan(paid?parseD(paid):occ.date);};
  const other=[],personal=[];
  (S.otherIncome||[]).forEach(x=>{const mine=!finPersonal(x);
    moneyOccurrences(x,wide,wideTo).forEach(o=>{if(!hit("inc",x._id,o))return;
      (mine?other:personal).push({label:x.desc||"Other income",amt:o.amount});});});
  const boxes={};
  const addCost=(box,label,amt)=>{const b=boxes[box]||(boxes[box]={box:+box,name:SA103[box]||"",total:0,items:[]});
    b.total+=amt;b.items.push({label,amt});};
  roomCosts.forEach(rc=>addCost(21,rc.label,rc.amt));
  (S.expenses||[]).forEach(x=>{const c=catOf("exp",x.cat);
    moneyOccurrences(x,wide,wideTo).forEach(o=>{if(hit("exp",x._id,o))addCost(c.box,x.desc||c.n,o.amount);});});
  roomRentOccurrences(wide,wideTo).forEach(o=>{if(hit("rent",(o.location||"").toLowerCase(),o))
    addCost(21,"Rent \u2014 "+(o.location||"?"),o.amount);});
  uohOccurrences(from,to).forEach(o=>addCost(21,"Use of home",o.amount));
  (S.supervision||[]).forEach(v=>{if(inSpan(v.date?parseD(v.date):null)&&+v.cost)addCost(28,"Supervision"+(v.supervisor?" \u2014 "+v.supervisor:""),+v.cost);});
  (S.peerSupervision||[]).forEach(v=>{if(inSpan(v.date?parseD(v.date):null)&&+v.cost)addCost(28,"Peer supervision",+v.cost);});
  const boxList=Object.keys(boxes).map(k=>boxes[k]).sort((a,b)=>a.box-b.box);
  boxList.forEach(b=>{b.items=group(b.items);});
  const sTot=sessions.reduce((a,x)=>a+x.amt,0), oTot=other.reduce((a,x)=>a+x.amt,0);
  const cTot=boxList.reduce((a,b)=>a+b.total,0);
  return {from,to,cash,
    sessions:{n:sessions.length,total:sTot,byClient:group(sessions)},
    other:{total:oTot,items:group(other)},
    excluded:{unpaid:{n:unpaid.length,total:unpaid.reduce((a,x)=>a+x.amt,0),byClient:group(unpaid)},
              personal:{total:personal.reduce((a,x)=>a+x.amt,0),items:group(personal)}},
    costs:{boxes:boxList,total:cTot},
    income:sTot+oTot, net:sTot+oTot-cTot};
}
/* The shared body of every "where did this come from" sheet. */
function breakdownHTML(bd,opts){
  opts=opts||{};
  const money=x=>gbp(Math.round(x));
  const row=(l,v,cls)=>'<tr><td'+(cls?' class="'+cls+'"':'')+'>'+l+'</td><td class="num">'+v+'</td></tr>';
  let h='<p class="small muted">'+esc(fmtD(bd.from))+' \u2013 '+esc(fmtD(bd.to))+' \u00b7 <b>'+esc(basisLabel())+'</b>. '+
    (bd.cash?"Counted when the money moved.":"Counted when the work was done and costs fell due.")+'</p>';
  h+='<div class="grp-h" style="margin-top:14px">Money in</div><table>'+
    row('Client sessions <span class="muted small">('+bd.sessions.n+')</span>',money(bd.sessions.total))+
    (bd.other.items.length?bd.other.items.map(i=>row('<span class="muted">'+esc(i.label)+(i.n>1?' \u00d7'+i.n:'')+'</span>',money(i.amt))).join(""):"")+
    row('<b>Total income</b>','<b>'+money(bd.income)+'</b>')+'</table>';
  if(bd.sessions.byClient.length&&opts.clients!==false){
    h+='<details class="dz" style="margin-top:6px"><summary>Sessions by client</summary><table>'+
      bd.sessions.byClient.map(c=>row(esc(c.label)+' <span class="muted small">\u00d7'+c.n+'</span>',money(c.amt))).join("")+'</table></details>';
  }
  h+='<div class="grp-h" style="margin-top:16px">Costs</div>';
  if(bd.costs.boxes.length){
    h+='<table>'+bd.costs.boxes.map(b=>
      row('<b>Box '+b.box+'</b> <span class="muted small">'+esc(b.name)+'</span>',money(b.total))).join("")+
      row('<b>Total costs</b>','<b>'+money(bd.costs.total)+'</b>')+'</table>'+
      '<details class="dz" style="margin-top:6px"><summary>Every cost, itemised</summary>'+
      bd.costs.boxes.map(b=>'<div class="grp-h" style="margin-top:8px">Box '+b.box+'</div><table>'+
        b.items.map(i=>row(esc(i.label)+(i.n>1?' <span class="muted small">\u00d7'+i.n+'</span>':''),money(i.amt))).join("")+'</table>').join("")+
      '</details>';
  }else h+='<p class="muted small">No costs in this period.</p>';
  h+='<div class="grp-h" style="margin-top:16px">Net</div><table>'+
    row('<b>Income less costs</b>','<b>'+money(bd.net)+'</b>')+'</table>';
  /* The part people actually need: what was deliberately left out. */
  const ex=[];
  if(bd.excluded.unpaid.n)ex.push(['\u23f3','Sessions not yet paid for',
    bd.excluded.unpaid.n+' session'+(bd.excluded.unpaid.n===1?'':'s')+' worth '+money(bd.excluded.unpaid.total)+
    ' \u2014 on the cash basis these count in the year the money arrives, not the year you saw the client.']);
  if(bd.excluded.personal.total)ex.push(['\u2702\ufe0f','Income marked as separate work',
    money(bd.excluded.personal.total)+' \u2014 a second job or tutoring is a different trade, taxed on its own, so it never touches your practice figures.']);
  ex.push(['\ud83c\udfe0','Anything you have not recorded',
    'The app can only count what is in it. Costs you paid but never logged are not here.']);
  h+='<div class="grp-h" style="margin-top:18px">Not included</div><div class="ovpts">'+
    ex.map(e=>'<div class="ovpt"><span class="pe">'+e[0]+'</span><span class="pt"><b>'+e[1]+'</b><span class="sub">'+e[2]+'</span></span></div>').join("")+'</div>';
  return h;
}
function periodBreakdownSheet(title,from,to,extra){
