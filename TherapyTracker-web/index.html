/* apply the room rows the user built: rename → update → create → prune */
function setupApplyRooms(w){
  if(!w.rooms)return;
  const list=w.rooms.map(r=>({loc:(r.loc||"").trim(),rate:+r.rate||0,due:r.due||"n/a",orig:r.orig,
                              monthly:(r.billing==="monthly")})).filter(r=>r.loc);
  if(!list.length)return;
  S.roomRateHistory=S.roomRateHistory||[]; S.roomRentHistory=S.roomRentHistory||[];
  const fresh=S.sessions.length===0; // nothing logged yet, so cost history can start from the beginning of time
  const find=loc=>S.rooms.find(x=>(x.location||"").toLowerCase()===(loc||"").toLowerCase());
  /* One dated step per history, written only when the amount actually moved. A monthly room's
     amount is its rent and its per-session cost is pinned to 0, so it can't charge both ways. */
  const step=(arr,loc,field,amt,cur)=>{
    if(Math.abs((+cur||0)-amt)<=0.001)return;
    if(fresh)for(let i=arr.length-1;i>=0;i--)if((arr[i].location||"").toLowerCase()===loc.toLowerCase())arr.splice(i,1);
    const rec={_id:uid(),location:loc,effectiveFrom:fresh?"2000-01-01":isoD(today())};
    rec[field]=amt; arr.push(rec);
  };
  list.forEach(r=>{
    const ex=find(r.loc)||(r.orig?find(r.orig):null);
    const perSession=r.monthly?0:r.rate;
    if(ex){
      const before=ex.location||"";
      if(before.toLowerCase()!==r.loc.toLowerCase()){ // rename: carry cost history and existing sessions across
        S.roomRateHistory.forEach(h=>{if((h.location||"").toLowerCase()===before.toLowerCase())h.location=r.loc;});
        S.roomRentHistory.forEach(h=>{if((h.location||"").toLowerCase()===before.toLowerCase())h.location=r.loc;});
        S.sessions.forEach(s=>{if((s.location||"").toLowerCase()===before.toLowerCase())s.location=r.loc;});
        ex.location=r.loc;
      }
      ex.due=r.due; ex.billing=r.monthly?"monthly":"session";
      step(S.roomRateHistory,r.loc,"rate",perSession,effRoomRate(r.loc,isoD(today())));
      step(S.roomRentHistory,r.loc,"amount",r.monthly?r.rate:0,effRoomRent(r.loc,isoD(today())));
      ex.rate=perSession;
    }else{
      S.rooms.push({_id:uid(),location:r.loc,rate:perSession,due:r.due,billing:r.monthly?"monthly":"session"});
      S.roomRateHistory.push({_id:uid(),location:r.loc,effectiveFrom:"2000-01-01",rate:perSession});
      if(r.monthly)S.roomRentHistory.push({_id:uid(),location:r.loc,effectiveFrom:"2000-01-01",amount:r.rate});
    }
  });
  /* drop rooms the user removed — unless a session still points at them — and their now-orphaned cost history */
  const keep=new Set(list.map(r=>r.loc.toLowerCase()));
  const used=new Set(S.sessions.map(s=>(s.location||"").toLowerCase()).filter(Boolean));
  const alive=k=>keep.has(k)||used.has(k);
  S.rooms=S.rooms.filter(r=>alive((r.location||"").toLowerCase()));
  S.roomRateHistory=S.roomRateHistory.filter(h=>alive((h.location||"").toLowerCase()));
  S.roomRentHistory=S.roomRentHistory.filter(h=>alive((h.location||"").toLowerCase()));
}

async function setupSave(w,opts){
  const sg=settings();
  sg.practiceName=(w.name||"").trim()||"Therapy Tracker";
  sg.practiceTagline=(w.tagline||"").trim();
  sg.palette=w.palette;
  sg.features={};FEATURES.forEach(f=>{sg.features[f.k]=featureOn(w,f.k)&&(!f.dep||featureOn(w,f.dep));});
  sg.onboarded=true; sg.onboardedAt=isoD(today());
  /* Never cleared here: a re-run of setup does not un-acknowledge something already agreed to. */
  if(w.taxAck&&!sg.taxAck){sg.taxAck=true;sg.taxAckAt=isoD(today());}
  const rv=sg.reveal=sg.reveal||{mode:"all",shown:[]};
  rv.mode=(w.depth==="simple")?"simple":"all";
  if(!Array.isArray(rv.shown))rv.shown=[];
  sg.setupRuns=(sg.setupRuns||0)+1;
  const rt=sg.retention=sg.retention||{};
  if(+w.cpdTarget>=1)sg.cpdTarget=Math.round(+w.cpdTarget);
  if(+w.rtNotes>=1)rt.notesYears=Math.round(+w.rtNotes);
  if(+w.rtFin>=1)rt.financeYears=Math.round(+w.rtFin);
  if(!Array.isArray(rt.endedStatuses)||!rt.endedStatuses.length)rt.endedStatuses=defaultEndedStatuses(S);
  if(!opts||!opts.skipRooms)setupApplyRooms(w);
  applyPalette(w.palette);setTheme(w.theme);Sfx.set(w.sound);
  /* null clears the key, so "I left it blank" survives a re-run rather than becoming £0 */
  setDefaultRate(w.rate==null||w.rate===""?null:+w.rate);
  setPensionPcm(w.pension==null||w.pension===""?null:+w.pension);
  try{localStorage.setItem("tt_backup_days",String(w.bkDays));localStorage.setItem("tt_backup_acts",String(w.bkActs));}catch(e){}
  await commit("Setup: practice “"+sg.practiceName+"”");
  applySettings();go("home");updateBackupBanner();
}

function startSetup(opts){
  opts=opts||{};
  const sg=settings();
  const rerun=!!opts.rerun;
  /* rooms are only offered on a genuinely fresh start — once sessions exist they belong in Clients › Rooms */
  const withRooms=!rerun||S.sessions.length===0;
  /* "Start simple" is only offered on a genuinely fresh install. Presenting it to someone who
     already has data would be offering to hide tabs they are already using. */
  const fresh=!rerun&&S.sessions.length===0&&S.clients.length===0;
  const w={
    name:(sg.practiceName==="Therapy Tracker")?"":(sg.practiceName||""),
    tagline:sg.practiceTagline||"",
    palette:sg.palette||curPalette(),
    theme:themePref(), sound:Sfx.on,
    features:(function(){
      const f=Object.assign({},sg.features||{});
      /* Peer supervision is asked as "I also attend peer supervision", so it has to arrive
         unticked or the question answers itself. Only for a fresh install: normalize leaves the
         flag absent (= on) and anyone who already has it must keep it. */
      if(fresh&&f.peer==null)f.peer=false;
      return f;
    })(),
    /* A fresh install starts on "simple" — that is the point of the question, and "show me
       everything" is the opt-in. Not read from settings.reveal: normalize defaults that to "all"
       to protect EXISTING installs from ever being hidden, which is the opposite default from
       the one a brand-new user wants. Anyone who is not fresh is never asked. */
    depth:fresh?"simple":"all",
    rate:defaultRate(), pension:pensionPcm(), taxAck:!!sg.taxAck,
    bkDays:backupDaysThreshold(), bkActs:backupActsThreshold(),
    rtNotes:retentionCfg().notesYears, rtFin:retentionCfg().financeYears,
    cpdTarget:cpdTarget(),
    rooms:null, tour:!rerun
  };
  const welcome={emoji:"👋", h:rerun?"Let’s run through setup again":"Welcome to Therapy Tracker",
    sub:rerun?"Your clients, sessions and payments stay exactly as they are — this only touches how the app looks and behaves."
      :"A private, offline record of your practice: sessions, clients, rooms, supervision and money. Takes about two minutes to set up.",
    html:ovPoints([
      ["🔒","Private by design","Everything stays on this device. No account, no cloud, no analytics."],
      ["✈️","Works with no signal","Install it to your Home Screen and it opens like a normal app, offline."],
      ["🧾","Replaces the spreadsheet","Fees, room costs, unpaid sessions and tax estimates all work themselves out."]
    ])};
  const steps=[welcome,stepPractice(w),stepLook(w)];
  if(fresh)steps.push(stepDepth(w));
  steps.push(stepFeatures(w),stepNotes(w));
  if(featureOn(w,"supervision"))steps.push(stepCPD(w));
  if(withRooms)steps.push(stepRooms(w));
  steps.push(stepMoney(w));
  /* Only when the tax side is actually switched on. Anyone who enables it later meets the same
     words on the Tax tab's own gate, so the acknowledgement is never skipped. */
  if(featureOn(w,"tax"))steps.push(stepTax(w));
  steps.push(stepRetention(w));
  if(!rerun)steps.push(stepImport(w));   /* re-runs promise not to touch client data — leave it to Settings */
  steps.push(stepBackup(w),stepDone(w));
  flowStart({
    title:rerun?"Setup (re-run)":"Set up Therapy Tracker",
    steps, doneLabel:"Finish setup",
    onSkip:async()=>{
      if(!confirm("Skip setup?\n\nSensible defaults will be used and you can run this again any time from ⚙ Settings."))return;
      flowClose();await setupSave(w,{skipRooms:true});toast("Setup skipped — defaults applied");
    },
    onDone:async()=>{
      await setupSave(w,{skipRooms:!withRooms});
      if(w.tour!==false)setTimeout(()=>startTour(),260);
      else celebrate({emoji:"🎉",title:"You’re all set",sub:"Tap ＋ to log your first session.",level:"big",sound:"fanfare"});
    }
  });
}

/* ============================================================
   Data removal: anonymise or erase, for chosen clients or everything.
   Every route is gated: a summary of exactly what changes, an offer to back up first, an
   explicit acknowledgement, a typed phrase, and a short delay on the final button.
   ============================================================ */

/* Stable, unique replacement codes that don't collide with any client that is staying. */
function dzPseudonyms(codes){
  const taken=new Set(S.clients.map(c=>(c.code||"").toLowerCase()));
  const map={};let n=1;
  codes.forEach(code=>{
    let p;
    do{p="Client "+String(n++).padStart(3,"0");}while(taken.has(p.toLowerCase()));
    taken.add(p.toLowerCase());
    map[String(code||"").toLowerCase()]=p;
  });
  return map;
}
function dzStats(codes){
  const set=new Set(codes.map(c=>String(c).toLowerCase()));
  const sess=S.sessions.filter(s=>set.has((s.client||"").toLowerCase()));
  const rates=(S.rateHistory||[]).filter(r=>set.has((r.client||"").toLowerCase()));
  const sups=(S.supervision||[]).filter(sv=>Array.isArray(sv.clients)&&sv.clients.some(c=>set.has(String(c||"").toLowerCase())));
  return {clients:codes.length,sessions:sess.length,rates:rates.length,sups:sups.length};
}
/* Anonymise: identity goes, the financial and clinical shape stays, so tax figures,
   session counts and attendance history all still add up. */
async function anonymiseClients(codes){
  const set=new Set(codes.map(c=>String(c).toLowerCase()));
  const map=dzPseudonyms(codes);
  S.clients.forEach(c=>{const lc=(c.code||"").toLowerCase();if(!set.has(lc))return;
    c.code=map[lc];c.notes="";});
  S.sessions.forEach(s=>{const lc=(s.client||"").toLowerCase();if(!set.has(lc))return;
    s.lateCancel=isLateCancel(s);                                 // capture before the notes text goes
    s.client=map[lc];
    s.notes=(s.notes&&String(s.notes).trim())?"Y":"";             // keeps the session "complete", drops the content
    s.invoice="";s.receipt="";});
  (S.rateHistory||[]).forEach(r=>{const lc=(r.client||"").toLowerCase();if(set.has(lc))r.client=map[lc];});
  (S.supervision||[]).forEach(sv=>{if(!Array.isArray(sv.clients))return;
    sv.clients=sv.clients.map(c=>{const lc=String(c||"").toLowerCase();return set.has(lc)?map[lc]:c;});});
  return commit("Anonymised "+codes.length+" client"+(codes.length===1?"":"s"));
}
/* Erase selected: the clients, their sessions and their fee history go. Supervision entries
   are kept — they are the therapist's own CPD and tax record — but the names are removed. */
async function eraseClients(codes){
  const set=new Set(codes.map(c=>String(c).toLowerCase()));
  const before=S.sessions.length;
  S.sessions=S.sessions.filter(s=>!set.has((s.client||"").toLowerCase()));
  S.clients=S.clients.filter(c=>!set.has((c.code||"").toLowerCase()));
  S.rateHistory=(S.rateHistory||[]).filter(r=>!set.has((r.client||"").toLowerCase()));
  (S.supervision||[]).forEach(sv=>{if(Array.isArray(sv.clients))
    sv.clients=sv.clients.filter(c=>!set.has(String(c||"").toLowerCase()));});
  return commit("Erased "+codes.length+" client"+(codes.length===1?"":"s")+" and "+(before-S.sessions.length)+" session(s)");
}
/* Erase everything: a factory reset of this device. Object stores are cleared first — that
   always succeeds — before attempting to drop the database, which another open tab can defer. */
async function eraseEverything(){
  try{if(_db){
    await pr(tx("state","readwrite").clear());
    await pr(tx("audit","readwrite").clear());
    await pr(tx("snapshots","readwrite").clear());
  }}catch(e){console.error("store clear failed",e);}
  try{if(_db){_db.close();_db=null;}
    await new Promise(res=>{const rq=indexedDB.deleteDatabase(DBN);rq.onsuccess=rq.onerror=rq.onblocked=()=>res();});
  }catch(e){console.error("db delete failed",e);}
  try{Object.keys(localStorage).filter(k=>k.indexOf("tt_")===0).forEach(k=>localStorage.removeItem(k));}catch(e){}
  // the cached app files hold no client data, so they are left alone — the app still opens offline
  location.reload();
}

/* The confirmation ladder, shared by every destructive route. */
function dzConfirm(o){
  const body=el('<div></div>');
  const bullets=arr=>(arr&&arr.length)?'<div class="acc-work">'+arr.map(x=>'<div>• '+x+'</div>').join("")+'</div>':"";
  return sheetPromise(o.title,body,(b,fin)=>{
    function step1(){
      b.innerHTML='<div class="vmsg err">⚠️ '+o.lead+'</div>'+
        '<p class="small" style="margin:12px 0 4px"><b>What this changes:</b></p>'+bullets(o.destroys)+
        (o.keeps&&o.keeps.length?'<p class="small" style="margin:14px 0 4px"><b>What it leaves alone:</b></p>'+bullets(o.keeps):"")+
        '<div class="vmsg '+(o.undoable?"warn":"err")+'" style="margin-top:14px">'+
          (o.undoable
            ?"A restore point is saved first, so <b>↩︎ Undo</b> in Settings can bring this back — until the restore points roll over."
            :"This <b>cannot be undone</b>. Restore points, undo history and the audit log go too.")+'</div>'+
        '<button class="btn sec full mt" id="dzExp">⤓ Export a backup first</button>'+
        '<label class="dzchk"><input type="checkbox" id="dzAck"> I understand what this does, and I have a backup if I ever need this data again.</label>'+
        '<button class="btn danger full mt" id="dzNext" disabled>Continue…</button>'+
        '<button class="btn ghost full mt" id="dzNo">Cancel</button>';
      const ack=b.querySelector("#dzAck"),nx=b.querySelector("#dzNext");
      nx.style.opacity=".5";
      ack.onchange=()=>{nx.disabled=!ack.checked;nx.style.opacity=ack.checked?"1":".5";};
      b.querySelector("#dzExp").onclick=()=>{try{exportJSON();}catch(e){toast("Export failed: "+e.message);}};
      b.querySelector("#dzNo").onclick=()=>fin(false);
      nx.onclick=()=>{if(!nx.disabled)step2();};
    }
    function step2(){
      b.innerHTML='<div class="vmsg err">Last chance — '+esc(o.summary)+'</div>'+
        '<label>Type <b>'+esc(o.phrase)+'</b> below to confirm</label>'+
        '<input id="dzIn" placeholder="'+esc(o.phrase)+'" autocapitalize="characters" autocomplete="off" spellcheck="false">'+
        '<button class="btn danger full mt" id="dzGo" disabled>'+esc(o.verb)+'</button>'+
        '<button class="btn ghost full mt" id="dzBack">Cancel — keep my data</button>';
      const inp=b.querySelector("#dzIn"),g=b.querySelector("#dzGo");
      let timer=null;
      g.style.opacity=".5";
      inp.oninput=()=>{
        clearInterval(timer);
        if(inp.value.trim().toUpperCase()!==o.phrase){g.disabled=true;g.style.opacity=".5";g.textContent=o.verb;return;}
        let n=3;                                  // a beat before the button arms, against muscle memory
        g.disabled=true;g.style.opacity=".7";g.textContent=o.verb+" in "+n+"…";
        timer=setInterval(()=>{n--;
          if(n>0){g.textContent=o.verb+" in "+n+"…";return;}
          clearInterval(timer);g.disabled=false;g.style.opacity="1";g.textContent=o.verb;},1000);
      };
      b.querySelector("#dzBack").onclick=()=>{clearInterval(timer);fin(false);};
      g.onclick=()=>{if(g.disabled)return;clearInterval(timer);fin(true);};
      setTimeout(()=>inp.focus(),120);
    }
    step1();
  });
}

/* ===== Records retention review (flags only, never deletes) =====
   N years after a client's last logged session, once their status counts as "ended". Notes and
   financial records run on separate clocks because they're kept for different reasons — the
   complaint window versus the insurer/HMRC one. Crossing a threshold means the therapist may
   now act; the app only says so, and hands them to the existing removal routes. */
function retentionCfg(){
  const r=(settings().retention)||{};
  return {notesYears:(+r.notesYears>0)?+r.notesYears:6,
          financeYears:(+r.financeYears>0)?+r.financeYears:6,
          endedStatuses:(Array.isArray(r.endedStatuses)&&r.endedStatuses.length)?r.endedStatuses:defaultEndedStatuses(S)};
}
function retentionRows(){
  const cfg=retentionCfg(), t=today();
  const ended=new Set(cfg.endedStatuses.map(s=>String(s).toLowerCase()));
  const last={},count={};
  S.sessions.forEach(s=>{const k=(s.client||"").toLowerCase();const d=parseD(s.date);
    if(!k)return; count[k]=(count[k]||0)+1;
    if(!d||d>t)return; if(!last[k]||d>last[k])last[k]=d;});
  return S.clients.filter(c=>ended.has(String(c.status||"").toLowerCase())).map(c=>{
    const k=(c.code||"").toLowerCase(), ld=last[k];
    if(!ld)return null;                       /* nothing logged — no clock to count from */
    const nd=addYears(ld,cfg.notesYears), fd=addYears(ld,cfg.financeYears);
    return {code:c.code,status:c.status||"",last:ld,notesDue:nd,finDue:fd,
            notesOver:nd<=t,finOver:fd<=t,sessions:count[k]||0};
  }).filter(r=>r&&(r.notesOver||r.finOver)).sort((a,b)=>a.last-b.last);
}
function retentionCardHTML(){
  const cfg=retentionCfg(), rows=retentionRows();
  const statuses=[...new Set(S.clients.map(c=>c.status).filter(Boolean)
    .concat(S.clientCategories.map(x=>x.status).filter(Boolean)).concat(cfg.endedStatuses))];
  const on=new Set(cfg.endedStatuses.map(s=>String(s).toLowerCase()));
  const rowHTML=r=>'<div class="list-item"><div class="li-main">'+
      '<div class="li-title">'+esc(r.code)+' '+
        (r.notesOver?'<span class="chip n">notes</span> ':'')+

      '<div class="li-right" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">'+
        (r.notesOver?'<button class="btn sm sec" data-rtanon="'+esc(r.code)+'">Anonymise</button>':'')+
        (r.finOver?'<button class="btn sm ghost" data-rters="'+esc(r.code)+'" style="color:var(--bad)">Erase</button>':'')+
      '</div></div>';
  return '<div class="card"><h2>Records retention</h2>'+
    '<p class="small muted">How long you keep records after a client finishes. Nothing is ever deleted for you — when a client passes one of these dates they appear below, and you decide.</p>'+
    '<div class="field2">'+
      '<div><label>Keep clinical notes for (years)</label><input type="number" min="1" max="50" step="1" id="rtNotes" value="'+esc(cfg.notesYears)+'"></div>'+
      '<div><label>Keep financial records for (years)</label><input type="number" min="1" max="50" step="1" id="rtFin" value="'+esc(cfg.financeYears)+'"></div>'+
    '</div>'+
    '<p class="small muted">Six years each is the common default: the BACP complaint window is around three years, and insurers often ask for six. Your own insurer or supervisor may say otherwise — this is your call, not the app’s.</p>'+
    '<details class="dz" style="margin-top:10px"><summary>Which statuses count as finished? ('+cfg.endedStatuses.length+')</summary>'+
      '<p class="small muted" style="margin-top:6px">The clock starts at the last session of clients with these statuses. Paused clients are usually left out — they may come back.</p>'+
      '<div class="dzpick">'+statuses.map(s=>'<label><input type="checkbox" class="rtst" value="'+esc(s)+'"'+(on.has(String(s).toLowerCase())?" checked":"")+'><span>'+esc(s)+'</span></label>').join("")+'</div>'+
    '</details>'+
    (rows.length
      ? '<div class="vmsg warn" style="margin-top:12px">'+rows.length+' client'+(rows.length===1?' has':'s have')+' passed a retention date.</div>'+
        '<div style="padding:0 2px">'+rows.map(rowHTML).join("")+'</div>'+
        '<p class="small muted" style="margin-top:8px"><b>Anonymise</b> clears their notes and identity but keeps every date and fee, so your tax figures don’t move. <b>Erase</b> removes the client and their sessions entirely — past income from them disappears from your reports.</p>'
      : '<div class="vmsg ok" style="margin-top:12px">✓ Nothing is past its retention date.</div>')+
    '</div>';
}
function wireRetention(v){
  const n=v.querySelector("#rtNotes"), f=v.querySelector("#rtFin");
  if(!n||!f)return;
  const save=async()=>{
    const rt=settings().retention=settings().retention||{};
    const nv=Math.max(1,Math.min(50,Math.round(+n.value||0))), fv=Math.max(1,Math.min(50,Math.round(+f.value||0)));
    n.value=nv; f.value=fv;
    if(rt.notesYears===nv&&rt.financeYears===fv)return;
    rt.notesYears=nv; rt.financeYears=fv;
    await commit("Retention: notes "+nv+" yrs, records "+fv+" yrs");
    go("settings",{keepScroll:true});
  };
  n.onchange=save; f.onchange=save;
  v.querySelectorAll(".rtst").forEach(cb=>cb.onchange=async()=>{
    const picked=Array.prototype.slice.call(v.querySelectorAll(".rtst")).filter(x=>x.checked).map(x=>x.value);
    if(!picked.length){toast("Pick at least one finished status");cb.checked=true;return;}
    const rt=settings().retention=settings().retention||{};
    rt.endedStatuses=picked;
    await commit("Retention: finished statuses = "+picked.join(", "));
    go("settings",{keepScroll:true});});
  v.querySelectorAll("[data-rtanon]").forEach(b=>b.onclick=()=>dzRunAnonymise([b.dataset.rtanon]));
  v.querySelectorAll("[data-rters]").forEach(b=>b.onclick=()=>dzRunErase([b.dataset.rters]));
}

function dzPickClients(o){
  const body=el('<div></div>');
  const byCode={};S.sessions.forEach(s=>{const k=(s.client||"").toLowerCase();if(k)byCode[k]=(byCode[k]||0)+1;});
  const list=S.clients.slice().sort((a,b)=>String(a.code||"").localeCompare(String(b.code||"")));
  const row=c=>{const lc=(c.code||"").toLowerCase(),n=byCode[lc]||0;
    return '<label><input type="checkbox" class="dzc" value="'+esc(c.code)+'"><span>'+esc(c.code)+'</span>'+
      '<span class="dzsub">'+n+' session'+(n===1?'':'s')+(c.status?' · '+esc(c.status):'')+'</span></label>';};
  body.innerHTML='<p class="small muted">'+esc(o.msg)+'</p>'+
    '<div class="row mt" style="gap:8px"><button class="btn sm sec" id="dzAll">Select all</button>'+
      '<button class="btn sm ghost" id="dzNone">Clear</button></div>'+
    (list.length?'<div class="dzpick">'+list.map(row).join("")+'</div>'
                :'<div class="vmsg warn" style="margin-top:12px">There are no clients to choose from.</div>')+
    '<button class="btn danger full mt" id="dzOk" disabled>Continue</button>'+
    '<button class="btn ghost full mt" id="dzCancel">Cancel</button>';
  return sheetPromise(o.title,body,(b,fin)=>{
    const boxes=Array.prototype.slice.call(b.querySelectorAll(".dzc")),ok=b.querySelector("#dzOk");
    const upd=()=>{const n=boxes.filter(x=>x.checked).length;
      ok.textContent=n?("Continue with "+n+" client"+(n===1?"":"s")):"Continue";
      ok.disabled=!n;ok.style.opacity=n?"1":".5";};
    boxes.forEach(x=>x.onchange=upd);
    b.querySelector("#dzAll").onclick=()=>{boxes.forEach(x=>x.checked=true);upd();};
    b.querySelector("#dzNone").onclick=()=>{boxes.forEach(x=>x.checked=false);upd();};
    ok.onclick=()=>{if(!ok.disabled)fin(boxes.filter(x=>x.checked).map(x=>x.value));};
    b.querySelector("#dzCancel").onclick=()=>fin(null);
    upd();
  });
}

/* Nothing should fail silently. These catch what escapes the per-view boundary in go(). */
let _loggedGlobalErr=false;
function reportGlobalError(what,err){
  console.error(what,err);
  if(_loggedGlobalErr)return;                       // one nudge per session; the console keeps the rest
  _loggedGlobalErr=true;
  setTimeout(()=>{try{toast("Something went wrong in the background — if anything looks wrong, export a backup and reload.");}catch(_){}},400);
}
window.addEventListener("error",e=>reportGlobalError("Uncaught error:",e.error||e.message));
window.addEventListener("unhandledrejection",e=>reportGlobalError("Unhandled promise rejection:",e.reason));

(async function(){
  try{await openDB();await loadState();}
  catch(e){ // fallback to localStorage
    console.error("Database unavailable, falling back to localStorage",e);
    try{const ls=localStorage.getItem("tt_state");S=ls?JSON.parse(ls):clone(window.SEED);}catch(_){S=clone(window.SEED);}
    if(!S.sessions)S=clone(window.SEED);
    try{normalize(S);}catch(_){}
    noteSaveFailure(new Error("this browser would not open the app's database"));
  }
  initBackupTracking();
  const bk=document.getElementById("bkNow");if(bk)bk.onclick=exportJSON;
  const sx=document.getElementById("svExport");if(sx)sx.onclick=exportJSON;
  applySettings();
  go("home");
  requestPersistence(); // ask the browser not to evict us; the answer is shown in Settings
  /* One overlay, one queue. The beta gate, first-run setup and What's new all drive the same
     #ovRoot, so they're chained rather than fired together — otherwise the last one to start
     would silently replace whatever was already on screen. */
  const afterGates=()=>{
    if(!settings().onboarded){startSetup();markWhatsNewSeen();return;} // new here: setup and the tour cover all of it
    if(whatsNewDue())showWhatsNew();
  };
  if(!settings().betaAck)setTimeout(()=>showBetaGate(afterGates),120);
  else setTimeout(afterGates,120);
})();
