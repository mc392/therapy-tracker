d.setAttribute('data-palette',localStorage.getItem('tt_palette')||'sage');
var n=localStorage.getItem('tt_practice');if(n)d.style.setProperty('--appname',JSON.stringify('⬡ '+n));
}catch(e){d.setAttribute('data-theme','light');d.setAttribute('data-palette','sage');}})();</script>
<style>
/* ====== Design tokens ======
   Every palette supplies the same set, so the components below never name a colour directly.
   --g1/--g2 are the gradient pair; --brand is the flat version for icons and links; --brand-dark
   is the one that has to stay READABLE as text on a card, which is why it is not just a darker
   --brand. --glass/--hair build the frosted surfaces. */
:root{
  color-scheme:light;
  --bg:#F6F8FA; --card:#FFFFFF; --soft:#EEF3F1; --ink:#12211D; --muted:#5F7A72; --line:#E4EDE9;
  --brand:#0C9683; --brand-dark:#07695C; --g1:#5FD9BE; --g2:#17A891;
  --accent:#8B7BF0; --accent-ink:#5B49C7;
  --good:#0C7C46; --bad:#C42A2F; --warn:#96650A; --hi:#06B6D4; --hi-ink:#0A5F73;
  --glass:64%; --hair:rgba(255,255,255,.7); --on-bright:#0D1A17; --ring:rgba(15,23,42,.06);
  --shadow:0 1px 2px rgba(16,40,34,.04),0 8px 24px -8px rgba(16,40,34,.16);
  --shadow-lg:0 2px 6px rgba(16,40,34,.06),0 20px 48px -12px rgba(16,40,34,.28);
  --radius:20px; --blur:blur(20px) saturate(1.8);

  --gs1:#0A8172; --gs2:#076458;}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1512; --card:#16211E; --soft:#1E2C28; --ink:#E9F2EE; --muted:#93A8A1; --line:#243430;
  --brand:#2DD4B4; --brand-dark:#7FF0DA; --g1:#5FE0C6; --g2:#22C9C0;
  --accent:#A99BF7; --accent-ink:#C7BDFB;
  --good:#3DD68C; --bad:#FF6369; --warn:#F5B544; --hi:#22D3EE; --hi-ink:#9DECFB;
  --glass:56%; --hair:rgba(255,255,255,.13); --on-bright:#0D1A17; --ring:rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 24px 56px -14px rgba(0,0,0,.75);

  --gs1:#0A8172; --gs2:#076458;}
/* ====== Colour schemes ======
   Chosen in Setup / Settings, applied as data-palette on <html>. "sage" is the built-in default
   above, so it needs no block here. Each other scheme overrides the light values, then the
   [data-theme="dark"] pair (higher specificity) overrides them again for dark. */
html[data-palette="ocean"]{
  --bg:#F5F8FC; --card:#FFFFFF; --soft:#EAF1F8; --ink:#101C2B; --muted:#5D7387; --line:#E1EAF3;
  --brand:#1E7FE0; --brand-dark:#14508F; --g1:#5AC8FA; --g2:#3B82F6;
  --accent:#7C8CF8; --accent-ink:#4855C4; --hi:#0EA5E9; --hi-ink:#0A5578;

  --gs1:#1B6FD0; --gs2:#14508F;
  --good:#0C7C46; --bad:#C42A2F; --warn:#96650A;}
html[data-palette="ocean"][data-theme="dark"]{
  --bg:#0A1220; --card:#141F2E; --soft:#1C2A3C; --ink:#E6EFF8; --muted:#8CA3B8; --line:#243449;
  --brand:#4DA6FF; --brand-dark:#9FD0FF; --g1:#67D3FF; --g2:#5B9BFF;
  --accent:#9AA6FB; --accent-ink:#C0C7FD; --hi:#38BDF8; --hi-ink:#AEE4FC;

  --gs1:#1B6FD0; --gs2:#14508F;
  --good:#3DD68C; --bad:#FF6369; --warn:#F5B544;}
html[data-palette="plum"]{
  --bg:#FAF6FC; --card:#FFFFFF; --soft:#F3EBF7; --ink:#1F1526; --muted:#75647F; --line:#EDE3F2;
  --brand:#A93FD0; --brand-dark:#732A8E; --g1:#F08BEA; --g2:#A855F7;
  --accent:#EC5F8B; --accent-ink:#B03257; --hi:#D946EF; --hi-ink:#83239A;

  --gs1:#9333EA; --gs2:#7226B8;
  --good:#0C7C46; --bad:#C42A2F; --warn:#96650A;}
html[data-palette="plum"][data-theme="dark"]{
  --bg:#150D1B; --card:#211729; --soft:#2C2036; --ink:#F0E7F5; --muted:#AC9AB6; --line:#352842;
  --brand:#D07BF0; --brand-dark:#EBB9FA; --g1:#F5A7EF; --g2:#C084FC;
  --accent:#F782A6; --accent-ink:#FBBACF; --hi:#E879F9; --hi-ink:#F6C7FC;

  --gs1:#9333EA; --gs2:#7226B8;
  --good:#3DD68C; --bad:#FF6369; --warn:#F5B544;}
html[data-palette="clay"]{
  --bg:#FDF7F3; --card:#FFFFFF; --soft:#F7EDE5; --ink:#241713; --muted:#7E6A5F; --line:#F0E3D9;
  --brand:#E0632C; --brand-dark:#96380F; --g1:#FBBF24; --g2:#F4703A;
  --accent:#C9873F; --accent-ink:#8A5618; --hi:#EA9200; --hi-ink:#8A5300;

  --gs1:#B84617; --gs2:#8F340E;
  --good:#0C7C46; --bad:#C42A2F; --warn:#96650A;}
html[data-palette="clay"][data-theme="dark"]{
  --bg:#1A110C; --card:#261A14; --soft:#33241B; --ink:#F6EAE1; --muted:#B79E8E; --line:#3E2C21;
  --brand:#FF8F5E; --brand-dark:#FFC4A3; --g1:#FCD34D; --g2:#FB8C4E;
  --accent:#E0AC6B; --accent-ink:#F2CE9C; --hi:#FBBF24; --hi-ink:#FDE3A0;

  --gs1:#B84617; --gs2:#8F340E;
  --good:#3DD68C; --bad:#FF6369; --warn:#F5B544;}
html[data-palette="indigo"]{
  --bg:#F7F7FD; --card:#FFFFFF; --soft:#EEEEF9; --ink:#161628; --muted:#65658A; --line:#E6E6F5;
  --brand:#5B5BE0; --brand-dark:#35358F; --g1:#A5B4FF; --g2:#818CF8;
  --accent:#9F6BE8; --accent-ink:#6A34A8; --hi:#6366F1; --hi-ink:#3A3CA8;

  --gs1:#4F46E5; --gs2:#3A32B0;
  --good:#0C7C46; --bad:#C42A2F; --warn:#96650A;}
html[data-palette="indigo"][data-theme="dark"]{
  --bg:#0D0D18; --card:#171726; --soft:#212134; --ink:#EAEAF7; --muted:#9E9EC0; --line:#2A2A42;
  --brand:#8B8BF5; --brand-dark:#BFBFFC; --g1:#A8B6FF; --g2:#8687F7;
  --accent:#BC93F5; --accent-ink:#D9C0FB; --hi:#818CF8; --hi-ink:#C3CAFB;

  --gs1:#4F46E5; --gs2:#3A32B0;
  --good:#3DD68C; --bad:#FF6369; --warn:#F5B544;}
html[data-palette="slate"]{
  --bg:#F6F8F9; --card:#FFFFFF; --soft:#EDF1F3; --ink:#111A1D; --muted:#5E6E74; --line:#E3EAEC;
  --brand:#0D8FA8; --brand-dark:#095A6B; --g1:#5EE7E0; --g2:#22A2C0;
  --accent:#7A8B93; --accent-ink:#4C5A61; --hi:#06AEC4; --hi-ink:#075C69;

  --gs1:#0B7E96; --gs2:#075B6C;
  --good:#0C7C46; --bad:#C42A2F; --warn:#96650A;}
html[data-palette="slate"][data-theme="dark"]{
  --bg:#0B1315; --card:#151F22; --soft:#1D292D; --ink:#E7EFF1; --muted:#93A5AB; --line:#243236;
  --brand:#3ECBDF; --brand-dark:#9BEBF4; --g1:#6FEDE6; --g2:#3BB8D4;
  --accent:#A0B2B9; --accent-ink:#C6D3D8; --hi:#22D3EE; --hi-ink:#A5EDF8;

  --gs1:#0B7E96; --gs2:#075B6C;
  --good:#3DD68C; --bad:#FF6369; --warn:#F5B544;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);transition:background .25s,color .25s}
/* The colour wash the frosted surfaces sit on -- without something behind them, "glass" just
   looks grey. Fixed so it never repaints while scrolling. */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(52vmax 52vmax at 6% -8%, color-mix(in srgb,var(--g1) 72%,transparent), transparent 60%),
    radial-gradient(48vmax 48vmax at 106% 2%, color-mix(in srgb,var(--g2) 62%,transparent), transparent 62%),
    radial-gradient(58vmax 44vmax at 30% 108%, color-mix(in srgb,var(--g1) 45%,transparent), transparent 66%);}
@media (prefers-reduced-motion:no-preference){
  .card,.kpi,.btn,.seg button,nav.tabs button{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background .18s,color .18s}
}
h1,h2,h3{margin:0 0 .4em}
a{color:var(--brand)}
.app{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:30;color:#fff;
  background:linear-gradient(135deg,var(--gs1),var(--gs2));
  padding:calc(env(safe-area-inset-top) + 14px) 18px 15px;display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px -14px color-mix(in srgb,var(--gs2) 85%,transparent)}
header.top::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 60%)}
header.top>*{position:relative;z-index:1}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;letter-spacing:.01em}
header.top .ty{font-size:12px;background:rgba(0,0,0,.18);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:4px 10px;border-radius:20px;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.themebtn{background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:0;color:#fff;width:34px;height:34px;border-radius:12px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.themebtn:active{transform:scale(.94)}
main{flex:1;padding:18px 16px 96px}
.bkbar{display:none;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--warn) 16%,var(--card));border-bottom:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  color:var(--ink);padding:9px 16px;font-size:13px}
.bkbar.show{display:flex}
.bkbar.err{background:color-mix(in srgb,var(--bad) 17%,var(--card));border-bottom-color:color-mix(in srgb,var(--bad) 52%,transparent)}
.bkbar.err .btn{background:var(--bad)}
.dzchk{display:flex;align-items:flex-start;gap:9px;margin:16px 0 0;font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.4;cursor:pointer}
.dzchk input{width:auto;flex:0 0 auto;margin-top:2px}
details.dz{margin-top:10px}
details.dz>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);padding:8px 0;list-style:none}
details.dz>summary::-webkit-details-marker{display:none}
details.dz>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.dz[open]>summary::before{content:"▾ "}
.dzpick{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-top:8px}
.dzpick label{display:flex;align-items:center;gap:10px;margin:0;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink);font-weight:600;cursor:pointer}
.dzpick label:last-child{border-bottom:0}
.dzpick input{width:auto;flex:0 0 auto}
.dzpick .dzsub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;text-align:right}
.bkbar .bkmsg{flex:1;min-width:170px;line-height:1.4}
.bkbar .bkdetail{color:var(--muted)}
.bkbar .btn{white-space:nowrap}
.view{display:none}
.view.active{display:block;animation:f .2s ease}
@keyframes f{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:color-mix(in srgb,var(--card) var(--glass),transparent);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--hair);border-radius:var(--radius);padding:18px;margin:0 0 14px;
  box-shadow:var(--shadow),inset 0 1px 0 var(--hair)}
.card h2{font-size:13.5px;color:var(--brand-dark);letter-spacing:.045em;text-transform:uppercase;font-weight:800}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-dark);margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.grp-h:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:color-mix(in srgb,var(--card) var(--glass),transparent);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--hair);border-radius:calc(var(--radius) - 4px);padding:15px;
  box-shadow:var(--shadow),inset 0 1px 0 var(--hair)}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--brand-dark);
  background:linear-gradient(135deg,var(--brand-dark),var(--brand));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
/* a status colour has to win over the gradient, or good/bad stop reading as good/bad */
.kpi.good .v,.kpi.bad .v{background:none;-webkit-text-fill-color:currentColor}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}
.kpi.clk{cursor:pointer} .kpi.clk:active{transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:650;
  background:linear-gradient(135deg,var(--gs1),var(--gs2));color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  box-shadow:0 1px 2px var(--ring),0 8px 18px -10px color-mix(in srgb,var(--gs2) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.97)}
.btn.sec{background:color-mix(in srgb,var(--card) 72%,transparent);color:var(--brand-dark);
  border:1px solid var(--hair);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 2px var(--ring)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 34%,transparent);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 78%,#fff),var(--bad));
  box-shadow:0 8px 18px -10px color-mix(in srgb,var(--bad) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;
  width:60px;height:60px;border-radius:50%;color:#fff;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:0;
  background:linear-gradient(135deg,var(--gs1),var(--gs2));
  box-shadow:0 10px 26px -6px color-mix(in srgb,var(--gs2) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.fab svg{width:26px;height:26px;display:block;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:scale(.95)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:13px;
  background:color-mix(in srgb,var(--card) 82%,transparent);color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-block;padding:3.5px 11px;border-radius:20px;font-size:12px;font-weight:650}
.chip.y{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.chip.n{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.chip.na{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.chip.f{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent-ink)}
.chip.s{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand-dark)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.list-item{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item{border-radius:10px}
.list-item:active{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;font-size:15px}
.li-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-right{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .mt{margin-top:12px} .mb{margin-bottom:12px}
.center{text-align:center}
.search{position:relative;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;border-radius:14px;padding:4px;gap:3px;overflow:auto;
  background:color-mix(in srgb,var(--soft) 72%,transparent);border:1px solid var(--hair);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--card);color:var(--brand-dark);box-shadow:0 1px 2px var(--ring),0 2px 8px -4px var(--ring)}
/* ===== use-of-home year strip =====
   Full-bleed inside its card and sticky under the header (JS sets `top` from the header's real
   height), so the year being edited stays on screen while the cost fields scroll past. */
.uohbar{position:sticky;z-index:3;display:flex;align-items:center;gap:6px;
  margin:0 -18px 6px;padding:8px 18px;
  background:color-mix(in srgb,var(--card) 94%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--hair)}
.uohbar .uohnav{flex:none;border:1px solid var(--hair);background:var(--card);color:var(--brand-dark);
  width:32px;height:32px;border-radius:10px;font-size:17px;line-height:1;cursor:pointer;font-weight:700;font-family:inherit}
.uohbar .uohnav:disabled{opacity:.32;cursor:default}
.uohyrs{display:flex;gap:6px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.uohyrs::-webkit-scrollbar{display:none}
.uohyr{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  border:1px solid var(--hair);background:transparent;border-radius:11px;padding:6px 11px;cursor:pointer;font-family:inherit}
.uohyr b{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.uohyr .st{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.uohyr.on{background:var(--card);border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 20%,transparent)}
.uohyr.on b{color:var(--brand-dark)}
.uohyr .st.set{color:var(--good)}
.uohyr .st.carried{color:var(--warn)}
.uohyr .st.none,.uohyr .st.empty{color:var(--muted)}
.uohyr .st.filed{color:var(--muted)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:35;
  background:color-mix(in srgb,var(--card) 62%,transparent);
  -webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);
  border-top:1px solid var(--hair);
  display:flex;justify-content:space-around;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));max-width:780px;margin:0 auto}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;
  flex:1;color:var(--muted);padding:7px 2px 6px;cursor:pointer;font-weight:600;border-radius:16px;transition:color .2s,background .2s}
nav.tabs button>span:last-child{font-size:10px;line-height:1.1;text-align:center;overflow-wrap:anywhere}
nav.tabs button .ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
nav.tabs button .ic svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:#fff;
  background:linear-gradient(135deg,var(--gs1),var(--gs2));
  box-shadow:0 6px 16px -8px color-mix(in srgb,var(--gs2) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,18,16,.42);display:none;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.open{display:flex}
/* The sheet surface is SOLID, and the sticky header is the same solid colour, so the two cannot
   read as separate panels. They used to be two translucent layers — 88% here and another 82% on
   the header — which composite to about 98% and drew a pale bar across the top of every form.
   A sticky header inside a translucent container can never match it: its own tint stacks on the
   one already painted behind it, whatever value you pick. The frosted look stays where it is
   actually seen, on `.sheet`'s blurred scrim over the page behind. */
.sheet-inner{background:var(--bg);
  width:100%;max-width:780px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;
  border-top:1px solid var(--hair);box-shadow:var(--shadow-lg);
  padding:0 18px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
/* Full-bleed, and the sheet's own top padding lives here instead of on .sheet-inner. A sticky
   element measures `top` from the padding box, so any padding-top on the container leaves a
   strip above the header that scrolling content shows through. Side margins are negative so the
   bar reaches both edges. */
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;
  margin:0 -18px;padding:20px 18px 12px;z-index:2}
.sheet-head h2{flex:1;margin:0;font-size:17px;text-transform:none;color:var(--ink)}
.sheet-inner h3{font-size:14px;margin:0 0 4px;color:var(--brand-dark)}
.taxlink{color:var(--brand);font-weight:700;cursor:pointer;border-bottom:1px dashed var(--brand)}
.x{font-size:22px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 8px}
.suggest{font-size:11px;color:var(--accent-ink);font-weight:700;margin-left:6px}
.hint{background:color-mix(in srgb,var(--brand) 10%,transparent);border:1px solid color-mix(in srgb,var(--brand) 24%,transparent);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--brand-dark);margin:10px 0}
.vbanner{margin:10px 0 2px}
.vmsg{border-radius:14px;padding:10px 13px;font-size:13px;margin-bottom:8px;font-weight:650;line-height:1.35}
.vmsg.err{background:color-mix(in srgb,var(--bad) 14%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.vmsg.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}
.vmsg.ok{background:color-mix(in srgb,var(--good) 14%,var(--card));border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--good)}
.prev{font-size:11px;color:var(--muted);margin-top:3px}
.acc-work{margin-top:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:12.5px;line-height:1.75;color:var(--ink)}
.acc-work div{margin:1px 0} .acc-work b{font-weight:700}
/* Settings groups: collapsed sections so the page opens as a short menu, not a wall of cards */
.sgrp{background:color-mix(in srgb,var(--card) var(--glass),transparent);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--hair);border-radius:var(--radius);margin:0 0 10px;overflow:hidden;
  box-shadow:var(--shadow),inset 0 1px 0 var(--hair)}
.sgrp>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:2px;position:relative;user-select:none}
.sgrp>summary::-webkit-details-marker{display:none}
.sgrp>summary::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-50%) rotate(90deg);
  font-size:20px;color:var(--muted);transition:transform .18s ease}
.sgrp[open]>summary::after{transform:translateY(-50%) rotate(-90deg)}
.sgrp>summary:hover{background:color-mix(in srgb,var(--brand) 6%,transparent)}
.sgrp .sgt{font-weight:700;font-size:15.5px;padding-right:24px}
.sgrp .sgs{font-size:12.5px;color:var(--muted);padding-right:24px}
.sgrp[open]>summary{border-bottom:1px solid var(--line)}
.sgb{padding:2px 10px 10px}
.sgb>.card{border:1px solid var(--hair);border-radius:14px;margin:10px 0 0;background:color-mix(in srgb,var(--bg) 45%,transparent);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.svgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px -4px 0}
.svgwrap svg{display:block}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.calnav b{font-size:16px;color:var(--brand-dark)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:10px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cal .cell{min-height:56px;border:1px solid var(--line);border-radius:11px;padding:4px 5px;font-size:11px;background:var(--card);position:relative;cursor:pointer;color:var(--muted)}
.cal .cell.empty{background:transparent;border:0;cursor:default}
.cal .cell.today{border-color:var(--hi);box-shadow:0 0 0 1.5px var(--hi)}
.cal .cell.sup{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cal .cell.today.sup{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--hi),inset 0 0 0 2px var(--accent)}
.cal .cell:active{background:var(--soft)}
.cal .cnt{position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#fff;background:var(--brand);border-radius:8px;padding:0 5px;line-height:15px}
.cal .cnt.due{background:var(--bad)}
.cal .cc{display:block;margin-top:16px;font-size:9px;color:var(--brand-dark);white-space:normal;line-height:1.3;word-break:break-word;font-weight:600}
.payrow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line)}
.payrow input[type=checkbox]{width:23px;height:23px;flex:none;accent-color:var(--brand)}
.payrow input[type=date]{width:135px;padding:8px;font-size:13px;flex:none}
.payrow .li-main{flex:1;min-width:0;cursor:pointer}
.paybar{position:sticky;top:0;background:var(--bg);z-index:2;padding:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin:10px 0 2px;font-size:12px;color:var(--muted)}
.legend .lgi{display:inline-flex;align-items:center;gap:5px}
.legend .lgi i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .lgi i.line{width:18px;height:0;border-top:3px solid var(--hi);border-radius:0}
.legend .lgi i.dash{width:18px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.grphead{background:var(--soft);color:var(--brand-dark);font-weight:700;font-size:12px;padding:8px 10px;border-radius:8px;margin:12px 0 2px}
.rawscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#rtable{font-size:12px;white-space:nowrap;min-width:100%}
#rtable th{cursor:pointer;position:sticky;top:0;background:var(--card);user-select:none}
#rtable td,#rtable th{padding:7px 9px}
#colsBox{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 10px}
.colchk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink);font-weight:500}
.colchk input[type=checkbox]{width:18px;height:18px;flex:none;margin:0;accent-color:var(--brand)}
optgroup{font-size:12px;color:var(--muted)} optgroup option{font-size:16px;color:var(--ink)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;
  padding:11px 18px;border-radius:24px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast.show{opacity:1}
.badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--card)}
summary{font-weight:600;cursor:pointer}
.audit-row{font-size:12.5px;padding:7px 2px;border-bottom:1px solid var(--line);color:var(--muted)}
.audit-row b{color:var(--ink)}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
  body{padding-left:236px}
  nav.tabs{flex-direction:column;justify-content:flex-start;align-items:stretch;top:0;bottom:0;left:0;right:auto;
    width:236px;max-width:236px;margin:0;background:var(--brand);border-top:0;border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 20px) 12px 20px;gap:5px}
  nav.tabs::before{content:var(--appname,"⬡ Therapy Tracker");display:block;color:#fff;font-weight:700;font-size:16px;padding:6px 14px 16px;opacity:.96;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;width:100%;color:rgba(255,255,255,.82);
    padding:12px 14px;border-radius:12px;font-size:14.5px}
  nav.tabs button .ic{width:22px;height:22px}
  nav.tabs button .ic svg{width:21px;height:21px}
  nav.tabs button>span:last-child{font-size:14.5px;text-align:left;flex:1}
  nav.tabs button.on{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .app{max-width:920px;margin:0 auto}
  header.top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
  header.top .ty{background:var(--soft);color:var(--muted)}
  header.top .themebtn{background:var(--soft);color:var(--ink)}
  main{padding:22px 26px 60px}
  .fab{bottom:26px;right:26px}
  .sheet{align-items:center}
  .sheet-inner{border-radius:18px;max-width:640px;max-height:88vh}
}

/* ====================== Gamification & celebration FX ====================== */
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:80;display:none}
#confetti.on{display:block}
.celebr{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;pointer-events:none;padding:24px}
.celebr.show{display:flex}
.celebr .cb{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 30px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.4),0 0 0 1px color-mix(in srgb,var(--brand) 20%,transparent);max-width:340px;
  transform:scale(.6);opacity:0;animation:pop-in .55s cubic-bezier(.18,1.4,.5,1) forwards;position:relative;overflow:hidden}
.celebr .cb::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 80%,color-mix(in srgb,var(--brand) 35%,transparent) 88%,transparent 96%);
  animation:sweep 2.4s linear infinite;opacity:.5;pointer-events:none}
.celebr .cb>*{position:relative;z-index:1}
.celebr .cemoji{font-size:62px;line-height:1;display:block;margin-bottom:6px;animation:bounce-emoji 1s ease 1}
.celebr .ctitle{font-size:21px;font-weight:800;color:var(--brand-dark);margin:6px 0 2px;letter-spacing:.01em}
.celebr .csub{font-size:14px;color:var(--muted);line-height:1.4}
.celebr .cribbon{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:var(--hi);padding:5px 12px;border-radius:20px}
@keyframes pop-in{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes bounce-emoji{0%{transform:translateY(0) scale(.6)}30%{transform:translateY(-16px) scale(1.18)}55%{transform:translateY(0) scale(1)}72%{transform:translateY(-7px)}100%{transform:translateY(0)}}
@keyframes sweep{to{transform:rotate(360deg)}}

/* floating +reward pill */
.floatpill{position:fixed;z-index:84;pointer-events:none;font-weight:800;font-size:16px;color:#fff;background:var(--hi);
  padding:6px 13px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:floatup 1.3s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.7);opacity:0}15%{transform:translateY(-6px) scale(1.05);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}

/* streak flame */
.streakcard{display:flex;align-items:center;gap:16px}
.flame{position:relative;width:50px;height:60px;flex:none}
.flame i{position:absolute;bottom:2px;left:50%;border-radius:0 50% 50% 50%;transform-origin:center bottom}
.flame .o{width:34px;height:42px;margin-left:-17px;background:linear-gradient(45deg,#ff3d3d,#ff8a1e 55%,#ffd23f);
  transform:rotate(45deg);animation:flick 1.5s ease-in-out infinite;filter:drop-shadow(0 -2px 9px rgba(255,120,24,.6))}
.flame .i{width:18px;height:24px;margin-left:-9px;bottom:7px;background:linear-gradient(45deg,#ffcf2e,#fff3b0);
  transform:rotate(45deg);animation:flick 1.05s ease-in-out infinite reverse}
.flame.cold .o{background:linear-gradient(45deg,#9aaaa4,#c2ccc8);filter:none;animation-duration:3s;opacity:.8}
.flame.cold .i{background:linear-gradient(45deg,#b7c2bd,#e3e9e6);animation-duration:3s}
.flame.risk .o{filter:drop-shadow(0 -2px 9px rgba(255,170,40,.7))}
@keyframes flick{0%,100%{transform:rotate(45deg) scale(1)}25%{transform:rotate(43deg) scaleY(1.09) scaleX(.96)}50%{transform:rotate(47deg) scaleY(1.04) scaleX(.98)}75%{transform:rotate(44deg) scaleY(1.07) scaleX(.97)}}
.streakwrap{flex:1;min-width:0}
.streaknum{font-size:34px;font-weight:800;color:var(--brand-dark);line-height:1}
.streaknum small{font-size:15px;font-weight:700;color:var(--muted)}
.streakmsg{font-size:13px;color:var(--muted);margin-top:3px}
.streakcard.bump .flame{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

/* goal progress rings */
.rings{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-around;margin-top:4px}
.ring{position:relative;width:104px;text-align:center}
.ring svg{display:block;margin:0 auto;transform:rotate(-90deg)}
.ring .rbg{stroke:var(--soft)}
.ring .rfg{stroke:var(--brand);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.85,.25,1);stroke-linecap:round}
.ring.done .rfg{stroke:var(--good)}
.ring .rpct{position:absolute;top:0;left:0;right:0;height:80px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.ring.done .rpct{color:var(--good)}
.ring .rpct .chk{font-size:24px}
.ring .rlab{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.25}
.ring.done svg{animation:ringpop .7s cubic-bezier(.18,1.4,.5,1)}
@keyframes ringpop{0%{transform:rotate(-90deg) scale(1)}45%{transform:rotate(-90deg) scale(1.12)}100%{transform:rotate(-90deg) scale(1)}}

/* badges / records */
.badgegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.bdg{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.bdg .be{font-size:24px;flex:none}
.bdg .bv{font-size:17px;font-weight:800;color:var(--brand-dark);line-height:1}
.bdg .bl{font-size:11px;color:var(--muted);margin-top:2px}
.bdg .bbest{font-size:11px;font-weight:600;color:var(--muted)}
.bdg.locked{opacity:.55}
.bdg.fresh{animation:freshpop .8s cubic-bezier(.18,1.4,.5,1);border-color:color-mix(in srgb,var(--hi) 55%,transparent)}
@keyframes freshpop{0%{transform:scale(.85);box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 50%,transparent)}50%{transform:scale(1.04)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}

/* count-up pulse */
.countup.tick{animation:ctick .25s ease}
@keyframes ctick{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* bulk "catch-up" rows (Incomplete tab) */
.irow{display:flex;flex-direction:column;gap:9px;padding:12px 6px;border-bottom:1px solid var(--line);border-radius:10px;transition:opacity .3s}
.irow:last-child{border-bottom:0}
.irow .itop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.irow .ittl{font-weight:600;font-size:15px}
.irow .isub{font-size:12.5px;color:var(--muted)}
.irow .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.irow .pdate2{width:140px;padding:8px;font-size:13px;flex:none}
.irow.flash{animation:rowflash 1.1s ease}
@keyframes rowflash{0%{background:color-mix(in srgb,var(--good) 32%,transparent)}100%{background:transparent}}
.irow.cleared{opacity:.45}
.tgl{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:20px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;user-select:none;
  transition:transform .1s,background .15s,color .15s,border-color .15s}
.tgl:active{transform:scale(.93)}
.tgl .tbox{width:16px;height:16px;border-radius:5px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.tgl.on{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.tgl.on .tbox{background:var(--good);border-color:var(--good);color:#fff}
.tgl.pop{animation:tglpop .42s cubic-bezier(.18,1.5,.5,1)}
@keyframes tglpop{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
.bulkbar{position:sticky;top:0;background:var(--bg);z-index:2;padding:8px 0}
.bulkbar .bbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.savebig{position:relative;overflow:hidden}
.savebig.ready{animation:readypulse 1.8s ease-in-out infinite}
@keyframes readypulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}

/* sound toggle in header (reuses .themebtn) */
.themebtn.muted{opacity:.6}

/* mini progress bar under KPIs / goals */
.pbar{height:7px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--hi));width:0;
  transition:width 1.1s cubic-bezier(.2,.85,.25,1)}
.pbar.done>i{background:var(--good)}

/* ===== client retention funnel ===== */
.funnel{display:flex;flex-direction:column;gap:13px}
.funnel .ftop{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px;color:var(--muted)}
.funnel .ftop b{color:var(--brand-dark)}
.funnel .fbar{height:24px;border-radius:9px;background:var(--soft);overflow:hidden}
.funnel .fbar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand),var(--hi));transition:width 1.05s cubic-bezier(.2,.85,.25,1)}

/* ===== grouped client chips (supervision clients-discussed) ===== */
.cgrp{margin-top:9px}
.cglab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:5px}
.cgchips{display:flex;flex-wrap:wrap;gap:8px}

/* ===== attention feed (Home) ===== */
.attn{display:flex;flex-direction:column;gap:8px}
.acard{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:0 12px 12px 0;padding:11px 12px;transition:opacity .3s,transform .3s}
.acard.bad{border-left-color:var(--bad)} .acard.warn{border-left-color:var(--warn)} .acard.brand{border-left-color:var(--brand)} .acard.acc{border-left-color:var(--accent)}
.acard .ae{font-size:20px;flex:none;line-height:1}
.acard .am{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.acard .am b{color:var(--brand-dark)}
.acard .am .sub{font-size:12px;color:var(--muted)}
.acard.gone{opacity:0;transform:translateX(30px)}
.allclear{text-align:center;padding:14px 8px;color:var(--good);font-weight:600;font-size:14px}
.allclear .ace{font-size:30px;display:block;margin-bottom:3px}

/* ===== Trends: folded historical clients ===== */
.aged{border:1px solid var(--hair);border-radius:13px;margin-top:10px;

<script>
"use strict";
/* ============ Storage layer (IndexedDB + audit + snapshots) ============ */
const DBN="TherapyTrackerDB", DBV=1;
let _db=null;
function openDB(){return new Promise((res,rej)=>{
  const rq=indexedDB.open(DBN,DBV);
  rq.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains("state"))db.createObjectStore("state");
    if(!db.objectStoreNames.contains("audit"))db.createObjectStore("audit",{keyPath:"id",autoIncrement:true});
    if(!db.objectStoreNames.contains("snapshots"))db.createObjectStore("snapshots",{keyPath:"id",autoIncrement:true});
  };
  rq.onsuccess=e=>{_db=e.target.result;res(_db)};
  rq.onerror=e=>rej(e.target.error);
})}
function tx(store,mode){return _db.transaction(store,mode).objectStore(store)}
function pr(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function kvGet(k){return pr(tx("state","readonly").get(k))}
async function kvPut(k,v){return pr(tx("state","readwrite").put(v,k))}
async function auditAdd(rec){return pr(tx("audit","readwrite").add(rec))}
async function auditAll(){return pr(tx("audit","readonly").getAll())}
async function snapAdd(rec){return pr(tx("snapshots","readwrite").add(rec))}
async function snapDel(id){return pr(tx("snapshots","readwrite").delete(id))}
async function snapCount(){return pr(tx("snapshots","readonly").count())}
/* Cursor helpers: never load every snapshot just to count or trim them. Reading all 120
   deserialises tens of MB and was ~97% of the cost of a save. Keys are autoIncrement, so
   ascending key order is oldest-first. */
function snapCursor(dir,limit,keysOnly){return new Promise((res,rej)=>{
  const store=tx("snapshots","readonly");
  const rq=keysOnly?store.openKeyCursor(null,dir):store.openCursor(null,dir);
  const out=[];
  rq.onsuccess=e=>{const c=e.target.result;
    if(!c||out.length>=limit)return res(out);
    out.push(keysOnly?c.key:c.value); c.continue();};
  rq.onerror=e=>rej(e.target.error);
})}
async function snapRecent(n){return snapCursor("prev",n,false)}   // newest first
async function snapOldestIds(n){return snapCursor("next",n,true)} // oldest first, keys only
async function snapPrune(){
  const n=await snapCount();
  if(n<=MAX_SNAP)return;
  for(const id of await snapOldestIds(n-MAX_SNAP))await snapDel(id);
}

/* localStorage mirror as extra safety net. Returns false if it could not be written
   (quota, private mode) so callers can treat that as the save failure it is. */
function mirror(state){try{localStorage.setItem("tt_state",JSON.stringify(state));localStorage.setItem("tt_state_ts",new Date().toISOString());return true}catch(e){return false}}

/* ===== Durability: ask the browser not to evict this app's storage =====
   Site storage is disposable by default: browsers reclaim it under disk pressure, and iOS
   Safari evicts it after ~7 days without a visit. This device holds the only copy of the
   data, so request a persistence grant and report the answer in Settings. */
let _persisted=null;
async function requestPersistence(){
  try{
    if(!navigator.storage||!navigator.storage.persist)return (_persisted="unsupported");
    if(await navigator.storage.persisted())return (_persisted="granted");
    _persisted=(await navigator.storage.persist())?"granted":"denied";
  }catch(e){_persisted="unsupported";}
  return _persisted;
}
async function storageStatus(){
  const persisted=_persisted||await requestPersistence();
  let usage=null,quota=null;
  try{if(navigator.storage&&navigator.storage.estimate){const est=await navigator.storage.estimate();usage=est.usage;quota=est.quota;}}catch(e){}
  return {persisted,usage,quota};
}

/* ============ App state ============ */
let S=null; // {clients,rooms,sessions,supervision,rateHistory,clientCategories}
const MAX_SNAP=120;
/* Data schema version, stamped on state and on every backup. Bump when a change would be
   misread by an older build, and add the matching step to migrate(). Data with no stamp is v1
   (everything written before versioning existed). */
const SCHEMA_VERSION=5;
function stateSchemaVersion(st){const v=st&&st.meta&&+st.meta.schemaVersion;return v>0?v:1;}

function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* Which client statuses mean "no longer seeing them", for the retention review. Status is free
   text, so read it off the status→category mapping the therapist already maintains rather than
   guessing at the words. Paused / Active enquiry sit under Pipeline and are deliberately not
   ended — those clients may come back. */
function defaultEndedStatuses(st){
  const out=new Set();
  (st.clientCategories||[]).forEach(c=>{if(c&&c.status&&String(c.category||"").toLowerCase()==="finished")out.add(c.status);});
  if(!out.size)out.add("Finished");
  return Array.from(out);
}

function normalize(st){
  st.clients=st.clients||[];st.rooms=st.rooms||[];st.sessions=st.sessions||[];
  st.supervision=st.supervision||[];st.rateHistory=st.rateHistory||[];st.clientCategories=st.clientCategories||[];
  ["sessions","clients","supervision","rateHistory","rooms"].forEach(k=>st[k].forEach(x=>{if(x&&!x._id)x._id=uid()}));
  if(!st.roomRateHistory||!st.roomRateHistory.length){
    st.roomRateHistory=st.rooms.map(r=>({_id:uid(),location:r.location,effectiveFrom:"2000-01-01",rate:r.rate}));
  }
  st.roomRateHistory.forEach(x=>{if(!x._id)x._id=uid()});
  /* practice branding + feature switches, set in first-run setup (travels with backups) */
  st.settings=st.settings||{}; const sg=st.settings;
  const hasData=(st.sessions.length>0||st.clients.length>0);
  if(sg.practiceName==null)sg.practiceName=hasData?"Charlotte Bloor Therapy":"Therapy Tracker"; // existing installs keep their header
  if(sg.practiceTagline==null)sg.practiceTagline="Counselling & psychotherapy";
  if(sg.palette==null)sg.palette="sage";
  sg.features=sg.features||{};
  /* The Revenue tab became Money + Tax (Aug 2026). Anyone who had switched Revenue off meant
     "hide the money side", so carry that across to both rather than silently switching it
     back on. The old key is left in place; nothing reads it now. */
  if(sg.features.income===false){
    if(sg.features.money==null)sg.features.money=false;
    if(sg.features.tax==null)sg.features.tax=false;
  }
  /* Accreditation is a minority need — only therapists working toward it. It's opt-in for anyone
     new, but anyone already running with it keeps it: pulling a feature out from under someone
     mid-accreditation would lose them the one screen they're keeping records for. */
  if(sg.features.accreditation==null)sg.features.accreditation=hasData?true:false;
  if(sg.cpdTarget==null)sg.cpdTarget=30;
  /* HMRC's default for sole traders since 2024/25 is the CASH basis: income counted when it is
     received and costs when they are paid. Accruals is now the opt-out election, not the norm. */
  if(sg.taxBasis==null)sg.taxBasis="cash";
  /* Use of home: off until the therapist sets it up, because guessing a claim on their behalf
     would put a number on their tax return that they never agreed to. */
  /* Use of home is chosen PER TAX YEAR -- HMRC lets you use the simplified rate one year and
     actual costs the next, and household bills change anyway. `years` holds the explicit choices;
     a year with no entry carries forward the last one, so a claim never silently lapses. */
  sg.useOfHome=sg.useOfHome||{};
  if(!sg.useOfHome.years){
    const legacy=sg.useOfHome;
    sg.useOfHome={years:{}};
    if(legacy&&legacy.method&&legacy.method!=="none"){
      const y=legacy.since?taxYear(legacy.since):curTaxYear();
      sg.useOfHome.years[y]={method:legacy.method,hours:+legacy.hours||0,rooms:+legacy.rooms||0,
        workRooms:+legacy.workRooms||0,businessPct:(legacy.businessPct==null?100:+legacy.businessPct),
        costs:legacy.costs||{},appliedAt:legacy.since||isoD(today())};
    }
  }
  /* Scottish income tax bands differ enough that the estimate is simply wrong without knowing. */
  if(sg.taxRegion==null)sg.taxRegion="rUK";
  if(sg.studentLoan==null)sg.studentLoan="none";
  if(sg.class2Voluntary==null)sg.class2Voluntary=false;
  if(sg.onboarded==null)sg.onboarded=hasData; // anyone with data already knows the app — don't ambush them with setup
  /* Gradual reveal. `mode` defaults to "all" for anyone who already has data, for the same
     reason accreditation does above: hiding tabs from someone who is already using them is the
     one outcome this feature must never produce. Only a genuinely fresh install can start
     simple, and only by choosing to in setup. `shown` records which nudges have been offered,
     accepted or declined, so nothing is ever suggested twice. */
  sg.reveal=sg.reveal||{};
  if(sg.reveal.mode==null)sg.reveal.mode="all";   /* only stepDepth ever sets "simple" */
  if(!Array.isArray(sg.reveal.shown))sg.reveal.shown=[];
  st.game=st.game||{}; st.game.activeWeeks=st.game.activeWeeks||[]; st.game.records=st.game.records||{};
  const rr=st.game.records; rr.longestStreak=rr.longestStreak||0; rr.mostClearedAtOnce=rr.mostClearedAtOnce||0;
  /* Seed the concurrent-clients best from where the practice stands today. Starting at 0 would
     show "Best: 0" next to a live count of 12 until the next save corrected it. */
  if(rr.mostActiveClients==null)rr.mostActiveClients=activeClientCountIn(st);
  if(st.game.seenStreak==null)st.game.seenStreak=0;
  /* records retention (flag only, never auto-deletes): review periods in years, counted from a
     client's last logged session once their status is an "ended" one. Notes and financial records
     get their own timer because they have different compliance rationale — 6 yrs each by default
     (BACP complaint window ~3 yrs; insurers commonly want 6). */
  const rt=sg.retention=sg.retention||{};
  if(rt.notesYears==null)rt.notesYears=6;
  if(rt.financeYears==null)rt.financeYears=6;
  if(!Array.isArray(rt.endedStatuses)||!rt.endedStatuses.length)rt.endedStatuses=defaultEndedStatuses(st);
  /* business finances: dated monthly room rent alongside the existing per-session roomRateHistory,
     plus standalone expense and other-income ledgers. Recurring rows are expanded at report time
     (see ledgerBetween) rather than generated into the data, so correcting an amount corrects
     every period it applies to and there is nothing to keep in sync. */
  st.roomRentHistory=st.roomRentHistory||[];
  st.expenses=st.expenses||[]; st.otherIncome=st.otherIncome||[];
  st.paidCharges=st.paidCharges||{};   /* key "kind:ref|dueDate" -> date settled; reminders only, never the tax figures */
  /* v4: costs and other income carry a category KEY that maps to an SA103 box. The original
     free-text label is left on the record untouched, so nothing is lost in translation. */
  st.expenses.forEach(x=>{if(x&&x.cat==null)x.cat=migrateCat("exp",x.category);});
  st.otherIncome.forEach(x=>{if(x&&x.cat==null)x.cat=migrateCat("inc",x.category);});
  /* peer supervision: counts toward total accreditation hours, excluded from the 1:6 ratio */
  st.peerSupervision=st.peerSupervision||[];
  ["roomRentHistory","expenses","otherIncome","peerSupervision"].forEach(k=>st[k].forEach(x=>{if(x&&!x._id)x._id=uid()}));

    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.spread||1)*(4+Math.random()*9);
      parts.push({x:ox*dpr,y:oy*dpr,vx:Math.cos(a)*sp*dpr,vy:(Math.sin(a)*sp-(o.up||7))*dpr,
        g:(0.16+Math.random()*0.12)*dpr,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.34,
        w:(6+Math.random()*7)*dpr,h:(8+Math.random()*9)*dpr,c:COLORS[(Math.random()*COLORS.length)|0],
        life:0,max:55+Math.random()*55,shape:Math.random()<0.5?0:1});}
    cv.classList.add("on"); if(!raf)raf=requestAnimationFrame(loop); }
  function loop(){ctx2.clearRect(0,0,cv.width,cv.height);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.rot+=p.vr;p.life++;
      ctx2.save();ctx2.globalAlpha=Math.max(0,1-p.life/p.max);ctx2.translate(p.x,p.y);ctx2.rotate(p.rot);ctx2.fillStyle=p.c;
      if(p.shape){ctx2.beginPath();ctx2.arc(0,0,p.w/2,0,6.283);ctx2.fill();}else ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx2.restore();
      if(p.life>=p.max||p.y>cv.height+50)parts.splice(i,1);}
    if(parts.length)raf=requestAnimationFrame(loop);
    else{raf=null;cv.classList.remove("on");ctx2&&ctx2.clearRect(0,0,cv.width,cv.height);} }
  addEventListener("resize",()=>{if(parts.length)size();});
  return {burst:spawn};
})();

/* ---- week helpers + game state ---- */
function weekMonday(d){if(typeof d==="string")d=parseD(d);const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;}
function weekKey(d){return isoD(weekMonday(d));}
function ensureGame(){ if(!S.game)S.game={}; const g=S.game; g.activeWeeks=g.activeWeeks||[]; g.records=g.records||{};
  const r=g.records; r.longestStreak=r.longestStreak||0; r.mostClearedAtOnce=r.mostClearedAtOnce||0;
  if(r.mostActiveClients==null)r.mostActiveClients=activeClientCount();
  if(g.seenStreak==null)g.seenStreak=0; return g; }
function computeStreak(){ const g=ensureGame(); const set=new Set(g.activeWeeks); const cur=weekMonday(today());
  let recent=null; set.forEach(k=>{const d=weekMonday(k); if(d<=cur&&(!recent||d>recent))recent=d;});
  if(!recent)return {count:0,status:"none",longest:g.records.longestStreak};
  let count=0,probe=new Date(recent); while(set.has(weekKey(probe))){count++;probe.setDate(probe.getDate()-7);}
  const gap=Math.round((cur-recent)/(7*86400000));
  const status=gap===0?"active":gap===1?"risk":"none";
  if(status==="none")return {count:0,status:"none",longest:g.records.longestStreak};
  return {count,status,longest:g.records.longestStreak}; }
function gameTouch(){ const g=ensureGame(); const k=weekKey(today());
  if(g.activeWeeks.indexOf(k)<0)g.activeWeeks.push(k);
  g.activeWeeks.sort(); if(g.activeWeeks.length>520)g.activeWeeks=g.activeWeeks.slice(-520);
  const st=computeStreak(); if(st.count>g.records.longestStreak)g.records.longestStreak=st.count;
  const ac=activeClientCount(); if(ac>(g.records.mostActiveClients||0))g.records.mostActiveClients=ac; }
function saveGameQuiet(){try{mirror(S);if(_db)kvPut("current",S);}catch(e){}}
function gameGoals(){ const der=S.sessions.map(s=>({s,d:derive(s)}));
  const past=der.filter(x=>x.d.past);
  const payPast=past.filter(x=>(x.d.rate||0)>0);
  const paid=payPast.filter(x=>x.d.clientPaid).length, over=payPast.length-paid;
  const paidPct=payPast.length?Math.round(paid/payPast.length*100):100;
  const complete=past.filter(x=>x.d.complete).length;
  const compPct=past.length?Math.round(complete/past.length*100):100;
  return {paidPct,paid,over,compPct,complete,incomplete:past.length-complete,totalPast:past.length}; }

function clientSessionCounts(){const m={};S.sessions.forEach(s=>{if(isCancelled(s))return;const k=(s.client||"").toLowerCase();if(k)m[k]=(m[k]||0)+1;});return m;}
function clientAddedDate(c){if(c.created)return c.created;
  const rs=(S.rateHistory||[]).filter(r=>(r.client||"").toLowerCase()===(c.code||"").toLowerCase()).map(r=>r.effectiveFrom).filter(Boolean).sort();
  if(rs.length)return rs[0];
  const ss=S.sessions.filter(s=>(s.client||"").toLowerCase()===(c.code||"").toLowerCase()).map(s=>s.date).filter(Boolean).sort();
  return ss.length?ss[0]:null;}
function sparkline(vals,opt){opt=opt||{};const w=opt.w||300,h=opt.h||46,pad=3,n=vals.length;
  if(!n)return '<p class="muted small">Not enough data yet.</p>';
  const max=Math.max(1,...vals),min=Math.min(0,...vals),rng=(max-min)||1;
  const xs=i=>pad+(n<=1?(w-2*pad)/2:i*(w-2*pad)/(n-1));
  const ys=val=>h-pad-(val-min)/rng*(h-2*pad);
  const pts=vals.map((v,i)=>[xs(i),ys(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area="M"+pts[0][0].toFixed(1)+" "+(h-pad)+" "+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+" L"+pts[n-1][0].toFixed(1)+" "+(h-pad)+" Z";
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block;margin-top:4px">'+
    '<path d="'+area+'" fill="color-mix(in srgb,var(--brand) 14%,transparent)"></path>'+
    '<path d="'+line+'" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg>';}
function celebrateNewClient(c){
  const prior=S.clients.filter(x=>x._id!==c._id).map(clientAddedDate).filter(Boolean).sort();
  const lastAdd=prior.length?prior[prior.length-1]:null;
  const gap=lastAdd?Math.floor((today()-parseD(lastAdd))/86400000):null;
  const total=S.clients.length;
  if(total===1)celebrate({emoji:"🌱",title:"Your very first client!",sub:c.code+" is the start of your practice — exciting times ahead.",ribbon:"Day one",level:"mega",sound:"record"});
  else if(gap!=null&&gap>=30)celebrate({emoji:"🌟",title:"A new beginning",sub:"Welcome "+c.code+" — your first new client in "+gap+" days. Good to be growing again.",ribbon:"Fresh start",level:"mega",sound:"record"});
  else celebrate({emoji:"🌱",title:"New client welcomed",sub:c.code+" joins your practice — that's "+total+" clients in your care. Great work.",level:"big",sound:"fanfare"});
}

/* ===== analytics helpers (inline SVG charts) ===== */
function monthKey(s){const d=parseD(s);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function weekStart(s){const d=parseD(s);const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x}
function moneyShort(n){n=Math.round(n);if(Math.abs(n)>=1000)return "£"+(n/1000).toFixed(n%1000===0?0:1)+"k";return "£"+n}
function pkey(dstr,gran){if(gran==="week"){const ws=weekStart(dstr);return[isoD(ws),ws.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})];}
  const k=monthKey(dstr);return[k,parseD(k+"-01").toLocaleDateString("en-GB",{month:"short",year:"2-digit"})];}
function periodSeries(gran){
  const der=S.sessions.map(s=>({s,d:derive(s)}));const map={};
  const get=(key,lab)=>map[key]||(map[key]={lab,revenue:0,room:0,sup:0,costs:0,oth:0,clients:new Set()});
  der.forEach(x=>{const dt=parseD(x.s.date);if(!dt)return;const[key,lab]=pkey(x.s.date,gran);
    const e=get(key,lab);e.revenue+=x.d.rate||0;e.room+=x.d.roomRate||0;if(x.s.client)e.clients.add(x.s.client.toLowerCase());});
  (S.supervision||[]).forEach(sv=>{if(!sv.date)return;const[key,lab]=pkey(sv.date,gran);const e=get(key,lab);e.sup+=(+sv.cost||0);});
  (S.peerSupervision||[]).forEach(pv=>{if(!pv.date||!(+pv.cost))return;const[key,lab]=pkey(pv.date,gran);const e=get(key,lab);e.sup+=(+pv.cost||0);});
  /* business costs and other practice income, expanded across the whole span the chart covers so
     a recurring bill still lands in months with no sessions of their own */
  const span=[];
  S.sessions.forEach(s=>{const d=parseD(s.date);if(d)span.push(+d);});
  (S.supervision||[]).forEach(v=>{const d=v.date?parseD(v.date):null;if(d)span.push(+d);});
  (S.expenses||[]).concat(S.otherIncome||[]).forEach(x=>{const d=x.date?parseD(x.date):null;if(d)span.push(+d);});
  (S.roomRentHistory||[]).forEach(h=>{const d=parseD(h.effectiveFrom);if(d)span.push(+d);});
  if(span.length){
    const from=new Date(Math.min.apply(null,span)), to=new Date(Math.max.apply(null,span.concat([+today()])));
    const add=(dt,field,amt)=>{const[key,lab]=pkey(isoD(dt),gran);get(key,lab)[field]+=amt;};
    (S.expenses||[]).forEach(x=>moneyOccurrences(x,from,to).forEach(o=>add(o.date,"costs",o.amount)));
    (S.otherIncome||[]).forEach(x=>{if(String(x.scope||"practice")==="personal")return;   /* a different trade — never in the practice's net */
      moneyOccurrences(x,from,to).forEach(o=>add(o.date,"oth",o.amount));});
    roomRentOccurrences(from,to).forEach(o=>add(o.date,"costs",o.amount));
  }
  const allKeys=Object.keys(map).sort();
  const netOf=e=>e.revenue+e.oth-e.room-e.sup-e.costs;
  const netArr=allKeys.map(k=>netOf(map[k]));
  const cliArr=allKeys.map(k=>map[k].clients.size);
  const W=gran==="week"?26:6;
  const mov=(arr,i)=>{const s=Math.max(0,i-W+1);let t=0;for(let q=s;q<=i;q++)t+=arr[q];return t/(i-s+1);};
  const startIdx=0;
  return allKeys.slice(startIdx).map((k,idx)=>{const i=startIdx+idx;const e=map[k];
    return{l:e.lab,revenue:Math.round(e.revenue),room:Math.round(e.room),sup:Math.round(e.sup),
      costs:Math.round(e.costs),oth:Math.round(e.oth),
      net:Math.round(netOf(e)),clients:e.clients.size,
      netAvg:Math.round(mov(netArr,i)),cliAvg:Math.round(mov(cliArr,i)*10)/10};});
}
/* Position a horizontally-scrolling chart: back where it was, or at the newest period.
   The width isn't final until layout has run, hence the rAF for the first paint. */
function scrollChart(wrap,keep){
  if(!wrap)return;
  const put=()=>{if(!wrap.isConnected&&keep==null)return;
    wrap.scrollLeft=(keep!=null)?keep:Math.max(0,wrap.scrollWidth-wrap.clientWidth);};
  /* The chart is built before its view is attached, so at this point it has no width to scroll.
     Both callbacks re-run it once layout exists — rAF for a visible tab, the timer for one that
     is hidden or backgrounded, where rAF may never fire. */
  put(); requestAnimationFrame(put); setTimeout(put,0);
}

function cancelLabel(kind){return kind==="dna"?"did not attend":"late cancel";}
function cancelTag(s,d){

/* ===== Missed sessions =====
   Two kinds, and the difference matters to the client's bill but never to the clinical record:
   a LATE CANCELLATION was called off inside the notice period, a DNA was simply not attended.
   `isLateCancel` keeps reading the historical notes convention ("Y (late cancellation)") and is
   still what decides the late-cancel flag itself. `isCancelled` is the one to use anywhere a
   session must be excluded from clinical hours, attendance or session counts -- a DNA has to be
   excluded from all of those for exactly the same reasons a late cancellation is. */
function isLateCancel(s){return !!(s&&(s.lateCancel||(s.notes&&/late cancellation/i.test(String(s.notes)))));}
function isDNA(s){return !!(s&&s.cancelKind==="dna");}
function isCancelled(s){return isDNA(s)||isLateCancel(s);}
/* What the practice's policy says to charge for a session missed with `hrs` notice. A rule reads
   "at least N hours' notice -> charge X%", so the windows are tried LONGEST FIRST and the first
   one the notice clears wins.
   Notice that clears no rule at all -- and notice that was never recorded -- charges the FULL
   fee. That is the conservative direction on purpose: a draft that is too high gets corrected on
   the spot, whereas one that is too low is a fee quietly written off. A therapist who does want
   a lower floor says so with a rule at 0 hours. */
function cancelPolicy(){const c=(settings().cancelRules)||{};
  return {window:(c.window||[]).slice().sort((a,b)=>(+b.hoursBefore||0)-(+a.hoursBefore||0)),
          dnaChargePct:(c.dnaChargePct==null?100:+c.dnaChargePct)};}
function cancelPolicyPct(kind,hrs){
  const p=cancelPolicy();
  if(kind==="dna")return p.dnaChargePct;
  if(hrs==null)return 100;
  for(const w of p.window){if(hrs>=(+w.hoursBefore||0))return Math.max(0,Math.min(100,+w.chargePct||0));}
  return 100;
}
/* Notice actually given, in hours, when the cancellation date was recorded. Null when it wasn't;
   the caller then falls back to the shortest window, which is the safe reading of "we don't know". */
function cancelNoticeHrs(s){
  if(!s||!s.cancelledAt)return null;
  const when=parseD(s.cancelledAt), d=parseD(s.date); if(!when||!d)return null;
  const tm=(s.time||"00:00").split(":"); const start=new Date(d); start.setHours(+tm[0]||0,+tm[1]||0,0,0);
  return (start-when)/3600000;

/* clinical (client-contact) hours from logged sessions: each session that has taken place = 1 hr (50-min min); missed / late-cancelled excluded */
function clinicalStats(){const t=today();let inP=0,onl=0;
  S.sessions.forEach(s=>{const d=parseD(s.date);if(!d||d>t||isCancelled(s))return;
    if((s.mode||"")==="Online")onl++;else inP++;});
  return {inPerson:inP,online:onl,logged:inP+onl};}

   so it only appears when that's switched on. */

/* ============ Session validation (shared by the form + the data-health sweep) ============ */
function validateSession(m){
  const errors=[],warnings=[];
  const id=m._id;
  const d=derive(m);
  const md=m.date?parseD(m.date):null;
  const t=today();
  const cl=m.client?S.clients.find(c=>(c.code||"").toLowerCase()===(m.client||"").toLowerCase()):null;
  const sameClient=s=>(s.client||"").toLowerCase()===(m.client||"").toLowerCase();
  const hasNum=m.num!==""&&m.num!=null;
  /* BLOCK: exact time clash (can't be in two places at once) */
  if(m.date&&m.time){const clash=S.sessions.find(s=>s._id!==id&&s.date===m.date&&(s.time||"")===(m.time||""));
    if(clash)errors.push({code:"timeclash",msg:"Time clash with "+esc(clash.client||"another session")+" at "+esc(m.time)+" on "+fmtDMY(m.date)});}
  /* BLOCK: duplicate session # for this client */
  let isDupNum=false;
  if(m.client&&hasNum){const dup=S.sessions.find(s=>s._id!==id&&sameClient(s)&&String(s.num)===String(m.num));
    if(dup){isDupNum=true;errors.push({code:"dupnum",msg:"#"+esc(m.num)+" already exists for "+esc(m.client)+" ("+fmtDMY(dup.date)+")"});}}
  /* WARN: same client, same day */
  if(m.client&&m.date){const same=S.sessions.find(s=>s._id!==id&&sameClient(s)&&s.date===m.date);
    if(same)warnings.push({code:"sameday",msg:esc(m.client)+" already has a session on "+fmtDMY(m.date)});}
  /* WARN: payment-date sanity */
  if(m.paidDate){const pd=parseD(m.paidDate);
    if(pd&&pd>t)warnings.push({code:"paidfuture",msg:"Payment date is in the future"});
    else if(pd&&md&&(md-pd)/86400000>7)warnings.push({code:"paidbefore",msg:"Payment date is over a week before the session date"});}
  if(m.roomPaidDate){const rpd=parseD(m.roomPaidDate);
    if(rpd&&rpd>t)warnings.push({code:"roompaidfuture",msg:"Room payment date is in the future"});
    else if(rpd&&md&&(md-rpd)/86400000>7)warnings.push({code:"roompaidbefore",msg:"Room payment date is over a week before the session date"});}
  /* WARN: room-paid vs room fee */
  const chargeable=(d.roomRate||0)>0;
  if(m.roomPaid==="Y"&&!chargeable)warnings.push({code:"roompaidnofee",msg:"Marked room paid, but "+esc(m.location||"this location")+" has no room fee"});
  if(m.roomPaid==="n/a"&&chargeable)warnings.push({code:"roomnafee",msg:"Room marked n/a, but "+esc(m.location||"this room")+" charges "+gbp(d.roomRate)});
  /* WARN: £0 / missing rate where the client normally charges */
  if(m.client&&(d.rate||0)===0){const charges=cl&&((cl.rate||0)>0||(S.rateHistory||[]).some(r=>(r.client||"").toLowerCase()===(m.client||"").toLowerCase()&&(r.rate||0)>0));
    if(charges)warnings.push({code:"zerorate",msg:"Rate is £0 although "+esc(m.client)+" normally charges — check rate history"});}
  /* WARN: inactive client (only for today/future sessions — past history is expected) */
  if(cl&&(cl.status==="Finished"||cl.status==="Paused")&&(!md||md>=t))warnings.push({code:"inactive",msg:esc(m.client)+" is marked "+esc(cl.status)});
  /* WARN: out-of-sequence # relative to the neighbouring session by date (not the global max — past entries are expected to sit below later ones) */
  if(m.client&&hasNum&&!isDupNum&&md){const n=+m.num||0;
    let prior=null,next=null;
    S.sessions.forEach(s=>{if(s._id===id||!sameClient(s)||(+s.num||0)<=0)return;const sd=s.date?parseD(s.date):null;if(!sd)return;
      if(sd<md){if(!prior||sd>parseD(prior.date))prior=s;}
      else if(sd>md){if(!next||sd<parseD(next.date))next=s;}});
    if(n>0&&prior){const p=+prior.num||0;
      if(n<=p)warnings.push({code:"seqlow",msg:"#"+n+" is below the prior session (#"+p+" on "+fmtDMY(prior.date)+")"});
      else if(n>p+1)warnings.push({code:"seqgap",msg:"#"+n+" skips ahead of the prior session (#"+p+" on "+fmtDMY(prior.date)+")"});}
    else if(n>0&&next){const nx=+next.num||0;
      if(nx&&n>=nx)warnings.push({code:"seqlow",msg:"#"+n+" is not below the next session (#"+nx+" on "+fmtDMY(next.date)+")"});}}
  /* WARN: late cancellation on a future session */
  if(isCancelled(m)&&md&&md>t)warnings.push({code:"lcfuture",msg:(isDNA(m)?"DNA":"Late cancellation")+" recorded on a future session"});
  return {errors,warnings};
}
/* practice-wide integrity checks (beyond per-session validation) */
function practiceChecks(){
  const items=[];
  S.sessions.forEach(s=>{if(!s.date||!/^\d{4}-\d{2}-\d{2}$/.test(String(s.date))||!parseD(s.date))
    items.push({id:s._id,sev:"err",msg:"Invalid or missing date on a session for "+esc(s.client||"?")});});
  const codeSet=new Set(S.clients.map(c=>(c.code||"").toLowerCase()));
  const orphC={};S.sessions.forEach(s=>{const k=(s.client||"").toLowerCase();if(k&&!codeSet.has(k))orphC[k]=(orphC[k]||0)+1;});
  Object.keys(orphC).forEach(k=>items.push({sev:"warn",msg:orphC[k]+" session"+(orphC[k]===1?"":"s")+" reference deleted client \""+esc(k)+"\""}));
  const locSet=new Set(S.rooms.map(r=>(r.location||"").toLowerCase()));
  const orphL={};S.sessions.forEach(s=>{const k=(s.location||"").toLowerCase();if(k&&!locSet.has(k))orphL[k]=(orphL[k]||0)+1;});
  Object.keys(orphL).forEach(k=>items.push({sev:"warn",msg:orphL[k]+" session"+(orphL[k]===1?"":"s")+" reference deleted room \""+esc(k)+"\""}));
  S.clients.filter(c=>(c.status||"")==="Ongoing").forEach(c=>{const a=clientAttendance(c);
    if(a&&a.currentPause)items.push({sev:"warn",msg:esc(c.code)+" is Ongoing but unseen for "+a.currentPause.days+" days — pause or finish?"});});
  S.clients.forEach(c=>{const has=(S.rateHistory||[]).some(r=>(r.client||"").toLowerCase()===(c.code||"").toLowerCase()&&(r.rate||0)>0);
    if(!has&&!((c.rate||0)>0)&&(c.status||"")!=="Finished")items.push({sev:"warn",msg:esc(c.code)+" has no rate set — sessions will bill £0"});});
  return items;
}

        rows=rows.filter(x=>x.d.overdue).sort((a,b)=>parseD(a.s.date)-parseD(b.s.date));
        renderUnpaid(list,rows,renderRows);return;
      }
      if(sessFilter.seg==="incomplete"){
        rows=rows.filter(x=>x.d.past&&!x.d.complete).sort((a,b)=>parseD(b.s.date)-parseD(a.s.date));
        renderIncomplete(list,rows,renderRows);return;
      }
      if(sessFilter.seg==="upcoming")rows=rows.filter(x=>parseD(x.s.date)>=t).sort((a,b)=>parseD(a.s.date)-parseD(b.s.date));
      else if(sessFilter.seg==="incomplete")rows=rows.filter(x=>x.d.past&&!x.d.complete).sort((a,b)=>parseD(b.s.date)-parseD(a.s.date));
      else rows=rows.sort((a,b)=>parseD(b.s.date)-parseD(a.s.date));
      if(!rows.length){list.innerHTML='<p class="muted small center" style="padding:18px">No sessions match.</p>';return}
      let anySwipe=false;
      const rowHTML=x=>{const d=x.d;
        if(sessFilter.seg==="incomplete"){const miss=missingReasons(x.s);
          return '<div class="list-item" data-id="'+x.s._id+'"><div class="li-main"><div class="li-title">'+esc(x.s.client)+' <span class="chip f">incomplete</span></div><div class="li-sub">'+fmtDshort(x.s.date)+' · #'+esc(x.s.num)+' · Missing: '+(miss.join(", ")||"—")+'</div></div><div class="li-right">'+gbp(d.rate)+'</div></div>';}
        const pay=payChip(x.s,d);
        return '<div class="list-item" data-id="'+x.s._id+'"><div class="li-main"><div class="li-title">'+esc(x.s.client)+' '+pay+cancelTag(x.s,d)+'</div><div class="li-sub">'+fmtDshort(x.s.date)+' · '+esc(x.s.time||"")+' · '+esc(x.s.location||"")+' · #'+esc(x.s.num)+'</div></div><div class="li-right">'+gbp(d.rate)+'</div></div>';};
      const swipeWrap=x=>{const inner=rowHTML(x);
        if(x.d.overdue&&(x.d.rate||0)>0){anySwipe=true;
          return '<div class="swrow" data-swipe="'+x.s._id+'"><div class="swunder">✓ Mark paid</div><div class="swover">'+inner+'</div></div>';}
        return inner;};
      /* The "All" list is the one that never stops growing. It used to be cut off at 400 rows
         with no way past — session 401 was simply unreachable. Now the most recent SESS_VISIBLE
         are listed and everything older folds into one block per tax year, carrying the totals
         that are what old sessions are usually consulted for anyway. Nothing is unreachable and
         nothing older is built until it is asked for.
         The other segments are worklists — upcoming is bounded by the future, unpaid and
         incomplete are things to clear — so they stay whole. */
      const foldable=(sessFilter.seg==="all"&&!q&&rows.length>SESS_VISIBLE);
      const head=foldable?rows.slice(0,SESS_VISIBLE):rows;
      const tail=foldable?rows.slice(SESS_VISIBLE):[];
      const years=[];const byYear={};
      tail.forEach(x=>{const y=x.d.taxYear||"Undated";
        if(!byYear[y]){byYear[y]={rows:[],billed:0,recvd:0};years.push(y);}
        const g=byYear[y];g.rows.push(x);g.billed+=(x.d.rate||0);if(x.d.clientPaid)g.recvd+=(x.d.rate||0);});
      list.innerHTML=head.map(swipeWrap).join("")+
        years.map(y=>{const g=byYear[y];
          return agedFold("sy_"+y,y+" · "+plural(g.rows.length,"session"),
            gbp(Math.round(g.billed))+' billed · '+gbp(Math.round(g.recvd))+' received');}).join("");
      if(anySwipe)list.insertAdjacentHTML("afterbegin",'<p class="small muted" style="margin:8px 2px 2px">💡 Swipe an overdue row left to mark it paid.</p>');
      list.querySelectorAll(".list-item").forEach(li=>li.onclick=()=>sessionForm(S.sessions.find(s=>s._id===li.dataset.id)));
      /* Folded rows are plain — no swipe-to-pay. An overdue session from three years ago belongs
         in the Unpaid worklist, not swiped out of a history block. */
      const builders={};
      years.forEach(y=>{builders["sy_"+y]=()=>byYear[y].rows.map(rowHTML).join("");});
      wireAgedFolds(list,builders,id=>sessionForm(S.sessions.find(s=>s._id===id)));
      attachSwipe(list,()=>renderRows());
    };
    body.querySelector("#sq").oninput=e=>{sessFilter.q=e.target.value;renderRows()};
    body.querySelector("#seg").querySelectorAll("button").forEach(bt=>bt.onclick=()=>{sessFilter.seg=bt.dataset.s;
      body.querySelector("#seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===bt));renderRows()});
    renderRows();
  }
  function renderUnpaid(container,rows,refresh){

    container.querySelector("#setAll").onclick=()=>{const dv=container.querySelector("#allD").value;prw.querySelectorAll(".pchk:checked").forEach(c=>{const di=prw.querySelector('.pdate[data-id="'+c.dataset.id+'"]');if(di)di.value=dv;});};
    sbtn.onclick=async()=>{const checks=[...prw.querySelectorAll(".pchk:checked")];if(!checks.length){toast("Tick some sessions first");Sfx.error();return}

        bigEffort:batch>=5,bigEffortSub:gbp(amount)+" collected across "+batch+" sessions"},f);

  function renderCal(){
