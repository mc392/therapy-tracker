/* ============ Suggestions ============ */
function clientList(){const order={Ongoing:0,"Initial session booked":0,Paused:1,Finished:2};
  return S.clients.slice().sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||a.code.localeCompare(b.code)).map(c=>c.code)}
function statusGroups(){
  const order=["Ongoing","Initial session booked","Active enquiry","Active","Paused","Finished"];
  const g={}; S.clients.forEach(c=>{const k=c.status||"Other";(g[k]=g[k]||[]).push(c.code)});
  return Object.keys(g).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?98:ia)-(ib<0?98:ib)||a.localeCompare(b)})
    .map(k=>[k,g[k].sort((x,y)=>x.localeCompare(y))]);
}
function clientSelectHTML(sel){
  return '<option value="">— choose client —</option>'+statusGroups().map(([st,codes])=>
    '<optgroup label="'+esc(st)+'">'+codes.map(c=>'<option value="'+esc(c)+'"'+(c===sel?" selected":"")+'>'+esc(c)+'</option>').join("")+'</optgroup>').join("");
}
function lastSessionFor(code,excludeId){
  const rs=S.sessions.filter(s=>(s.client||"").toLowerCase()===(code||"").toLowerCase()&&s._id!==excludeId);
  if(!rs.length)return null; rs.sort((a,b)=>parseD(b.date)-parseD(a.date)); return rs[0];
}
function freqDays(c){const f=(c&&c.frequency||"").toLowerCase();
  if(f.includes("2"))return 14; if(f.includes("3"))return 21; if(f.includes("month"))return 28; return 7}
/* Attendance: how regularly a client attends vs their expected frequency, since their first session.
   Gaps of 3× the expected interval or more are treated as "pauses" and excluded from the denominator
   (but recorded so they can be shown as a footnote). For Ongoing clients a pause running up to today is
   flagged separately so their status can be reviewed. */
function clientAttendance(c){
  const code=(c&&c.code||"").toLowerCase(); if(!code)return null;
  const rs=S.sessions.filter(s=>(s.client||"").toLowerCase()===code)
    .map(s=>({d:parseD(s.date),lc:isLateCancel(s)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
  if(!rs.length)return null;
  const fd=freqDays(c);
  const ongoing=(c.status||"")==="Ongoing";
  const first=rs[0].d, last=rs[rs.length-1].d;
  const end=ongoing?today():last;
  const pauses=[]; let pauseDays=0;
  for(let i=1;i<rs.length;i++){
    const gap=(rs[i].d-rs[i-1].d)/86400000;
    if(gap>=3*fd){ pauses.push({from:rs[i-1].d,to:rs[i].d,days:Math.round(gap)}); pauseDays+=gap-fd; }
  }
  let currentPause=null;
  if(ongoing){ const tail=(end-last)/86400000;
    if(tail>=3*fd){ currentPause={from:last,to:end,days:Math.round(tail)}; pauseDays+=tail-fd; } }
  const spanDays=Math.max(0,(end-first)/86400000-pauseDays);
  const expected=Math.max(1,Math.round(spanDays/fd)+1);
  const attended=rs.filter(x=>!x.lc).length;
  const pct=Math.min(100,Math.round(attended/expected*100));
  return {pct,attended,expected,pauses,currentPause,first,last,ongoing,fd,n:rs.length};
}
/* Rolling attendance over time: bucket every month from the earliest first-session to now,
   summing attended vs expected sessions across all tracked clients (same active-span / pause
   logic as clientAttendance, clipped to the month). The plotted line is a 3-month moving
   ratio of attended/expected, which smooths the noise of individual months. */
function rollingAttendanceSeries(rows){
  if(!rows.length)return [];
  const DAY=86400000,t=today();
  let minD=null; rows.forEach(x=>{if(!minD||x.a.first<minD)minD=x.a.first;});
  if(!minD)return [];
  const months=[];
  let cur=new Date(minD.getFullYear(),minD.getMonth(),1);
  const stop=new Date(t.getFullYear(),t.getMonth(),1);
  while(cur<=stop){
    const start=new Date(cur.getFullYear(),cur.getMonth(),1);
    const end=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    months.push({lab:start.toLocaleDateString("en-GB",{month:"short",year:"2-digit"}),start,end,attended:0,expected:0});
    cur=end;
  }
  const overlap=(a0,a1,b0,b1)=>Math.max(0,Math.min(a1,b1)-Math.max(a0,b0));
  rows.forEach(x=>{
    const a=x.a,code=(x.c.code||"").toLowerCase();
    const dates=S.sessions.filter(s=>(s.client||"").toLowerCase()===code&&!isLateCancel(s))
      .map(s=>parseD(s.date)).filter(Boolean);
    const activeEnd=(a.ongoing?t:a.last).getTime();
    const pauses=a.pauses.slice(); if(a.currentPause)pauses.push(a.currentPause);
    months.forEach(m=>{
      const ms=m.start.getTime(),me=m.end.getTime();
      let act=overlap(ms,me,a.first.getTime(),activeEnd);
      pauses.forEach(p=>{act-=overlap(ms,me,p.from.getTime(),p.to.getTime());});
      if(act>0)m.expected+=act/DAY/a.fd;
      m.attended+=dates.filter(d=>d>=m.start&&d<m.end).length;
    });
  });
  const W=3;
  return months.map((m,i)=>{let sa=0,se=0;for(let q=Math.max(0,i-W+1);q<=i;q++){sa+=months[q].attended;se+=months[q].expected;}
    return {lab:m.lab,avg:se>0?Math.round(sa/se*100):null};});
}
function suggestFor(code){
  const rs=S.sessions.filter(s=>(s.client||"").toLowerCase()===(code||"").toLowerCase());
  if(!rs.length)return {num:1,date:isoD(today()),time:"10:00",mode:"In-person",location:"At home",room:""};
  rs.sort((a,b)=>parseD(b.date)-parseD(a.date));const last=rs[0];
  const maxNum=Math.max(...rs.map(s=>+s.num||0));
  const cl=S.clients.find(c=>c.code.toLowerCase()===code.toLowerCase());
  const nd=addDays(parseD(last.date),freqDays(cl));
  return {num:maxNum+1,date:isoD(nd),time:last.time||"10:00",mode:last.mode||"In-person",
    location:last.location||"At home",room:last.room&&last.room!=="-"?last.room:""};
}

/* ============ Quick-log command bar (natural-language session entry) ============ */
function parseQuickLog(text){
  const raw=(text||"").trim(); if(!raw)return null;
  const toks=raw.split(/\s+/);
  const res={client:null,clientAmbig:[],date:null,time:null,mode:null,location:null,paid:false,unmatched:[]};
  const codes=S.clients.map(c=>c.code);
  const locs=S.rooms.map(r=>r.location);
  const wd={mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6,sun:0,sunday:0};
  toks.forEach(tok=>{
    const w=tok.toLowerCase().replace(/[.,;]+$/,"");
    if(!w)return;
    if(w==="paid"){res.paid=true;return;}
    if(w==="online"){res.mode="Online";return;}
    if(w==="in-person"||w==="inperson"||w==="f2f"){res.mode="In-person";return;}
    if(w==="today"){res.date=isoD(today());return;}
    if(w==="yesterday"){res.date=isoD(addDays(today(),-1));return;}
    if(w==="tomorrow"){res.date=isoD(addDays(today(),1));return;}
    if(wd[w]!=null){const t=today();let diff=wd[w]-t.getDay();
      if(diff>3)diff-=7; if(diff<-3)diff+=7;
      res.date=isoD(addDays(t,diff));return;}
    let m2=w.match(/^(\d{1,2}):(\d{2})$/);
    if(m2){res.time=String(+m2[1]).padStart(2,"0")+":"+m2[2];return;}
    m2=w.match(/^(\d{1,2})(am|pm)$/);
    if(m2){let h=(+m2[1])%12;if(m2[2]==="pm")h+=12;res.time=String(h).padStart(2,"0")+":00";return;}
    m2=w.match(/^\d{4}-\d{2}-\d{2}$/);
    if(m2&&parseD(w)){res.date=w;return;}
    m2=w.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if(m2){const t=today();let y=m2[3]?+m2[3]:t.getFullYear();if(y<100)y+=2000;
      res.date=y+"-"+String(+m2[2]).padStart(2,"0")+"-"+String(+m2[1]).padStart(2,"0");return;}
    if(!res.client){
      const exact=codes.filter(c=>c.toLowerCase()===w);
      const pref=exact.length?exact:codes.filter(c=>c.toLowerCase().startsWith(w));
      const cand=pref.length?pref:codes.filter(c=>c.toLowerCase().includes(w));
      if(cand.length===1){res.client=cand[0];return;}
      if(cand.length>1){res.clientAmbig=cand.slice(0,4);return;}
    }
    if(!res.location){
      const lm=locs.find(L=>{const ll=L.toLowerCase();return ll===w||ll.startsWith(w)||ll.split(/\s+/).indexOf(w)>=0;});
      if(lm){res.location=lm;return;}
    }
    res.unmatched.push(tok);
  });
  return res;
}

  const sg=suggestFor(p.client);
  return {_id:uid(),client:p.client,num:sg.num,date:p.date||isoD(today()),time:p.time||sg.time,

  const inp=host.querySelector("#ql"),out=host.querySelector("#qlout"),btn=host.querySelector("#qlGo");
  let cur=null,armed=false;

    const p=parseQuickLog(inp.value);

    if(!p){out.innerHTML='';btn.style.display="none";cur=null;return;}
    let h="";

/* ============ Swipe-to-mark-paid ============ */
function attachSwipe(container,refresh){
  container.querySelectorAll(".swrow").forEach(w=>{
    const over=w.querySelector(".swover");const id=w.dataset.swipe;
    let sx=null,sy=null,dx=0,drag=false;
    over.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;dx=0;drag=false;over.classList.remove("snap");});
    over.addEventListener("pointermove",e=>{if(sx==null)return;
      const mx=e.clientX-sx,my=e.clientY-sy;
      if(!drag){if(Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my)*1.2){drag=true;try{over.setPointerCapture(e.pointerId);}catch(_){}}else return;}
      dx=Math.min(0,Math.max(-130,mx));over.style.transform="translateX("+dx+"px)";});
    const end=async()=>{if(sx==null)return;
      const fired=drag&&dx<-80;sx=null;
      over.classList.add("snap");over.style.transform="translateX(0)";
      if(drag){const block=ev=>{ev.stopPropagation();ev.preventDefault();};
        over.addEventListener("click",block,true);setTimeout(()=>over.removeEventListener("click",block,true),400);}
      drag=false;
      if(fired){const ss=S.sessions.find(z=>z._id===id);
        if(ss&&!ss.paidDate){ss.paidDate=isoD(today());
          const amt=derive(ss).rate||0;
          gameNoteBatch({cleared:1,amount:amt});
          await commit("Marked paid (swipe): "+ss.client+" "+ss.date);renderTabs();
          Sfx.complete();Confetti.burst(16,{up:8,spread:0.8});
          toast(ss.client+" marked paid ✓");
          if(refresh)refresh();}}};
    over.addEventListener("pointerup",end);over.addEventListener("pointercancel",end);
  });
}

function receiptRows(c,per){

  else if(per==="lastmonth"){from=new Date(t.getFullYear(),t.getMonth()-1,1);to=eomonth(from);label=from.toLocaleDateString("en-GB",{month:"long",year:"numeric"});}
  else if(per==="taxyear"){const b=tyBounds(curTaxYear());from=b.start;to=b.end;label="Tax year "+curTaxYear();}
  else label="All sessions";

    .filter(x=>{const d=parseD(x.s.date);if(!d)return false;if(from&&(d<from||d>to))return false;return d<=t&&!isLateCancel(x.s);})
    .sort((a,b)=>parseD(a.s.date)-parseD(b.s.date));
  return {rows,label};
}

function yearHeatmapHTML(){

  S.sessions.forEach(s=>{const d=parseD(s.date);if(d&&d<=t)counts[isoD(d)]=(counts[isoD(d)]||0)+1;});
  const start=weekMonday(addDays(t,-364));

      cells+='<i class="'+cls+'" title="'+fmtDM(d)+': '+n+' session'+(n===1?'':'s')+'"></i>';}
    d=addDays(d,1);
    if(d>t&&d.getDay()===1)break;
  }
  return '<div class="hmgrid">'+cells+'</div><div class="hmleg">Less <i style="background:var(--soft)"></i><i style="background:color-mix(in srgb,var(--brand) 32%,var(--soft))"></i><i style="background:color-mix(in srgb,var(--brand) 62%,var(--soft))"></i><i style="background:var(--brand)"></i> More</div>';
}
function incomeForecast(){
  const t=today();const der=S.sessions.map(s=>({s,d:derive(s)}));
  const mStart=new Date(t.getFullYear(),t.getMonth(),1),mEnd=eomonth(t);
  const mtd=der.filter(x=>{const d=parseD(x.s.date);return d&&d>=mStart&&d<=t;}).reduce((a,x)=>a+(x.d.rate||0),0);
  const booked=der.filter(x=>{const d=parseD(x.s.date);return d&&d>t&&d<=mEnd;}).reduce((a,x)=>a+(x.d.rate||0),0);
  const hFrom=addDays(weekMonday(t),-56),hTo=weekMonday(t);
  const hist=der.filter(x=>{const d=parseD(x.s.date);return d&&d>=hFrom&&d<hTo;}).reduce((a,x)=>a+(x.d.rate||0),0)/56;
  const remDays=Math.max(0,Math.round((mEnd-t)/86400000));
  const proj=Math.round(mtd+Math.max(booked,hist*remDays));
  const lmStart=new Date(t.getFullYear(),t.getMonth()-1,1),lmEnd=eomonth(lmStart);
  const lastM=der.filter(x=>{const d=parseD(x.s.date);return d&&d>=lmStart&&d<=lmEnd;}).reduce((a,x)=>a+(x.d.rate||0),0);
  const delta=lastM>0?Math.round((proj-lastM)/lastM*100):null;
  const dayN=[0,0,0,0,0,0,0];
  der.forEach(x=>{const d=parseD(x.s.date);if(d&&d<=t&&(t-d)/86400000<=182&&!isLateCancel(x.s))dayN[d.getDay()]++;});
  const bestI=dayN.indexOf(Math.max(...dayN));
  const busiest=Math.max(...dayN)>0?["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][bestI]:"—";
  return {mtd:Math.round(mtd),proj,lastM:Math.round(lastM),delta,busiest};
}

/* ===== Encrypted backups (AES-256-GCM via WebCrypto, passphrase-derived key) =====
   The passphrase is never stored. A non-extractable AES key derived from it (PBKDF2, 210k iterations)
   is kept in IndexedDB so backups can be written silently; the backup FILE can only be read with the
   passphrase, so it's safe in iCloud/Drive/email. Restoring prompts for the passphrase. */
const ENC_ITER=210000;
function bufToB64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64ToBuf(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
async function encDeriveKey(pass,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ENC_ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
function encReady(){try{return _db&&localStorage.getItem("tt_enc")==="on";}catch(e){return false;}}
async function encSetup(pass){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await encDeriveKey(pass,salt);
  await kvPut("encKey",key);await kvPut("encSalt",bufToB64(salt.buffer));
  try{localStorage.setItem("tt_enc","on");}catch(e){}
}
async function encDisable(){await kvPut("encKey",null);await kvPut("encSalt",null);await kvPut("encHandle",null);
  try{localStorage.removeItem("tt_enc");}catch(e){}}
async function encPayload(){
  const key=await kvGet("encKey"),saltB=await kvGet("encSalt");
  if(!key||!saltB)throw new Error("no passphrase set");
  const audit=_db?await auditAll():[];
  const plain=JSON.stringify({app:"TherapyTracker",version:1,exportedAt:new Date().toISOString(),state:S,audit:audit.slice(-800)});
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(plain));
  return JSON.stringify({app:"TherapyTracker",enc:1,cipher:"AES-256-GCM",kdf:"PBKDF2-SHA256",iter:ENC_ITER,salt:saltB,iv:bufToB64(iv.buffer),data:bufToB64(ct)});
}
async function encWriteToHandle(txt,interactive){
  const h=await kvGet("encHandle");if(!h)return false;
  try{
    let perm=await h.queryPermission({mode:"readwrite"});
    if(perm!=="granted"){if(!interactive)return false;perm=await h.requestPermission({mode:"readwrite"});}
    if(perm!=="granted")return false;
    const w=await h.createWritable();await w.write(txt);await w.close();return true;
  }catch(e){return false;}
}
async function encBackupNow(){
  try{const txt=await encPayload();
    const wrote=await encWriteToHandle(txt,true);
    if(!wrote)download("therapy-tracker-backup-"+isoD(today())+".enc.json",txt);
    markBackedUp();toast(wrote?"Encrypted backup saved to your file":"Encrypted backup downloaded");
  }catch(e){toast("Backup failed: "+e.message);Sfx.error();}
}
let _autoBkT=null;
function autoEncBackup(){
  if(!encReady())return;
  clearTimeout(_autoBkT);
  _autoBkT=setTimeout(async()=>{try{
    const txt=await encPayload();
    if(await encWriteToHandle(txt,false)){markBackedUp();}
  }catch(e){}},2000);
}

function encPromptSetup(after){

/* ===== Import validation (schema + sanity report before restore) ===== */
function validateImport(st){
  const problems=[];
  if(!st||typeof st!=="object")return {ok:false,problems:["Not a recognisable backup file"]};
  if(!Array.isArray(st.sessions)||!Array.isArray(st.clients))return {ok:false,problems:["Missing sessions or clients — not a Therapy Tracker backup"]};
  const badDates=st.sessions.filter(s=>!s||!s.date||!/^\d{4}-\d{2}-\d{2}$/.test(String(s.date))).length;
  if(badDates)problems.push(badDates+" session(s) with missing/invalid dates");
  const codeSet=new Set((st.clients||[]).map(c=>(c&&c.code||"").toLowerCase()));
  const orphans=st.sessions.filter(s=>s&&s.client&&!codeSet.has(String(s.client).toLowerCase())).length;
  if(orphans)problems.push(orphans+" session(s) referencing clients not in the backup");
  const dupIds={};let dups=0;
  st.sessions.forEach(s=>{if(s&&s._id){if(dupIds[s._id])dups++;dupIds[s._id]=1;}});
  if(dups)problems.push(dups+" duplicate internal id(s)");
  return {ok:true,problems,counts:{sessions:st.sessions.length,clients:st.clients.length,
    supervision:(st.supervision||[]).length,rooms:(st.rooms||[]).length}};
}
function exportCSV(){
  const cols=["client","num","date","time","mode","location","room","invoice","paidDate","notes","roomPaid","rate","clientPaid","overdue","roomRate","roomDue","status","taxYear","week"];
  const rows=[cols.join(",")];
  S.sessions.slice().sort((a,b)=>parseD(a.date)-parseD(b.date)).forEach(s=>{const d=derive(s);
    const r=cols.map(c=>{let v=(c in s)?s[c]:d[c];if(c==="clientPaid")v=d.clientPaid?"Y":"N";if(c==="overdue")v=d.overdue?"Y":"N";
      v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v});
    rows.push(r.join(","))});
  download("therapy-sessions-"+isoD(today())+".csv",rows.join("\n"),"text/csv");toast("Sessions CSV downloaded")}
function exportSupervisionCSV(){
  const cols=["date","supervisor","clientHrsReviewed","cost","clientsDiscussed","taxYear"];
  const rows=[cols.join(",")];
  (S.supervision||[]).slice().sort((a,b)=>parseD(a.date)-parseD(b.date)).forEach(s=>{
    const rec={date:s.date||"",supervisor:s.supervisor||"",clientHrsReviewed:(+s.count||1),cost:(+s.cost||0),
      clientsDiscussed:(s.clients||[]).join("; "),taxYear:s.date?taxYear(s.date):""};
    const r=cols.map(c=>{let v=rec[c];v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v});
    rows.push(r.join(","))});
  download("therapy-supervision-"+isoD(today())+".csv",rows.join("\n"),"text/csv");toast("Supervision CSV downloaded")}
function importJSON(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{let o=JSON.parse(rd.result);
    if(o&&o.enc===1){
      const pass=prompt("This backup is encrypted. Enter its passphrase:");
      if(!pass)return;
      try{
        const key=await encDeriveKey(pass,new Uint8Array(b64ToBuf(o.salt)));
        const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(b64ToBuf(o.iv))},key,b64ToBuf(o.data));
        o=JSON.parse(new TextDecoder().decode(pt));
      }catch(err2){alert("Wrong passphrase or corrupted file — nothing changed.");return;}
    }
    const st=o.state||o;
    const rep=validateImport(st);
    if(!rep.ok)throw new Error(rep.problems.join("; "));
    let msg="Restore this backup?\n\n"+rep.counts.sessions+" sessions · "+rep.counts.clients+" clients · "+rep.counts.supervision+" supervision · "+rep.counts.rooms+" rooms";
    if(rep.problems.length)msg+="\n\n⚠️ Checks found:\n– "+rep.problems.join("\n– ");
    msg+="\n\nCurrent data is kept as a restore point.";
    if(!confirm(msg))return;
    S=normalize(st);
    await commit("Restored backup ("+(S.sessions.length)+" sessions)");markBackedUp();
    applySettings();toast("Backup restored");go("home");
  }catch(err){alert("Could not import: "+err.message)}};rd.readAsText(f);e.target.value="";}
async function showSnapshots(){if(!_db){toast("Restore points need storage");return}
  const snaps=await snapAll();snaps.sort((a,b)=>b.id-a.id);
  const body=el('<div></div>');
  body.innerHTML='<p class="muted small">Every change creates a restore point. Tap to roll back.</p>'+
    snaps.slice(0,80).map(s=>`<div class="list-item" data-id="${s.id}"><div class="li-main">
      <div class="li-title">${esc(s.label)}</div><div class="li-sub">${new Date(s.ts).toLocaleString("en-GB")} · ${s.data.sessions.length} sessions</div></div>
      <button class="btn sm sec">Restore</button></div>`).join("");
  body.querySelectorAll(".list-item").forEach(li=>li.onclick=async()=>{const id=+li.dataset.id;const snap=snaps.find(x=>x.id===id);
    if(!confirm("Roll back to: "+snap.label+"?"))return;S=normalize(clone(snap.data));await commit("Rolled back to: "+snap.label);
    applySettings();closeSheet();toast("Restored");go("home")});
  openSheet("Restore points",body);
}

/* ---- generic step-flow overlay, shared by setup and the tour ---- */
let _flow=null;
function flowRoot(){
  let r=document.getElementById("ovRoot");
  if(r)return r;
  r=el('<div class="ov" id="ovRoot">'+
    '<div class="ovtop"><span class="ovttl" id="ovTtl"></span><button class="ovskip" id="ovSkip">Skip</button></div>'+
    '<div class="ovdots" id="ovDots"></div>'+
    '<div class="ovbody" id="ovScroll"><div class="ovinner" id="ovBody"></div></div>'+
    '<div class="ovfoot"><div class="ovinner ovbtns">'+
      '<button class="btn ghost" id="ovBack">Back</button><button class="btn" id="ovNext">Continue</button>'+
    '</div></div></div>');
  document.body.appendChild(r);
  r.querySelector("#ovBack").onclick=()=>{if(_flow)flowGo(_flow.i-1);};
  r.querySelector("#ovNext").onclick=()=>flowNext();
  r.querySelector("#ovSkip").onclick=()=>{if(_flow&&_flow.onSkip)_flow.onSkip();};
  return r;
}
function flowStart(cfg){_flow=Object.assign({i:0},cfg);
  const r=flowRoot();r.classList.add("show");flowGo(0);}
function flowClose(){const r=document.getElementById("ovRoot");if(r)r.classList.remove("show");_flow=null;}
function flowGo(i){
  if(!_flow)return;
  const steps=_flow.steps; i=Math.max(0,Math.min(steps.length-1,i)); _flow.i=i;
  const st=steps[i], r=flowRoot();
  r.querySelector("#ovTtl").textContent=_flow.title;
  r.querySelector("#ovDots").innerHTML=steps.map((_,n)=>'<i class="'+(n===i?"on":(n<i?"done":""))+'"></i>').join("");
  const body=r.querySelector("#ovBody");
  body.innerHTML='<div class="ovhero">'+(st.emoji||"✨")+'</div>'+
    '<h2 class="ovh">'+esc(st.h||"")+'</h2>'+
    (st.sub?'<p class="ovsub">'+st.sub+'</p>':'')+
    '<div id="ovStep">'+(st.html||"")+'</div>';
  if(st.mount)st.mount(body.querySelector("#ovStep"));
  r.querySelector("#ovBack").style.visibility=i>0?"visible":"hidden";
  r.querySelector("#ovNext").textContent=(i===steps.length-1)?(_flow.doneLabel||"Finish"):(st.nextLabel||"Continue");
  r.querySelector("#ovSkip").style.display=_flow.onSkip?"":"none";
  r.querySelector("#ovScroll").scrollTop=0;
}
function flowNext(){
  if(!_flow)return;
  const st=_flow.steps[_flow.i];
  if(st.validate&&st.validate()===false)return;
  if(st.onLeave)st.onLeave();
  if(_flow.i===_flow.steps.length-1){const done=_flow.onDone;flowClose();if(done)done();}
  else flowGo(_flow.i+1);
}

    '<p class="prev">Encrypts backups with AES-256 so they’re safe to keep in iCloud, Drive or email. <b>Lose the passphrase and the file can’t be opened</b> — by anyone.</p>';
    host.querySelector("#spDays").oninput=e=>w.bkDays=Math.max(1,Math.round(+e.target.value)||7);
    host.querySelector("#spActs").oninput=e=>w.bkActs=Math.max(1,Math.round(+e.target.value)||25);
    const eb=host.querySelector("#spEnc");
    const paint=()=>{eb.textContent=encReady()?"🔐 Passphrase set ✓ — change it":"🔐 Add a backup passphrase (optional)";};
    eb.onclick=()=>encPromptSetup(paint);paint();
  }};}

/* apply the room rows the user built: rename → update → create → prune */
function setupApplyRooms(w){
  if(!w.rooms)return;
  const list=w.rooms.map(r=>({loc:(r.loc||"").trim(),rate:+r.rate||0,due:r.due||"n/a",orig:r.orig})).filter(r=>r.loc);
  if(!list.length)return;
  S.roomRateHistory=S.roomRateHistory||[];
  const fresh=S.sessions.length===0; // nothing logged yet, so cost history can start from the beginning of time
  const find=loc=>S.rooms.find(x=>(x.location||"").toLowerCase()===(loc||"").toLowerCase());
  list.forEach(r=>{
    const ex=find(r.loc)||(r.orig?find(r.orig):null);
    if(ex){
      const before=ex.location||"";
      if(before.toLowerCase()!==r.loc.toLowerCase()){ // rename: carry cost history and existing sessions across
        S.roomRateHistory.forEach(h=>{if((h.location||"").toLowerCase()===before.toLowerCase())h.location=r.loc;});
        S.sessions.forEach(s=>{if((s.location||"").toLowerCase()===before.toLowerCase())s.location=r.loc;});
        ex.location=r.loc;
      }
      ex.due=r.due;
      if(Math.abs((+effRoomRate(r.loc,isoD(today()))||0)-r.rate)>0.001){
        ex.rate=r.rate;
        if(fresh){S.roomRateHistory=S.roomRateHistory.filter(h=>(h.location||"").toLowerCase()!==r.loc.toLowerCase());
          S.roomRateHistory.push({_id:uid(),location:r.loc,effectiveFrom:"2000-01-01",rate:r.rate});}
        else S.roomRateHistory.push({_id:uid(),location:r.loc,effectiveFrom:isoD(today()),rate:r.rate});
      }
    }else{
      S.rooms.push({_id:uid(),location:r.loc,rate:r.rate,due:r.due});
      S.roomRateHistory.push({_id:uid(),location:r.loc,effectiveFrom:"2000-01-01",rate:r.rate});
    }
  });
  /* drop rooms the user removed — unless a session still points at them — and their now-orphaned cost history */
  const keep=new Set(list.map(r=>r.loc.toLowerCase()));
  const used=new Set(S.sessions.map(s=>(s.location||"").toLowerCase()).filter(Boolean));
  const alive=k=>keep.has(k)||used.has(k);
  S.rooms=S.rooms.filter(r=>alive((r.location||"").toLowerCase()));
  S.roomRateHistory=S.roomRateHistory.filter(h=>alive((h.location||"").toLowerCase()));
}

async function setupSave(w,opts){
  const sg=settings();
  sg.practiceName=(w.name||"").trim()||"Therapy Tracker";
  sg.practiceTagline=(w.tagline||"").trim();
  sg.palette=w.palette;
  sg.features={};FEATURES.forEach(f=>{sg.features[f.k]=featureOn(w,f.k)&&(!f.dep||featureOn(w,f.dep));});
  sg.onboarded=true; sg.onboardedAt=isoD(today());
  sg.setupRuns=(sg.setupRuns||0)+1;
  if(!opts||!opts.skipRooms)setupApplyRooms(w);
  applyPalette(w.palette);setTheme(w.theme);Sfx.set(w.sound);
  setDefaultRate(+w.rate||0);setPensionPcm(+w.pension||0);
  try{localStorage.setItem("tt_backup_days",String(w.bkDays));localStorage.setItem("tt_backup_acts",String(w.bkActs));}catch(e){}
  await commit("Setup: practice “"+sg.practiceName+"”");
  applySettings();go("home");updateBackupBanner();
}

function startSetup(opts){
  opts=opts||{};
  const sg=settings();
  const rerun=!!opts.rerun;
  /* rooms are only offered on a genuinely fresh start — once sessions exist they belong in Clients › Rooms */
  const withRooms=!rerun||S.sessions.length===0;
  const w={
    name:(sg.practiceName==="Therapy Tracker")?"":(sg.practiceName||""),
    tagline:sg.practiceTagline||"",
    palette:sg.palette||curPalette(),
    theme:themePref(), sound:Sfx.on,
    features:Object.assign({},sg.features||{}),
    rate:defaultRate(), pension:pensionPcm(),
    bkDays:backupDaysThreshold(), bkActs:backupActsThreshold(),
    rooms:null, tour:!rerun
  };
  const welcome={emoji:"👋", h:rerun?"Let’s run through setup again":"Welcome to Therapy Tracker",
    sub:rerun?"Your clients, sessions and payments stay exactly as they are — this only touches how the app looks and behaves."
      :"A private, offline record of your practice: sessions, clients, rooms, supervision and money. Takes about two minutes to set up.",
    html:ovPoints([
      ["🔒","Private by design","Everything stays on this device. No account, no cloud, no analytics."],
      ["✈️","Works with no signal","Install it to your Home Screen and it opens like a normal app, offline."],
      ["🧾","Replaces the spreadsheet","Fees, room costs, unpaid sessions and tax estimates all work themselves out."]
    ])};
  const steps=[welcome,stepPractice(w),stepLook(w),stepFeatures(w)];
  if(withRooms)steps.push(stepRooms(w));
  steps.push(stepMoney(w),stepBackup(w),stepDone(w));
  flowStart({
    title:rerun?"Setup (re-run)":"Set up Therapy Tracker",
    steps, doneLabel:"Finish setup",
    onSkip:async()=>{
      if(!confirm("Skip setup?\n\nSensible defaults will be used and you can run this again any time from ⚙ Settings."))return;
      flowClose();await setupSave(w,{skipRooms:true});toast("Setup skipped — defaults applied");
    },
    onDone:async()=>{
      await setupSave(w,{skipRooms:!withRooms});
      if(w.tour!==false)setTimeout(()=>startTour(),260);
      else celebrate({emoji:"🎉",title:"You’re all set",sub:"Tap ＋ to log your first session.",level:"big",sound:"fanfare"});
    }
  });
}

/* re-running setup is behind a deliberate, typed confirmation */
function confirmRerunSetup(){
  const body=el('<div></div>');
  const withRooms=S.sessions.length===0;
  body.innerHTML='<div class="vmsg warn">⚠️ This restarts the <b>whole first-time setup</b> from the beginning.</div>'+
    '<p class="small" style="margin:12px 0 4px"><b>It will overwrite:</b></p>'+
    '<div class="acc-work"><div>• Practice name and strapline</div><div>• Colour scheme, light/dark and sound</div>'+
      '<div>• Which features are switched on</div><div>• Default session fee and monthly pension</div>'+
      '<div>• Backup reminder thresholds</div>'+(withRooms?'<div>• Your rooms and their costs</div>':'')+'</div>'+
    '<p class="small" style="margin:14px 0 4px"><b>It will not touch:</b></p>'+
    '<div class="acc-work"><div>• Clients, sessions or supervision entries</div><div>• Payments, fee history or room cost history</div>'+
      '<div>• Your backups or restore points</div></div>'+
    (withRooms?'<div class="vmsg err" style="margin-top:14px">You have no sessions logged, so setup will also rebuild your <b>rooms list</b>. Rooms you remove there are gone from the list.</div>'
      :'<div class="vmsg ok" style="margin-top:14px">You already have sessions logged, so the rooms step will be <b>skipped</b> — manage rooms in Clients › Rooms instead.</div>')+
    '<p class="small muted mt">A restore point is saved before anything changes, and ↩︎ Undo will bring your settings back.</p>'+
    '<button class="btn sec full mt" id="rsExp">⤓ Export a backup first</button>'+
    '<label style="margin-top:16px">Type <b>RESET SETUP</b> to confirm</label>'+
    '<input id="rsIn" placeholder="RESET SETUP" autocapitalize="characters" autocomplete="off" spellcheck="false">'+
    '<button class="btn danger full mt" id="rsGo" disabled>Re-run setup</button>'+
    '<button class="btn ghost full mt" id="rsNo">Cancel</button>';
  const inp=body.querySelector("#rsIn"),go2=body.querySelector("#rsGo");
  inp.oninput=()=>{const ok=inp.value.trim().toUpperCase()==="RESET SETUP";go2.disabled=!ok;
    go2.style.opacity=ok?"1":".5";};
  go2.style.opacity=".5";
  body.querySelector("#rsExp").onclick=exportJSON;
  body.querySelector("#rsNo").onclick=closeSheet;
  go2.onclick=()=>{if(go2.disabled)return;closeSheet();startSetup({rerun:true});};
  openSheet("Re-run first-time setup",body);
}

/* ============ Init ============ */
(async function(){
  try{await openDB();await loadState();}
  catch(e){ // fallback to localStorage
    try{const ls=localStorage.getItem("tt_state");S=ls?JSON.parse(ls):clone(window.SEED);}catch(_){S=clone(window.SEED);}
    if(!S.sessions)S=clone(window.SEED);
  }
  initBackupTracking();
  const bk=document.getElementById("bkNow");if(bk)bk.onclick=exportJSON;
  applySettings();
  go("home");
  if(!settings().onboarded)setTimeout(()=>startSetup(),120); // first run on this device
})();
