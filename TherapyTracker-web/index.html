<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#5C7A6D" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#1A2220" media="(prefers-color-scheme: dark)"/>
<title>Therapy Tracker</title>
<script>(function(){try{var t=localStorage.getItem('tt_theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
:root{
  color-scheme:light;
  --bg:#F7F9FA; --card:#FFFFFF; --soft:#EDF1EF; --ink:#1E2A26; --muted:#6E7E78; --line:#E6ECEA;
  --brand:#5C7A6D; --brand-dark:#46594F; --accent:#9A8C9E; --accent-ink:#6E5F73;
  --good:#4E7E63; --bad:#C25C49; --warn:#A8803F; --hi:#16A88E; --hi-ink:#0C6253;
  --shadow:0 1px 2px rgba(38,54,48,.05),0 3px 10px rgba(38,54,48,.05);
  --radius:16px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1A2220; --card:#222D2A; --soft:#2A3733; --ink:#E6EDEA; --muted:#9CADA7; --line:#31403B;
  --brand:#6E9384; --brand-dark:#AFC8BC; --accent:#B0A2B4; --accent-ink:#C7BBCB;
  --good:#6FAE86; --bad:#E08068; --warn:#CBA66A; --hi:#3FD6BB; --hi-ink:#A6F0E2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);transition:background .25s,color .25s}
h1,h2,h3{margin:0 0 .4em}
a{color:var(--brand)}
.app{max-width:780px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;letter-spacing:.01em}
header.top .ty{font-size:12px;opacity:.95;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.themebtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:11px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.themebtn:active{transform:scale(.94)}
main{flex:1;padding:18px 16px 96px}
.bkbar{display:none;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--warn) 16%,var(--card));border-bottom:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  color:var(--ink);padding:9px 16px;font-size:13px}
.bkbar.show{display:flex}
.bkbar .bkmsg{flex:1;min-width:170px;line-height:1.4}
.bkbar .bkdetail{color:var(--muted)}
.bkbar .btn{white-space:nowrap}
.view{display:none}
.view.active{display:block;animation:f .2s ease}
@keyframes f{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{font-size:14px;color:var(--brand-dark);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.kpi .v{font-size:23px;font-weight:700;color:var(--brand-dark)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)}
.kpi.clk{cursor:pointer} .kpi.clk:active{transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center}
.btn{appearance:none;border:0;border-radius:13px;padding:13px 17px;font-size:15px;font-weight:600;
  background:var(--brand);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:scale(.98)}
.btn.sec{background:var(--soft);color:var(--brand-dark);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:40;
  width:60px;height:60px;border-radius:50%;color:#fff;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:0;
  box-shadow:0 8px 20px rgba(92,122,109,.45);background:var(--brand)}
.fab svg{width:26px;height:26px;display:block;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:scale(.95)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.chip.y{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.chip.n{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.chip.na{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.chip.f{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent-ink)}
.chip.s{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand-dark)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.list-item{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item:active{background:var(--soft)}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;font-size:15px}
.li-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-right{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .mt{margin-top:12px} .mb{margin-bottom:12px}
.center{text-align:center}
.search{position:relative;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:3px;overflow:auto}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--card);color:var(--brand-dark);box-shadow:var(--shadow)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:35;
  background:color-mix(in srgb,var(--card) 70%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);
  border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  display:flex;justify-content:space-around;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));max-width:780px;margin:0 auto}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;
  flex:1;color:var(--muted);padding:7px 2px 6px;cursor:pointer;font-weight:600;border-radius:16px;transition:color .2s,background .2s}
nav.tabs button>span:last-child{font-size:10px;line-height:1.1;text-align:center;overflow-wrap:anywhere}
nav.tabs button .ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
nav.tabs button .ic svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brand);
  background:color-mix(in srgb,var(--brand) 15%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 26%,transparent),inset 0 1px 0 color-mix(in srgb,#ffffff 55%,transparent),0 1px 2px rgba(0,0,0,.05)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(15,22,20,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-inner{background:var(--bg);width:100%;max-width:780px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .24s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;z-index:2}
.sheet-head h2{flex:1;margin:0;font-size:17px;text-transform:none;color:var(--ink)}
.sheet-inner h3{font-size:14px;margin:0 0 4px;color:var(--brand-dark)}
.taxlink{color:var(--brand);font-weight:700;cursor:pointer;border-bottom:1px dashed var(--brand)}
.x{font-size:22px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 8px}
.suggest{font-size:11px;color:var(--accent-ink);font-weight:700;margin-left:6px}
.hint{background:color-mix(in srgb,var(--brand) 9%,var(--card));border:1px solid color-mix(in srgb,var(--brand) 22%,var(--card));border-radius:12px;padding:10px 12px;font-size:13px;color:var(--brand-dark);margin:10px 0}
.vbanner{margin:10px 0 2px}
.vmsg{border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:8px;font-weight:600;line-height:1.35}
.vmsg.err{background:color-mix(in srgb,var(--bad) 14%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.vmsg.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}
.vmsg.ok{background:color-mix(in srgb,var(--good) 14%,var(--card));border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--good)}
.prev{font-size:11px;color:var(--muted);margin-top:3px}
.acc-work{margin-top:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:12.5px;line-height:1.75;color:var(--ink)}
.acc-work div{margin:1px 0} .acc-work b{font-weight:700}
.svgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px -4px 0}
.svgwrap svg{display:block}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.calnav b{font-size:16px;color:var(--brand-dark)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:10px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cal .cell{min-height:56px;border:1px solid var(--line);border-radius:11px;padding:4px 5px;font-size:11px;background:var(--card);position:relative;cursor:pointer;color:var(--muted)}
.cal .cell.empty{background:transparent;border:0;cursor:default}
.cal .cell.today{border-color:var(--hi);box-shadow:0 0 0 1.5px var(--hi)}
.cal .cell.sup{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cal .cell.today.sup{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--hi),inset 0 0 0 2px var(--accent)}
.cal .cell:active{background:var(--soft)}
.cal .cnt{position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:#fff;background:var(--brand);border-radius:8px;padding:0 5px;line-height:15px}
.cal .cnt.due{background:var(--bad)}
.cal .cc{display:block;margin-top:16px;font-size:9px;color:var(--brand-dark);white-space:normal;line-height:1.3;word-break:break-word;font-weight:600}
.payrow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line)}
.payrow input[type=checkbox]{width:23px;height:23px;flex:none;accent-color:var(--brand)}
.payrow input[type=date]{width:135px;padding:8px;font-size:13px;flex:none}
.payrow .li-main{flex:1;min-width:0;cursor:pointer}
.paybar{position:sticky;top:0;background:var(--bg);z-index:2;padding:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin:10px 0 2px;font-size:12px;color:var(--muted)}
.legend .lgi{display:inline-flex;align-items:center;gap:5px}
.legend .lgi i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .lgi i.line{width:18px;height:0;border-top:3px solid var(--hi);border-radius:0}
.legend .lgi i.dash{width:18px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.grphead{background:var(--soft);color:var(--brand-dark);font-weight:700;font-size:12px;padding:8px 10px;border-radius:8px;margin:12px 0 2px}
.rawscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#rtable{font-size:12px;white-space:nowrap;min-width:100%}
#rtable th{cursor:pointer;position:sticky;top:0;background:var(--card);user-select:none}
#rtable td,#rtable th{padding:7px 9px}
#colsBox{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 10px}
.colchk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink);font-weight:500}
.colchk input[type=checkbox]{width:18px;height:18px;flex:none;margin:0;accent-color:var(--brand)}
optgroup{font-size:12px;color:var(--muted)} optgroup option{font-size:16px;color:var(--ink)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;
  padding:11px 18px;border-radius:24px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast.show{opacity:1}
.badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--card)}
summary{font-weight:600;cursor:pointer}
.audit-row{font-size:12.5px;padding:7px 2px;border-bottom:1px solid var(--line);color:var(--muted)}
.audit-row b{color:var(--ink)}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
  body{padding-left:236px}
  nav.tabs{flex-direction:column;justify-content:flex-start;align-items:stretch;top:0;bottom:0;left:0;right:auto;
    width:236px;max-width:236px;margin:0;background:var(--brand);border-top:0;border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 20px) 12px 20px;gap:5px}
  nav.tabs::before{content:"⬡ Therapy Tracker";display:block;color:#fff;font-weight:700;font-size:16px;padding:6px 14px 16px;opacity:.96}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;width:100%;color:rgba(255,255,255,.82);
    padding:12px 14px;border-radius:12px;font-size:14.5px}
  nav.tabs button .ic{width:22px;height:22px}
  nav.tabs button .ic svg{width:21px;height:21px}
  nav.tabs button>span:last-child{font-size:14.5px;text-align:left;flex:1}
  nav.tabs button.on{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .app{max-width:920px;margin:0 auto}
  header.top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
  header.top .ty{background:var(--soft);color:var(--muted)}
  header.top .themebtn{background:var(--soft);color:var(--ink)}
  main{padding:22px 26px 60px}
  .fab{bottom:26px;right:26px}
  .sheet{align-items:center}
  .sheet-inner{border-radius:18px;max-width:640px;max-height:88vh}
}

/* ====================== Gamification & celebration FX ====================== */
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:80;display:none}
#confetti.on{display:block}
.celebr{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;pointer-events:none;padding:24px}
.celebr.show{display:flex}
.celebr .cb{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 30px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.4),0 0 0 1px color-mix(in srgb,var(--brand) 20%,transparent);max-width:340px;
  transform:scale(.6);opacity:0;animation:pop-in .55s cubic-bezier(.18,1.4,.5,1) forwards;position:relative;overflow:hidden}
.celebr .cb::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 80%,color-mix(in srgb,var(--brand) 35%,transparent) 88%,transparent 96%);
  animation:sweep 2.4s linear infinite;opacity:.5;pointer-events:none}
.celebr .cb>*{position:relative;z-index:1}
.celebr .cemoji{font-size:62px;line-height:1;display:block;margin-bottom:6px;animation:bounce-emoji 1s ease 1}
.celebr .ctitle{font-size:21px;font-weight:800;color:var(--brand-dark);margin:6px 0 2px;letter-spacing:.01em}
.celebr .csub{font-size:14px;color:var(--muted);line-height:1.4}
.celebr .cribbon{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:var(--hi);padding:5px 12px;border-radius:20px}
@keyframes pop-in{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes bounce-emoji{0%{transform:translateY(0) scale(.6)}30%{transform:translateY(-16px) scale(1.18)}55%{transform:translateY(0) scale(1)}72%{transform:translateY(-7px)}100%{transform:translateY(0)}}
@keyframes sweep{to{transform:rotate(360deg)}}

/* floating +reward pill */
.floatpill{position:fixed;z-index:84;pointer-events:none;font-weight:800;font-size:16px;color:#fff;background:var(--hi);
  padding:6px 13px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:floatup 1.3s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.7);opacity:0}15%{transform:translateY(-6px) scale(1.05);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}

/* streak flame */
.streakcard{display:flex;align-items:center;gap:16px}
.flame{position:relative;width:50px;height:60px;flex:none}
.flame i{position:absolute;bottom:2px;left:50%;border-radius:0 50% 50% 50%;transform-origin:center bottom}
.flame .o{width:34px;height:42px;margin-left:-17px;background:linear-gradient(45deg,#ff3d3d,#ff8a1e 55%,#ffd23f);
  transform:rotate(45deg);animation:flick 1.5s ease-in-out infinite;filter:drop-shadow(0 -2px 9px rgba(255,120,24,.6))}
.flame .i{width:18px;height:24px;margin-left:-9px;bottom:7px;background:linear-gradient(45deg,#ffcf2e,#fff3b0);
  transform:rotate(45deg);animation:flick 1.05s ease-in-out infinite reverse}
.flame.cold .o{background:linear-gradient(45deg,#9aaaa4,#c2ccc8);filter:none;animation-duration:3s;opacity:.8}
.flame.cold .i{background:linear-gradient(45deg,#b7c2bd,#e3e9e6);animation-duration:3s}
.flame.risk .o{filter:drop-shadow(0 -2px 9px rgba(255,170,40,.7))}
@keyframes flick{0%,100%{transform:rotate(45deg) scale(1)}25%{transform:rotate(43deg) scaleY(1.09) scaleX(.96)}50%{transform:rotate(47deg) scaleY(1.04) scaleX(.98)}75%{transform:rotate(44deg) scaleY(1.07) scaleX(.97)}}
.streakwrap{flex:1;min-width:0}
.streaknum{font-size:34px;font-weight:800;color:var(--brand-dark);line-height:1}
.streaknum small{font-size:15px;font-weight:700;color:var(--muted)}
.streakmsg{font-size:13px;color:var(--muted);margin-top:3px}
.streakcard.bump .flame{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

/* goal progress rings */
.rings{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-around;margin-top:4px}
.ring{position:relative;width:104px;text-align:center}
.ring svg{display:block;margin:0 auto;transform:rotate(-90deg)}
.ring .rbg{stroke:var(--soft)}

.ring.done .rpct{color:var(--good)}
.ring .rpct .chk{font-size:24px}
.ring .rlab{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.25}
.ring.done svg{animation:ringpop .7s cubic-bezier(.18,1.4,.5,1)}
@keyframes ringpop{0%{transform:rotate(-90deg) scale(1)}45%{transform:rotate(-90deg) scale(1.12)}100%{transform:rotate(-90deg) scale(1)}}

/* badges / records */
.badgegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.bdg{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.bdg .be{font-size:24px;flex:none}
.bdg .bv{font-size:17px;font-weight:800;color:var(--brand-dark);line-height:1}

.bdg.locked{opacity:.55}
.bdg.fresh{animation:freshpop .8s cubic-bezier(.18,1.4,.5,1);border-color:color-mix(in srgb,var(--hi) 55%,transparent)}
@keyframes freshpop{0%{transform:scale(.85);box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 50%,transparent)}50%{transform:scale(1.04)}100%{transform:scale(1);box-shadow:0 0 0 0 transparent}}

/* count-up pulse */
.countup.tick{animation:ctick .25s ease}
@keyframes ctick{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* bulk "catch-up" rows (Incomplete tab) */
.irow{display:flex;flex-direction:column;gap:9px;padding:12px 6px;border-bottom:1px solid var(--line);border-radius:10px;transition:opacity .3s}
.irow:last-child{border-bottom:0}
.irow .itop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

@keyframes rowflash{0%{background:color-mix(in srgb,var(--good) 32%,transparent)}100%{background:transparent}}
.irow.cleared{opacity:.45}
.tgl{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:20px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;user-select:none;
  transition:transform .1s,background .15s,color .15s,border-color .15s}
.tgl:active{transform:scale(.93)}
.tgl .tbox{width:16px;height:16px;border-radius:5px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.tgl.on{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.tgl.on .tbox{background:var(--good);border-color:var(--good);color:#fff}
.tgl.pop{animation:tglpop .42s cubic-bezier(.18,1.5,.5,1)}
@keyframes tglpop{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
.bulkbar{position:sticky;top:0;background:var(--bg);z-index:2;padding:8px 0}
.bulkbar .bbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}

@keyframes readypulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}

/* sound toggle in header (reuses .themebtn) */

<script>
window.SEED = {"clients": [], "rooms": [{"location": "At home", "rate": 0, "due": "n/a"}, {"location": "London Bridge", "rate": 12.5, "due": "EOM"}, {"location": "Clapham", "rate": 16, "due": "EOW"}], "sessions": [], "supervision": [], "rateHistory": [], "roomRateHistory": [{"location": "At home", "effectiveFrom": "2000-01-01", "rate": 0}, {"location": "London Bridge", "effectiveFrom": "2000-01-01", "rate": 12.5}, {"location": "Clapham", "effectiveFrom": "2000-01-01", "rate": 16}], "clientCategories": [{"status": "Ongoing", "category": "Active"}, {"status": "Initial session booked", "category": "Active"}, {"status": "Active enquiry", "category": "Pipeline"}, {"status": "Paused", "category": "Pipeline"}, {"status": "Finished", "category": "Finished"}], "meta": {"shell": true}};

<script>
"use strict";
/* ============ Storage layer (IndexedDB + audit + snapshots) ============ */
const DBN="TherapyTrackerDB", DBV=1;
let _db=null;
function openDB(){return new Promise((res,rej)=>{
  const rq=indexedDB.open(DBN,DBV);
  rq.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains("state"))db.createObjectStore("state");
    if(!db.objectStoreNames.contains("audit"))db.createObjectStore("audit",{keyPath:"id",autoIncrement:true});
    if(!db.objectStoreNames.contains("snapshots"))db.createObjectStore("snapshots",{keyPath:"id",autoIncrement:true});
  };
  rq.onsuccess=e=>{_db=e.target.result;res(_db)};
  rq.onerror=e=>rej(e.target.error);
})}
function tx(store,mode){return _db.transaction(store,mode).objectStore(store)}
function pr(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function kvGet(k){return pr(tx("state","readonly").get(k))}
async function kvPut(k,v){return pr(tx("state","readwrite").put(v,k))}
async function auditAdd(rec){return pr(tx("audit","readwrite").add(rec))}
async function auditAll(){return pr(tx("audit","readonly").getAll())}
async function snapAdd(rec){return pr(tx("snapshots","readwrite").add(rec))}
async function snapAll(){return pr(tx("snapshots","readonly").getAll())}
async function snapDel(id){return pr(tx("snapshots","readwrite").delete(id))}

/* localStorage mirror as extra safety net */
function mirror(state){try{localStorage.setItem("tt_state",JSON.stringify(state));localStorage.setItem("tt_state_ts",new Date().toISOString())}catch(e){}}

/* ============ App state ============ */
let S=null; // {clients,rooms,sessions,supervision,rateHistory,clientCategories}
const MAX_SNAP=120;

function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function normalize(st){
  st.clients=st.clients||[];st.rooms=st.rooms||[];st.sessions=st.sessions||[];
  st.supervision=st.supervision||[];st.rateHistory=st.rateHistory||[];st.clientCategories=st.clientCategories||[];
  ["sessions","clients","supervision","rateHistory","rooms"].forEach(k=>st[k].forEach(x=>{if(x&&!x._id)x._id=uid()}));
  if(!st.roomRateHistory||!st.roomRateHistory.length){
    st.roomRateHistory=st.rooms.map(r=>({_id:uid(),location:r.location,effectiveFrom:"2000-01-01",rate:r.rate}));
  }
  st.roomRateHistory.forEach(x=>{if(!x._id)x._id=uid()});
  st.game=st.game||{}; st.game.activeWeeks=st.game.activeWeeks||[]; st.game.records=st.game.records||{};
  const rr=st.game.records; rr.longestStreak=rr.longestStreak||0; rr.mostClearedAtOnce=rr.mostClearedAtOnce||0; rr.biggestCatchup=rr.biggestCatchup||0;
  if(st.game.seenStreak==null)st.game.seenStreak=0;
  /* accreditation hours (Form 3A): supervision totals are entered manually; clinical hours come from logged sessions */
  st.accreditation=st.accreditation||{}; const ac=st.accreditation;
  if(ac.trainingSupHrs==null)ac.trainingSupHrs=108; if(ac.placementSupHrs==null)ac.placementSupHrs=0; if(ac.otherClinicalHrs==null)ac.otherClinicalHrs=0;
  /* one-time backfill: historical late cancellations were recorded in notes as "Y (late cancellation)" */
  st.meta=st.meta||{};
  if(!st.meta.lateCancelBackfill){
    st.sessions.forEach(s=>{if(s&&s.lateCancel==null&&s.notes&&/late cancellation/i.test(String(s.notes)))s.lateCancel=true;});
    st.meta.lateCancelBackfill=true;
  }
  /* one-time backfill: align supervision "client hrs" with the number of clients recorded (min 1) */
  if(!st.meta.supCountBackfill){
    (st.supervision||[]).forEach(sv=>{if(sv)sv.count=Math.max(1,(sv.clients||[]).length);});
    st.meta.supCountBackfill=true;
  }
  return st;
}
async function loadState(){
  let st=await kvGet("current"); let seeded=false;
  if(!st){ st=clone(window.SEED); seeded=true; }
  normalize(st);
  if(_db){ try{ await kvPut("current",st);
    if(seeded){ await snapAdd({ts:new Date().toISOString(),label:"Imported from spreadsheet (initial)",data:clone(st)});
      await auditAdd({ts:new Date().toISOString(),summary:"Seeded from 'Tracking Spreadsheet May26.xlsx' ("+st.sessions.length+" sessions)"}); }
  }catch(e){console.warn(e);} }
  S=st; mirror(S);
}
/* ===== Backup reminder: nudge after BACKUP_DAYS or BACKUP_ACTIONS since the last .json backup, whichever comes first. Tracked per-device in localStorage (not part of the data). ===== */
const BACKUP_DAYS=7, BACKUP_ACTIONS=25;
function lastBackupTs(){const s=localStorage.getItem("tt_last_backup");return s?+s:0;}
function actsSinceBackup(){const s=localStorage.getItem("tt_acts_since_backup");return s?+s:0;}
function bumpBackupActs(){try{localStorage.setItem("tt_acts_since_backup",String(actsSinceBackup()+1));}catch(e){}}
function markBackedUp(){try{localStorage.setItem("tt_last_backup",String(Date.now()));localStorage.setItem("tt_acts_since_backup","0");}catch(e){}updateBackupBanner();}
function initBackupTracking(){if(!localStorage.getItem("tt_last_backup"))markBackedUp();} // start the clock on first run / first update
function backupDueInfo(){const last=lastBackupTs(),acts=actsSinceBackup();const ms=last?Date.now()-last:0;
  const byTime=last>0&&ms>=BACKUP_DAYS*86400000, byActs=acts>=BACKUP_ACTIONS;
  return {due:acts>0&&(byTime||byActs), days:last?Math.floor(ms/86400000):null, acts};} // never nag when nothing has changed
function updateBackupBanner(){const bar=document.getElementById("backupBanner");if(!bar)return;
  const info=backupDueInfo();bar.classList.toggle("show",info.due);
  if(info.due){const d=document.getElementById("bkdetail");if(d){const parts=[];
    if(info.days!=null)parts.push(info.days+" day"+(info.days===1?"":"s")+" since last backup");
    if(info.acts)parts.push(info.acts+" change"+(info.acts===1?"":"s")+" since");
    d.textContent=parts.join(" · ")+".";}}}
async function commit(summary){
  try{gameTouch();}catch(e){}      // record weekly activity (streak)
  try{bumpBackupActs();updateBackupBanner();}catch(e){} // count change toward the backup nudge
  mirror(S);                       // localStorage first (always works)
  if(!_db)return;                  // running in fallback mode
  try{
    await kvPut("current",S);
    await auditAdd({ts:new Date().toISOString(),summary});
    await snapAdd({ts:new Date().toISOString(),label:summary,data:clone(S)});
    let snaps=await snapAll();
    if(snaps.length>MAX_SNAP){snaps.sort((a,b)=>a.id-b.id);for(let i=0;i<snaps.length-MAX_SNAP;i++)await snapDel(snaps[i].id);}
  }catch(e){console.warn("DB save failed, kept in localStorage",e);}
}
async function undo(){
  if(!_db){toast("Undo needs storage (unavailable)");return false}
  let snaps=await snapAll(); snaps.sort((a,b)=>a.id-b.id);
  if(snaps.length<2){toast("Nothing to undo");return false}
  const cur=snaps[snaps.length-1]; await snapDel(cur.id);
  const prev=snaps[snaps.length-2];
  S=clone(prev.data); await kvPut("current",S); mirror(S);
  await auditAdd({ts:new Date().toISOString(),summary:"↩︎ Undo: reverted '"+cur.label+"'"});
  return true;
}

/* ============ Date / money helpers ============ */
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function parseD(s){if(!s)return null;const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmtD(d){if(!d)return"";if(typeof d==="string")d=parseD(d);if(!d)return"";
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function fmtDshort(d){if(typeof d==="string")d=parseD(d);if(!d)return"";return d.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short"})}
function fmtDM(d){if(typeof d==="string")d=parseD(d);if(!d)return"";return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}
function fmtDMY(d){if(typeof d==="string")d=parseD(d);if(!d)return"";return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()}
function isoD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function gbp(n){if(n==null||isNaN(n))return"£0";return"£"+Number(n).toLocaleString("en-GB",{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2})}
function taxYear(d){if(typeof d==="string")d=parseD(d);const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  const start=y-((m<4||(m===4&&day<6))?1:0);return start+"-"+String(start+1).slice(-2)}
function curTaxYear(){return taxYear(today())}
function eomonth(d){return new Date(d.getFullYear(),d.getMonth()+1,0)}
function weekNum(d){if(typeof d==="string")d=parseD(d);const onejan=new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7)}

/* ============ Derived per-session ============ */
function effRate(client,dateStr){
  const d=parseD(dateStr); if(!d)return null; const cl=(client||"").toLowerCase();
  let best=null;
  for(const r of S.rateHistory){ if((r.client||"").toLowerCase()!==cl)continue;
    const ef=parseD(r.effectiveFrom); if(ef<=d){ if(!best||parseD(best.effectiveFrom)<ef)best=r; } }
  if(best)return best.rate;
  const c=S.clients.find(c=>(c.code||"").toLowerCase()===cl); return c?c.rate:0;
}
function roomFor(loc){return S.rooms.find(r=>(r.location||"").toLowerCase()===(loc||"").toLowerCase())}
function effRoomRate(loc,dateStr){const d=parseD(dateStr);const L=(loc||"").toLowerCase();let best=null;
  for(const r of (S.roomRateHistory||[])){ if((r.location||"").toLowerCase()!==L)continue;
    const ef=parseD(r.effectiveFrom); if(d&&ef<=d){ if(!best||parseD(best.effectiveFrom)<ef)best=r; } }
  if(best)return best.rate; const rm=roomFor(loc); return rm?rm.rate:0;}
function derive(s){
  const t=today(); const d=parseD(s.date);
  const rate=effRate(s.client,s.date);
  const room=roomFor(s.location); const roomRate=effRoomRate(s.location,s.date); const due=room?room.due:"n/a";
  const clientPaid=!!s.paidDate;
  const past=d?d<t:false;
  const overdue=past&&!clientPaid;
  let roomBooked = s.room==="-"||s.location==="At home" ? "n/a" : (s.room?"Y":"N");
  let roomDue="n/a";
  if(roomRate>0 && s.roomPaid!=="Y"){
    if(due==="EOM"){ roomDue = (addDays(eomonth(d),1) < t)?"Y":"N"; }
    else if(due==="EOW"){ roomDue = ((t - d)/86400000 > 7)?"Y":"N"; }
  }
  const cl=S.clients.find(c=>(c.code||"").toLowerCase()===(s.client||"").toLowerCase());
  const status=cl?cl.status:""; const category=cl?cl.category:"";
  const complete = (s.notes&&String(s.notes).trim())&&(s.roomPaid&&String(s.roomPaid).trim());
  let cancelBy=null,canCancel=false;
  if(d){ const tm=(s.time||"00:00").split(":"); const dt=new Date(d); dt.setHours(+tm[0]||0,+tm[1]||0);
    cancelBy=addDays(dt,-3); canCancel=cancelBy>new Date(); }
  return {rate,roomRate,due,clientPaid,past,overdue,roomBooked,roomDue,status,category,complete,cancelBy,canCancel,
    week:d?weekNum(d):"",year:d?d.getFullYear():"",taxYear:d?taxYear(d):""};
}

/* ============ UI helpers ============ */
const $=s=>document.querySelector(s); const main=()=>$("#main");
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}
let _toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove("show"),2200)}
function openSheet(title,bodyEl){$("#sheetTitle").textContent=title;const b=$("#sheetBody");b.innerHTML="";b.appendChild(bodyEl);$("#sheet").classList.add("open")}
function closeSheet(){$("#sheet").classList.remove("open")}
$("#sheetClose").onclick=closeSheet;
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
function curTheme(){return document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("tt_theme",t)}catch(e){} const b=$("#themeBtn");if(b)b.textContent=t==="dark"?"☀":"☾";}
(function(){const b=$("#themeBtn");if(b){b.textContent=curTheme()==="dark"?"☀":"☾";b.onclick=()=>setTheme(curTheme()==="dark"?"light":"dark");}})();
(function(){const b=$("#settingsBtn");if(b)b.onclick=()=>go("settings");})();
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function opts(arr,sel){return arr.map(o=>`<option value="${esc(o)}"${o===sel?" selected":""}>${esc(o)}</option>`).join("")}

/* ============================================================
   Gamification layer: sound · confetti · celebration · streak
   ============================================================ */

/* ---- Sound engine (Web Audio, synthesized, offline) ---- */
const Sfx=(function(){
  let ctx=null, on=true;
  try{on=localStorage.getItem("tt_sound")!=="off";}catch(e){}
  function ac(){ if(!ctx){ try{const AC=window.AudioContext||window.webkitAudioContext; if(AC)ctx=new AC();}catch(e){ctx=null;} }
    if(ctx&&ctx.state==="suspended"){try{ctx.resume();}catch(e){}} return ctx; }
  function tone(freq,start,dur,type,gain){ const c=ac(); if(!c)return; const t0=c.currentTime+start;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain||0.16,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+0.03); }
  function chord(fs,start,dur,type,gain){fs.forEach(f=>tone(f,start,dur,type,gain));}
  const API={
    get on(){return on;},
    set(v){on=!!v;try{localStorage.setItem("tt_sound",on?"on":"off");}catch(e){}},
    toggle(){API.set(!on);return on;},
    prime(){ac();},
    pop(){if(!on)return;tone(660,0,0.09,"triangle",0.14);tone(990,0.02,0.07,"sine",0.09);},
    tick(){if(!on)return;tone(880,0,0.05,"sine",0.07);},
    complete(){if(!on)return;[523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.085,0.16,"sine",0.15));},
    fanfare(){if(!on)return;[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*0.10,0.26,"triangle",0.15));chord([523.25,783.99],0.42,0.5,"sine",0.09);},
    sparkle(){if(!on)return;[1318.5,1568,1760,2093].forEach((f,i)=>tone(f,i*0.055,0.16,"sine",0.08));},

/* ---- Confetti (canvas particle burst, no library) ---- */
const Confetti=(function(){
  const cv=document.getElementById("confetti"); let ctx2=null, parts=[], raf=null;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const COLORS=["#ff6b6b","#ffd23f","#4ecdc4","#5C7A6D","#9A8C9E","#16A88E","#ff8a1e","#6c8cff","#ff5ea8"];
  function size(){cv.width=Math.floor(innerWidth*dpr);cv.height=Math.floor(innerHeight*dpr);}
  function spawn(n,o){o=o||{};size();ctx2=cv.getContext("2d");
    const ox=(o.x!=null?o.x:innerWidth/2), oy=(o.y!=null?o.y:innerHeight*0.4);
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.spread||1)*(4+Math.random()*9);
      parts.push({x:ox*dpr,y:oy*dpr,vx:Math.cos(a)*sp*dpr,vy:(Math.sin(a)*sp-(o.up||7))*dpr,
        g:(0.16+Math.random()*0.12)*dpr,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.34,
        w:(6+Math.random()*7)*dpr,h:(8+Math.random()*9)*dpr,c:COLORS[(Math.random()*COLORS.length)|0],
        life:0,max:55+Math.random()*55,shape:Math.random()<0.5?0:1});}
    cv.classList.add("on"); if(!raf)raf=requestAnimationFrame(loop); }
  function loop(){ctx2.clearRect(0,0,cv.width,cv.height);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.rot+=p.vr;p.life++;
      ctx2.save();ctx2.globalAlpha=Math.max(0,1-p.life/p.max);ctx2.translate(p.x,p.y);ctx2.rotate(p.rot);ctx2.fillStyle=p.c;
      if(p.shape){ctx2.beginPath();ctx2.arc(0,0,p.w/2,0,6.283);ctx2.fill();}else ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx2.restore();
      if(p.life>=p.max||p.y>cv.height+50)parts.splice(i,1);}
    if(parts.length)raf=requestAnimationFrame(loop);
    else{raf=null;cv.classList.remove("on");ctx2&&ctx2.clearRect(0,0,cv.width,cv.height);} }
  addEventListener("resize",()=>{if(parts.length)size();});
  return {burst:spawn};
})();

/* ---- week helpers + game state ---- */
function weekMonday(d){if(typeof d==="string")d=parseD(d);const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;}
function weekKey(d){return isoD(weekMonday(d));}
function ensureGame(){ if(!S.game)S.game={}; const g=S.game; g.activeWeeks=g.activeWeeks||[]; g.records=g.records||{};
  const r=g.records; r.longestStreak=r.longestStreak||0; r.mostClearedAtOnce=r.mostClearedAtOnce||0; r.biggestCatchup=r.biggestCatchup||0;
  if(g.seenStreak==null)g.seenStreak=0; return g; }
function computeStreak(){ const g=ensureGame(); const set=new Set(g.activeWeeks); const cur=weekMonday(today());
  let recent=null; set.forEach(k=>{const d=weekMonday(k); if(d<=cur&&(!recent||d>recent))recent=d;});
  if(!recent)return {count:0,status:"none",longest:g.records.longestStreak};
  let count=0,probe=new Date(recent); while(set.has(weekKey(probe))){count++;probe.setDate(probe.getDate()-7);}
  const gap=Math.round((cur-recent)/(7*86400000));
  const status=gap===0?"active":gap===1?"risk":"none";
  if(status==="none")return {count:0,status:"none",longest:g.records.longestStreak};
  return {count,status,longest:g.records.longestStreak}; }
function gameTouch(){ const g=ensureGame(); const k=weekKey(today());
  if(g.activeWeeks.indexOf(k)<0)g.activeWeeks.push(k);
  g.activeWeeks.sort(); if(g.activeWeeks.length>520)g.activeWeeks=g.activeWeeks.slice(-520);
  const st=computeStreak(); if(st.count>g.records.longestStreak)g.records.longestStreak=st.count; }
function saveGameQuiet(){try{mirror(S);if(_db)kvPut("current",S);}catch(e){}}
function gameGoals(){ const der=S.sessions.map(s=>({s,d:derive(s)}));
  const past=der.filter(x=>x.d.past);
  const payPast=past.filter(x=>(x.d.rate||0)>0);
  const paid=payPast.filter(x=>x.d.clientPaid).length, over=payPast.length-paid;
  const paidPct=payPast.length?Math.round(paid/payPast.length*100):100;
  const complete=past.filter(x=>x.d.complete).length;
  const compPct=past.length?Math.round(complete/past.length*100):100;
  return {paidPct,paid,over,compPct,complete,incomplete:past.length-complete,totalPast:past.length}; }

/* update records BEFORE commit so they persist; returns flags */
function gameNoteBatch(m){const g=ensureGame();const f={};
  if(m.cleared!=null&&m.cleared>g.records.mostClearedAtOnce){g.records.mostClearedAtOnce=m.cleared;f.recCleared=m.cleared;}
  if(m.amount!=null&&m.amount>g.records.biggestCatchup&&m.amount>0){g.records.biggestCatchup=Math.round(m.amount);f.recAmount=Math.round(m.amount);}
  return f;}

function gameShow(m,f){ f=f||{}; const g=ensureGame(); const st=computeStreak(); let streakUp=false;

function clientSessionCounts(){const m={};S.sessions.forEach(s=>{const k=(s.client||"").toLowerCase();if(k)m[k]=(m[k]||0)+1;});return m;}
function clientAddedDate(c){if(c.created)return c.created;
  const rs=(S.rateHistory||[]).filter(r=>(r.client||"").toLowerCase()===(c.code||"").toLowerCase()).map(r=>r.effectiveFrom).filter(Boolean).sort();
  if(rs.length)return rs[0];
  const ss=S.sessions.filter(s=>(s.client||"").toLowerCase()===(c.code||"").toLowerCase()).map(s=>s.date).filter(Boolean).sort();
  return ss.length?ss[0]:null;}
function sparkline(vals,opt){opt=opt||{};const w=opt.w||300,h=opt.h||46,pad=3,n=vals.length;
  if(!n)return '<p class="muted small">Not enough data yet.</p>';
  const max=Math.max(1,...vals),min=Math.min(0,...vals),rng=(max-min)||1;
  const xs=i=>pad+(n<=1?(w-2*pad)/2:i*(w-2*pad)/(n-1));
  const ys=val=>h-pad-(val-min)/rng*(h-2*pad);
  const pts=vals.map((v,i)=>[xs(i),ys(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area="M"+pts[0][0].toFixed(1)+" "+(h-pad)+" "+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+" L"+pts[n-1][0].toFixed(1)+" "+(h-pad)+" Z";
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block;margin-top:4px">'+
    '<path d="'+area+'" fill="color-mix(in srgb,var(--brand) 14%,transparent)"></path>'+
    '<path d="'+line+'" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg>';}
function celebrateNewClient(c){
  const prior=S.clients.filter(x=>x._id!==c._id).map(clientAddedDate).filter(Boolean).sort();
  const lastAdd=prior.length?prior[prior.length-1]:null;
  const gap=lastAdd?Math.floor((today()-parseD(lastAdd))/86400000):null;
  const total=S.clients.length;
  if(total===1)celebrate({emoji:"🌱",title:"Your very first client!",sub:c.code+" is the start of your practice — exciting times ahead.",ribbon:"Day one",level:"mega",sound:"record"});
  else if(gap!=null&&gap>=30)celebrate({emoji:"🌟",title:"A new beginning",sub:"Welcome "+c.code+" — your first new client in "+gap+" days. Good to be growing again.",ribbon:"Fresh start",level:"mega",sound:"record"});
  else celebrate({emoji:"🌱",title:"New client welcomed",sub:c.code+" joins your practice — that's "+total+" clients in your care. Great work.",level:"big",sound:"fanfare"});
}

/* ===== analytics helpers (inline SVG charts) ===== */
function monthKey(s){const d=parseD(s);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function weekStart(s){const d=parseD(s);const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x}
function moneyShort(n){n=Math.round(n);if(Math.abs(n)>=1000)return "£"+(n/1000).toFixed(n%1000===0?0:1)+"k";return "£"+n}
function pkey(dstr,gran){if(gran==="week"){const ws=weekStart(dstr);return[isoD(ws),ws.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})];}
  const k=monthKey(dstr);return[k,parseD(k+"-01").toLocaleDateString("en-GB",{month:"short",year:"2-digit"})];}
function periodSeries(gran){
  const der=S.sessions.map(s=>({s,d:derive(s)}));const map={};
  const get=(key,lab)=>map[key]||(map[key]={lab,revenue:0,room:0,sup:0,clients:new Set()});
  der.forEach(x=>{const dt=parseD(x.s.date);if(!dt)return;const[key,lab]=pkey(x.s.date,gran);
    const e=get(key,lab);e.revenue+=x.d.rate||0;e.room+=x.d.roomRate||0;if(x.s.client)e.clients.add(x.s.client.toLowerCase());});
  (S.supervision||[]).forEach(sv=>{if(!sv.date)return;const[key,lab]=pkey(sv.date,gran);const e=get(key,lab);e.sup+=(+sv.cost||0);});
  const allKeys=Object.keys(map).sort();
  const netArr=allKeys.map(k=>map[k].revenue-map[k].room-map[k].sup);
  const cliArr=allKeys.map(k=>map[k].clients.size);
  const W=gran==="week"?26:6;
  const mov=(arr,i)=>{const s=Math.max(0,i-W+1);let t=0;for(let q=s;q<=i;q++)t+=arr[q];return t/(i-s+1);};
  const startIdx=0;
  return allKeys.slice(startIdx).map((k,idx)=>{const i=startIdx+idx;const e=map[k];
    return{l:e.lab,revenue:Math.round(e.revenue),room:Math.round(e.room),sup:Math.round(e.sup),
      net:Math.round(e.revenue-e.room-e.sup),clients:e.clients.size,
      netAvg:Math.round(mov(netArr,i)),cliAvg:Math.round(mov(cliArr,i)*10)/10};});
}

/* ============ Session validation (shared by the form + the data-health sweep) ============ */
function validateSession(m){
  const errors=[],warnings=[];
  const id=m._id;
  const d=derive(m);
  const md=m.date?parseD(m.date):null;
  const t=today();
  const cl=m.client?S.clients.find(c=>(c.code||"").toLowerCase()===(m.client||"").toLowerCase()):null;
  const sameClient=s=>(s.client||"").toLowerCase()===(m.client||"").toLowerCase();
  const hasNum=m.num!==""&&m.num!=null;
  /* BLOCK: exact time clash (can't be in two places at once) */
  if(m.date&&m.time){const clash=S.sessions.find(s=>s._id!==id&&s.date===m.date&&(s.time||"")===(m.time||""));
    if(clash)errors.push({code:"timeclash",msg:"Time clash with "+esc(clash.client||"another session")+" at "+esc(m.time)+" on "+fmtDMY(m.date)});}
  /* BLOCK: duplicate session # for this client */
  let isDupNum=false;
  if(m.client&&hasNum){const dup=S.sessions.find(s=>s._id!==id&&sameClient(s)&&String(s.num)===String(m.num));
    if(dup){isDupNum=true;errors.push({code:"dupnum",msg:"#"+esc(m.num)+" already exists for "+esc(m.client)+" ("+fmtDMY(dup.date)+")"});}}
  /* WARN: same client, same day */
  if(m.client&&m.date){const same=S.sessions.find(s=>s._id!==id&&sameClient(s)&&s.date===m.date);
    if(same)warnings.push({code:"sameday",msg:esc(m.client)+" already has a session on "+fmtDMY(m.date)});}
  /* WARN: payment-date sanity */
  if(m.paidDate){const pd=parseD(m.paidDate);
    if(pd&&pd>t)warnings.push({code:"paidfuture",msg:"Payment date is in the future"});
    else if(pd&&md&&(md-pd)/86400000>7)warnings.push({code:"paidbefore",msg:"Payment date is over a week before the session date"});}
  if(m.roomPaidDate){const rpd=parseD(m.roomPaidDate);
    if(rpd&&rpd>t)warnings.push({code:"roompaidfuture",msg:"Room payment date is in the future"});
    else if(rpd&&md&&(md-rpd)/86400000>7)warnings.push({code:"roompaidbefore",msg:"Room payment date is over a week before the session date"});}
  /* WARN: room-paid vs room fee */
  const chargeable=(d.roomRate||0)>0;
  if(m.roomPaid==="Y"&&!chargeable)warnings.push({code:"roompaidnofee",msg:"Marked room paid, but "+esc(m.location||"this location")+" has no room fee"});
  if(m.roomPaid==="n/a"&&chargeable)warnings.push({code:"roomnafee",msg:"Room marked n/a, but "+esc(m.location||"this room")+" charges "+gbp(d.roomRate)});
  /* WARN: £0 / missing rate where the client normally charges */
  if(m.client&&(d.rate||0)===0){const charges=cl&&((cl.rate||0)>0||(S.rateHistory||[]).some(r=>(r.client||"").toLowerCase()===(m.client||"").toLowerCase()&&(r.rate||0)>0));
    if(charges)warnings.push({code:"zerorate",msg:"Rate is £0 although "+esc(m.client)+" normally charges — check rate history"});}
  /* WARN: inactive client (only for today/future sessions — past history is expected) */
  if(cl&&(cl.status==="Finished"||cl.status==="Paused")&&(!md||md>=t))warnings.push({code:"inactive",msg:esc(m.client)+" is marked "+esc(cl.status)});
  /* WARN: out-of-sequence # relative to the neighbouring session by date (not the global max — past entries are expected to sit below later ones) */
  if(m.client&&hasNum&&!isDupNum&&md){const n=+m.num||0;
    let prior=null,next=null;
    S.sessions.forEach(s=>{if(s._id===id||!sameClient(s)||(+s.num||0)<=0)return;const sd=s.date?parseD(s.date):null;if(!sd)return;
      if(sd<md){if(!prior||sd>parseD(prior.date))prior=s;}
      else if(sd>md){if(!next||sd<parseD(next.date))next=s;}});
    if(n>0&&prior){const p=+prior.num||0;
      if(n<=p)warnings.push({code:"seqlow",msg:"#"+n+" is below the prior session (#"+p+" on "+fmtDMY(prior.date)+")"});
      else if(n>p+1)warnings.push({code:"seqgap",msg:"#"+n+" skips ahead of the prior session (#"+p+" on "+fmtDMY(prior.date)+")"});}
    else if(n>0&&next){const nx=+next.num||0;
      if(nx&&n>=nx)warnings.push({code:"seqlow",msg:"#"+n+" is not below the next session (#"+nx+" on "+fmtDMY(next.date)+")"});}}
  /* WARN: late cancellation on a future session */
  if(m.lateCancel&&md&&md>t)warnings.push({code:"lcfuture",msg:"Late cancellation ticked on a future session"});
  return {errors,warnings};
}

VIEWS.sessions=function(){

  const body=v.querySelector("#sbody");
  function renderList(){
    body.innerHTML='<div class="search"><input id="sq" placeholder="Search client, location, notes…" value="'+esc(sessFilter.q)+'"></div>'+
      '<div class="seg" id="seg">'+(function(){var od=S.sessions.filter(x=>derive(x).overdue).length;return ["upcoming","unpaid","incomplete","all"].map(s=>'<button data-s="'+s+'" class="'+(sessFilter.seg===s?"on":"")+'">'+s[0].toUpperCase()+s.slice(1)+(s==="unpaid"&&od?' <span class="badge">'+od+'</span>':"")+'</button>').join("");})()+'</div>'+
      '<div id="slist" class="card" style="padding:4px 12px"></div>';
    const renderRows=()=>{
      const t=today();let rows=S.sessions.map(s=>({s,d:derive(s)}));
      const q=sessFilter.q.toLowerCase();
      if(q)rows=rows.filter(x=>(x.s.client+" "+(x.s.location||"")+" "+(x.s.notes||"")+" "+(x.s.invoice||"")).toLowerCase().includes(q));
      const list=body.querySelector("#slist");
      if(sessFilter.seg==="unpaid"){
        rows=rows.filter(x=>x.d.overdue).sort((a,b)=>parseD(a.s.date)-parseD(b.s.date));
        renderUnpaid(list,rows,renderRows);return;
      }
      if(sessFilter.seg==="incomplete"){
        rows=rows.filter(x=>x.d.past&&!x.d.complete).sort((a,b)=>parseD(b.s.date)-parseD(a.s.date));
        renderIncomplete(list,rows,renderRows);return;
      }
      if(sessFilter.seg==="upcoming")rows=rows.filter(x=>parseD(x.s.date)>=t).sort((a,b)=>parseD(a.s.date)-parseD(b.s.date));
      else if(sessFilter.seg==="incomplete")rows=rows.filter(x=>x.d.past&&!x.d.complete).sort((a,b)=>parseD(b.s.date)-parseD(a.s.date));
      else rows=rows.sort((a,b)=>parseD(b.s.date)-parseD(a.s.date));
      if(!rows.length){list.innerHTML='<p class="muted small center" style="padding:18px">No sessions match.</p>';return}
      list.innerHTML=rows.slice(0,400).map(x=>{const d=x.d;
        if(sessFilter.seg==="incomplete"){const miss=missingReasons(x.s);
          return '<div class="list-item" data-id="'+x.s._id+'"><div class="li-main"><div class="li-title">'+esc(x.s.client)+' <span class="chip f">incomplete</span></div><div class="li-sub">'+fmtDshort(x.s.date)+' · #'+esc(x.s.num)+' · Missing: '+(miss.join(", ")||"—")+'</div></div><div class="li-right">'+gbp(d.rate)+'</div></div>';}
        const pay=payChip(x.s,d);
        return '<div class="list-item" data-id="'+x.s._id+'"><div class="li-main"><div class="li-title">'+esc(x.s.client)+' '+pay+'</div><div class="li-sub">'+fmtDshort(x.s.date)+' · '+esc(x.s.time||"")+' · '+esc(x.s.location||"")+' · #'+esc(x.s.num)+'</div></div><div class="li-right">'+gbp(d.rate)+'</div></div>';}).join("")
        +(rows.length>400?'<p class="muted small center">Showing first 400 of '+rows.length+'.</p>':"");
      list.querySelectorAll(".list-item").forEach(li=>li.onclick=()=>sessionForm(S.sessions.find(s=>s._id===li.dataset.id)));
    };
    body.querySelector("#sq").oninput=e=>{sessFilter.q=e.target.value;renderRows()};
    body.querySelector("#seg").querySelectorAll("button").forEach(bt=>bt.onclick=()=>{sessFilter.seg=bt.dataset.s;
      body.querySelector("#seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===bt));renderRows()});
    renderRows();
  }
  function renderUnpaid(container,rows,refresh){
    const td=isoD(today());const t=today();
    if(!rows.length){container.innerHTML='<p class="muted small center" style="padding:18px">Nothing overdue 🎉</p>';return}
    const bk=days=>days<7?{o:4,l:"Under 1 week"}:days<14?{o:3,l:"1–2 weeks"}:days<31?{o:2,l:"2 weeks – 1 month"}:days<91?{o:1,l:"1–3 months"}:{o:0,l:"3+ months"};
    rows.forEach(x=>{x._days=Math.floor((t-parseD(x.s.date))/86400000);x._bk=bk(x._days);});
    const groups={};rows.forEach(x=>{(groups[x._bk.o]=groups[x._bk.o]||{l:x._bk.l,items:[]}).items.push(x);});
    const order=Object.keys(groups).map(Number).sort((a,b)=>a-b);
    container.innerHTML='<div class="paybar"><div class="hint" style="margin-top:4px">Tick what\'s been paid, set each date (defaults today), then Save.</div><div class="row" style="gap:8px;flex-wrap:wrap;margin:8px 0"><input type="date" id="allD" value="'+td+'" style="width:140px"><button class="btn sm sec" id="setAll">Apply date to ticked</button><button class="btn sm savebig" id="savePay">Save payments (0)</button></div></div><div id="prows"></div>';
    const gstyle=o=>{const m={4:["var(--good)",14],3:["var(--warn)",16],2:["var(--warn)",30],1:["var(--bad)",26],0:["var(--bad)",100]};const a=m[o]||["var(--muted)",14];if(a[1]>=100)return "background:"+a[0]+";color:#fff";return "background:color-mix(in srgb,"+a[0]+" "+a[1]+"%,transparent);color:"+a[0];};

    prw.innerHTML=order.map(o=>{const g=groups[o];const tot=g.items.reduce((a,x)=>a+(x.d.rate||0),0);
      g.items.sort((a,b)=>parseD(a.s.date)-parseD(b.s.date));
      return '<div class="grphead" style="'+gstyle(o)+'">'+esc(g.l)+' · '+g.items.length+' · '+gbp(tot)+'</div>'+
        g.items.map(x=>'<div class="payrow"><input type="checkbox" class="pchk" data-id="'+x.s._id+'"><div class="li-main" data-id="'+x.s._id+'"><div class="li-title">'+esc(x.s.client)+' · '+gbp(x.d.rate)+'</div><div class="li-sub">'+fmtDshort(x.s.date)+' · #'+esc(x.s.num)+' · '+x._days+'d overdue</div></div><input type="date" class="pdate" data-id="'+x.s._id+'" value="'+td+'"></div>').join("");}).join("");
    const sbtn=container.querySelector("#savePay");
    const upd=()=>{const n=prw.querySelectorAll(".pchk:checked").length;sbtn.textContent="Save payments ("+n+")";sbtn.classList.toggle("ready",n>0);};
    prw.querySelectorAll(".pchk").forEach(c=>c.onchange=()=>{Sfx.pop();upd();});
    prw.querySelectorAll(".li-main").forEach(mn=>mn.onclick=()=>{const c=prw.querySelector('.pchk[data-id="'+mn.dataset.id+'"]');c.checked=!c.checked;Sfx.pop();upd();});
    container.querySelector("#setAll").onclick=()=>{const dv=container.querySelector("#allD").value;prw.querySelectorAll(".pchk:checked").forEach(c=>{const di=prw.querySelector('.pdate[data-id="'+c.dataset.id+'"]');if(di)di.value=dv;});};
    sbtn.onclick=async()=>{const checks=[...prw.querySelectorAll(".pchk:checked")];if(!checks.length){toast("Tick some sessions first");Sfx.error();return}
      let amount=0;
      checks.forEach(c=>{const di=prw.querySelector('.pdate[data-id="'+c.dataset.id+'"]');const ss=S.sessions.find(z=>z._id===c.dataset.id);if(ss){ss.paidDate=di.value||isoD(today());amount+=derive(ss).rate||0;}});
      const batch=checks.length;
      const f=gameNoteBatch({cleared:batch,amount:amount});
      await commit("Marked "+batch+" session(s) paid");renderTabs();
      const stillOver=S.sessions.filter(s=>{const d=derive(s);return d.overdue&&(d.rate||0)>0;}).length;
      gameShow({batch:batch,amount:amount,toast:batch+" marked paid 🎉",
        allClear:stillOver===0,allClearEmoji:"💰",allClearTitle:"All paid up!",allClearSub:"Every overdue payment collected — excellent.",
        bigEffort:batch>=5,bigEffortSub:gbp(amount)+" collected across "+batch+" sessions"},f);
      refresh();};
  }
  function renderIncomplete(container,rows,refresh){
    const td=isoD(today());
    if(!rows.length){container.innerHTML='<div class="center" style="padding:30px 10px"><div style="font-size:48px">🌟</div><p class="muted" style="margin-top:6px">Every past session is complete — notes and room all sorted. Spotless!</p></div>';return}
    rows.sort((a,b)=>parseD(b.s.date)-parseD(a.s.date));
    container.innerHTML='<div class="bulkbar"><div class="hint" style="margin-top:4px">Catch up on missing <b>notes</b> and <b>room payments</b> in bulk — tick what\'s done, then Save.</div>'+
      '<div class="bbtns"><button class="btn sm sec" id="allNotes">✓ All notes done</button><button class="btn sm sec" id="allRoom">✓ All room paid</button>'+
      '<input type="date" id="allRD" value="'+td+'" style="width:140px"><button class="btn sm sec" id="setRD">Apply date</button></div>'+
      '<button class="btn full savebig" id="saveInc">Save (0)</button></div><div id="irows"></div>';
    const irw=container.querySelector("#irows");
    const stage={};
    irw.innerHTML=rows.map(x=>{const s=x.s,d=x.d;const miss=missingReasons(s);
      const needNotes=miss.includes("notes"), needRoom=miss.includes("room-paid status");
      const chargeable=(d.roomRate||0)>0;
      stage[s._id]={notes:false,room:false,rdate:td,chargeable:chargeable};
      const notesCtl=needNotes?'<button class="tgl" data-k="notes" data-id="'+s._id+'"><span class="tbox"></span>Notes done</button>':'<span class="chip y">✓ notes</span>';
      const roomCtl=needRoom?'<button class="tgl" data-k="room" data-id="'+s._id+'"><span class="tbox"></span>'+(chargeable?'Room paid':'No room fee')+'</button>':'<span class="chip y">✓ room</span>';
      const noteInput=needNotes?'<input class="ninp" data-id="'+s._id+'" placeholder="Y / type a note" style="display:none;flex:1;min-width:130px;padding:8px;font-size:13px">':'';
      const rdInput=(needRoom&&chargeable)?'<input type="date" class="rinp pdate2" data-id="'+s._id+'" value="'+td+'" style="display:none">':'';
      return '<div class="irow" data-id="'+s._id+'"><div class="itop"><div><span class="ittl">'+esc(s.client)+'</span> <span class="isub">'+fmtDshort(s.date)+' · #'+esc(s.num)+(chargeable?' · room '+gbp(d.roomRate):'')+'</span></div><div class="li-right small muted">'+gbp(d.rate)+'</div></div><div class="ctrls">'+notesCtl+roomCtl+noteInput+rdInput+'</div></div>';
    }).join("");
    const sbtn=container.querySelector("#saveInc");
    const count=()=>{let n=0;Object.keys(stage).forEach(id=>{if(stage[id].notes)n++;if(stage[id].room)n++;});return n;};
    const upd=()=>{const n=count();sbtn.textContent="Save ("+n+")";sbtn.classList.toggle("ready",n>0);};
    function setTgl(btn,on){const id=btn.dataset.id,k=btn.dataset.k;if(stage[id][k]===on)return;stage[id][k]=on;
      btn.classList.toggle("on",on);btn.classList.remove("pop");void btn.offsetWidth;if(on)btn.classList.add("pop");
      const row=irw.querySelector('.irow[data-id="'+id+'"]');
      if(k==="notes"){const ni=row.querySelector('.ninp');if(ni)ni.style.display=on?"block":"none";}
      if(k==="room"){const ri=row.querySelector('.rinp');if(ri)ri.style.display=on?"block":"none";}
      Sfx.pop();upd();}
    irw.querySelectorAll(".tgl").forEach(b=>b.onclick=()=>setTgl(b,!stage[b.dataset.id][b.dataset.k]));
    container.querySelector("#allNotes").onclick=()=>irw.querySelectorAll('.tgl[data-k="notes"]').forEach(b=>setTgl(b,true));
    container.querySelector("#allRoom").onclick=()=>irw.querySelectorAll('.tgl[data-k="room"]').forEach(b=>setTgl(b,true));
    container.querySelector("#setRD").onclick=()=>{const dv=container.querySelector("#allRD").value;
      irw.querySelectorAll('.rinp').forEach(ri=>ri.value=dv);Object.keys(stage).forEach(id=>{if(stage[id].room)stage[id].rdate=dv;});};
    irw.querySelectorAll('.rinp').forEach(ri=>ri.onchange=()=>{stage[ri.dataset.id].rdate=ri.value;});
    sbtn.onclick=async()=>{
      const ids=Object.keys(stage).filter(id=>stage[id].notes||stage[id].room);
      if(!ids.length){toast("Tick something first");Sfx.error();return}
      let nNotes=0,nRoom=0,cleared=0;
      ids.forEach(id=>{const stg=stage[id];const ss=S.sessions.find(z=>z._id===id);if(!ss)return;
        const wasComplete=derive(ss).complete;
        if(stg.notes){const ni=irw.querySelector('.ninp[data-id="'+id+'"]');const val=(ni&&ni.value.trim())||"Y";ss.notes=val;nNotes++;}
        if(stg.room){if(stg.chargeable){ss.roomPaid="Y";const ri=irw.querySelector('.rinp[data-id="'+id+'"]');ss.roomPaidDate=(ri&&ri.value)||stg.rdate||td;}else ss.roomPaid="n/a";nRoom++;}
        if(!wasComplete&&derive(ss).complete)cleared++;});
      const batch=nNotes+nRoom;
      const f=gameNoteBatch({cleared:cleared});
      await commit("Catch-up: "+nNotes+" notes, "+nRoom+" room paid");renderTabs();
      const remaining=S.sessions.filter(s=>{const d=derive(s);return d.past&&!d.complete;}).length;
      gameShow({batch:batch,completed:cleared>0,toast:"Updated "+batch+" field"+(batch===1?"":"s")+" 🎉",
        allClear:remaining===0,allClearEmoji:"🌟",allClearTitle:"Everything's complete!",allClearSub:"All past sessions have notes & room sorted.",
        bigEffort:cleared>=5,bigEffortSub:cleared+" sessions fully completed in one sweep"},f);
      refresh();};
  }
  function renderCal(){
    if(calY===null){const t=today();calY=t.getFullYear();calM=t.getMonth();}
    const monthName=new Date(calY,calM,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
    const lead=(new Date(calY,calM,1).getDay()+6)%7,days=new Date(calY,calM+1,0).getDate();
    const byDay={};S.sessions.forEach(s=>{const d=parseD(s.date);if(d&&d.getFullYear()===calY&&d.getMonth()===calM)(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(s);});
    const supDay={};(S.supervision||[]).forEach(s=>{const d=parseD(s.date);if(d&&d.getFullYear()===calY&&d.getMonth()===calM)supDay[d.getDate()]=true;});
    const t=today();let cells="";for(let i=0;i<lead;i++)cells+='<div class="cell empty"></div>';
    for(let day=1;day<=days;day++){const ss=byDay[day]||[];const due=ss.some(s=>derive(s).overdue);
      const isT=(calY===t.getFullYear()&&calM===t.getMonth()&&day===t.getDate());
      const codes=[...new Set(ss.map(s=>s.client))].join(" ");
      cells+='<div class="cell'+(isT?" today":"")+(supDay[day]?" sup":"")+'" data-day="'+day+'">'+day+(ss.length?'<span class="cnt'+(due?" due":"")+'">'+ss.length+'</span>':"")+(ss.length?'<span class="cc">'+esc(codes)+'</span>':"")+'</div>';}
    body.innerHTML='<div class="calnav"><button class="btn sm sec" id="pm">◀</button><b>'+monthName+'</b><button class="btn sm sec" id="nm">▶</button></div><div class="cal"><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div><div class="dow">S</div>'+cells+'</div>'+
      '<div class="small muted center mt" style="display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap"><span><i style="display:inline-block;width:13px;height:13px;border:2px solid var(--accent);border-radius:4px;vertical-align:-2px;margin-right:5px"></i>Supervision day</span><span>Tap a day to view or edit it.</span></div>';
    body.querySelector("#pm").onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderCal();};
    body.querySelector("#nm").onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderCal();};
    body.querySelectorAll(".cell[data-day]").forEach(c=>c.onclick=()=>daySheet(+c.dataset.day));
  }
  function daySheet(day){
    const sameDay=s=>{const d=parseD(s.date);return d&&d.getFullYear()===calY&&d.getMonth()===calM&&d.getDate()===day;};
    const ss=S.sessions.filter(sameDay).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    const sup=(S.supervision||[]).filter(sameDay);
    const bd=el('<div></div>');
    const sessHTML=ss.length?ss.map(s=>{const d=derive(s);const pay=payChip(s,d);
      return '<div class="list-item" data-id="'+s._id+'"><div class="li-main"><div class="li-title">'+esc(s.client)+' '+pay+'</div><div class="li-sub">'+esc(s.time||"")+' · '+esc(s.location||"")+' · #'+esc(s.num)+'</div></div><div class="li-right">'+gbp(d.rate)+'</div></div>';}).join(""):'<p class="muted small">No sessions this day.</p>';
    const supHTML=sup.length?'<div class="li-sub" style="margin:12px 2px 2px;font-weight:700;color:var(--accent-ink)">Supervision</div>'+sup.map(s=>{const disc=(s.clients&&s.clients.length)?(' · '+esc(s.clients.join(", "))):'';
      return '<div class="list-item" data-supid="'+s._id+'"><div class="li-main"><div class="li-title">'+esc(s.supervisor||"Supervision")+'</div><div class="li-sub">'+(s.count||1)+' client hr(s)'+disc+'</div></div><div class="li-right">'+gbp(s.cost)+'</div></div>';}).join(""):'';
    bd.innerHTML=sessHTML+supHTML+'<button class="btn full mt" id="addDay">＋ Add session this day</button>';
    bd.querySelectorAll(".list-item[data-id]").forEach(li=>li.onclick=()=>{closeSheet();sessionForm(S.sessions.find(s=>s._id===li.dataset.id));});
    bd.querySelectorAll(".list-item[data-supid]").forEach(li=>li.onclick=()=>{closeSheet();supervisionForm(S.supervision.find(s=>s._id===li.dataset.supid));});
    bd.querySelector("#addDay").onclick=()=>{const ds=isoD(new Date(calY,calM,day));closeSheet();sessionForm(null,{date:ds});};
    openSheet(new Date(calY,calM,day).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}),bd);
  }
  const route=()=>sessFilter.view==="cal"?renderCal():renderList();
  v.querySelector("#viewseg").querySelectorAll("button").forEach(bt=>bt.onclick=()=>{sessFilter.view=bt.dataset.v;
    v.querySelector("#viewseg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===bt));route();});
  route();return v;
};

VIEWS.supervision=function(){
  const v=el('<div class="view active"></div>');
  v.innerHTML='<div class="seg mb" id="suptab" style="display:inline-flex"><button data-st="log" class="'+(supTab==="log"?"on":"")+'">Log</button><button data-st="metrics" class="'+(supTab==="metrics"?"on":"")+'">Insights</button></div><div id="supbody"></div>';
  const sb=v.querySelector("#supbody");
  {
    function drawLog(){
      const sup=(S.supervision||[]).slice().sort((a,b)=>parseD(b.date)-parseD(a.date));
      const total=sup.reduce((a,s)=>a+(+s.cost||0),0);
      sb.innerHTML='<div class="toolbar"><button class="btn sm" id="addSup">＋ Log supervision</button></div>'+
        '<div class="card" style="padding:4px 12px">'+(sup.length?sup.map(s=>{const disc=(s.clients&&s.clients.length)?(' · '+esc(s.clients.join(", "))):'';
          return '<div class="list-item" data-id="'+s._id+'"><div class="li-main"><div class="li-title">'+esc(s.supervisor||"Supervision")+'</div><div class="li-sub">'+fmtDshort(s.date)+' · '+(s.count||1)+' client hr(s)'+disc+'</div></div><div class="li-right">'+gbp(s.cost)+'</div></div>';}).join(""):'<p class="muted small center" style="padding:18px">No supervision logged yet.</p>')+'</div>'+
        '<p class="small muted center">Total logged: '+gbp(total)+' across '+sup.length+' session(s).</p>';
      sb.querySelector("#addSup").onclick=()=>supervisionForm(null);
      sb.querySelectorAll(".list-item").forEach(li=>li.onclick=()=>supervisionForm(S.supervision.find(s=>s._id===li.dataset.id)));
    }
    function drawMetrics(){
      const t=today();
      const sup=(S.supervision||[]).slice().filter(s=>s.date).sort((a,b)=>parseD(a.date)-parseD(b.date));
      const totalSess=sup.length;
      const totalCost=sup.reduce((a,s)=>a+(+s.cost||0),0);
      const totalHrs=sup.reduce((a,s)=>a+(+s.count||0),0);
      const ty=curTaxYear();
      const tyCost=sup.filter(s=>taxYear(s.date)===ty).reduce((a,s)=>a+(+s.cost||0),0);
      let avgGap=null;
      if(sup.length>=2)avgGap=Math.round((parseD(sup[sup.length-1].date)-parseD(sup[0].date))/86400000/(sup.length-1));
      const lastDisc={};
      sup.forEach(s=>{const d=parseD(s.date);if(!d)return;(s.clients||[]).forEach(code=>{const k=code.toLowerCase();if(!lastDisc[k]||d>lastDisc[k])lastDisc[k]=d;});});
      const active=S.clients.filter(c=>clientCategory(c.status)==="Active");
      const rows=active.map(c=>{const ld=lastDisc[c.code.toLowerCase()];
        return {code:c.code,date:ld||null,days:ld?Math.floor((t-ld)/86400000):null};})
        .sort((a,b)=>{if(a.days==null&&b.days==null)return a.code.localeCompare(b.code);if(a.days==null)return -1;if(b.days==null)return 1;return b.days-a.days;});
      const recencyChip=r=>r.days==null?'<span class="chip n">never</span>':r.days>56?'<span class="chip n">'+r.days+'d</span>':r.days>28?'<span class="chip f">'+r.days+'d</span>':'<span class="chip y">'+r.days+'d</span>';
      sb.innerHTML='<div id="accMount"></div><div class="kpis mb">'+
        '<div class="kpi"><div class="v">'+totalSess+'</div><div class="l">Sessions logged</div></div>'+

        '<div class="kpi"><div class="v">'+gbp(Math.round(tyCost))+'</div><div class="l">'+ty+' spend</div></div>'+
        '</div>'+
        '<div class="card"><h2>Client discussion recency</h2><p class="small muted" style="margin:0 0 6px">Time since each active client was last discussed in supervision'+(avgGap!=null?' · avg '+avgGap+' days between supervisions':'')+'.</p>'+
        (rows.length?'<div style="padding:0 2px">'+rows.map(r=>'<div class="list-item"><div class="li-main"><div class="li-title">'+esc(r.code)+'</div><div class="li-sub">'+(r.date?'Last discussed '+fmtD(r.date):'Not yet discussed in supervision')+'</div></div><div class="li-right">'+recencyChip(r)+'</div></div>').join("")+'</div>':'<p class="muted small">No active clients to show.</p>')+
        '<div class="legend" style="margin-top:10px"><span class="lgi"><i style="background:var(--good)"></i>≤4 wks</span><span class="lgi"><i style="background:var(--accent)"></i>4–8 wks</span><span class="lgi"><i style="background:var(--bad)"></i>8+ wks / never</span></div></div>';

/* ===== UK sole-trader tax (Income Tax + Class 4/2 NIC) ===== */
function taxRates(ty){const sy=parseInt(ty.slice(0,4));
  const r={pa:12570,basicTop:50270,higherTop:125140,c4lpl:12570,c4upl:50270,c4upper:0.02};
  r.c4main=(sy>=2024)?0.06:0.09;
  if(sy<2024){r.class2week=3.45;r.spt=6725;}
  return r;}
function ukTax(profit,ty){profit=Math.max(0,profit||0);const r=taxRates(ty);
  let pa=r.pa;if(profit>100000)pa=Math.max(0,r.pa-(profit-100000)/2);
  const b1=Math.max(0,Math.min(profit,r.basicTop)-pa)*0.20;
  const b2=Math.max(0,Math.min(profit,r.higherTop)-r.basicTop)*0.40;
  const b3=Math.max(0,profit-r.higherTop)*0.45;
  const incomeTax=b1+b2+b3;
  const n1=Math.max(0,Math.min(profit,r.c4upl)-r.c4lpl)*r.c4main;
  const n2=Math.max(0,profit-r.c4upl)*r.c4upper;
  let class2=0;if(r.class2week)class2=profit>=r.spt?r.class2week*52:0;
  const total=incomeTax+n1+n2+class2;
  return {profit,pa,b1,b2,b3,incomeTax,n1,n2,class2,total,effective:profit>0?total/profit:0,r};}
function tyBounds(ty){const sy=parseInt(ty.slice(0,4));return {start:new Date(sy,3,6),end:new Date(sy+1,3,5)};}
function tyNet(y,toDateOnly){const t=today();let net=0;
  S.sessions.forEach(s=>{const d=derive(s);if(d.taxYear!==y)return;if(toDateOnly){const dd=parseD(s.date);if(!dd||dd>t)return;}net+=(d.rate||0)-(d.roomRate||0);});
  (S.supervision||[]).forEach(sv=>{if(!sv.date||taxYear(sv.date)!==y)return;if(toDateOnly){const dd=parseD(sv.date);if(!dd||dd>t)return;}net-=(+sv.cost||0);});
  return Math.round(net);}
function taxForYear(y){const b=tyBounds(y),t=today();
  const status=b.end<t?"complete":(b.start<=t?"inprogress":"future");
  const netAll=tyNet(y,false);
  if(status==="future")return {status,netAll,display:null};
  if(status==="complete"){const calc=ukTax(netAll,y);return {status,netAll,calc,display:calc.total};}
  const netTD=tyNet(y,true);
  const yearDays=Math.round((b.end-b.start)/86400000)+1;
  const elapsed=Math.min(yearDays,Math.max(1,Math.round((t-b.start)/86400000)+1));
  const frac=elapsed/yearDays;
  const calcI=ukTax(netTD,y);
  const projAnnual=frac>0?netTD/frac:netTD;
  const calcProj=ukTax(projAnnual,y);
  const proRata=calcProj.total*frac;
  return {status,netAll,netTD,yearDays,elapsed,frac,calcI,calcProj,proRata,projAnnual,display:{proj:proRata,todate:calcI.total}};}
function trow(l,v,b){return '<tr><td>'+(b?'<b>'+l+'</b>':l)+'</td><td class="num">'+(b?'<b>'+v+'</b>':v)+'</td></tr>';}
function gbpR(n){return gbp(Math.round(n||0));}
function taxBreakdown(c){return '<table>'+
  trow('Taxable profit',gbpR(c.profit))+
  trow('Personal allowance',gbpR(c.pa))+
  trow('Income tax @ 20%',gbpR(c.b1))+
  (c.b2?trow('Income tax @ 40%',gbpR(c.b2)):'')+
  (c.b3?trow('Income tax @ 45%',gbpR(c.b3)):'')+
  trow('Class 4 NIC @ '+Math.round(c.r.c4main*100)+'%',gbpR(c.n1))+
  (c.n2?trow('Class 4 NIC @ 2%',gbpR(c.n2)):'')+
  (c.class2?trow('Class 2 NIC',gbpR(c.class2)):'')+
  trow('Total tax',gbpR(c.total),true)+
  trow('Effective rate',(c.effective*100).toFixed(1)+'%')+'</table>';}
function taxDetailsSheet(y){const tx=taxForYear(y);const body=el('<div></div>');let html='';
  if(tx.status==="complete"){html='<div class="hint">Completed tax year.</div>'+taxBreakdown(tx.calc);}
  else if(tx.status==="inprogress"){const pc=Math.round(tx.frac*100);
    html='<div class="hint">In progress — '+tx.elapsed+' of '+tx.yearDays+' days ('+pc+'%) elapsed.</div>'+
      '<h3>Projected pro-rata'+(taxMode==="proj"?' · shown in table':'')+'</h3>'+
      '<p class="small muted">Net to date '+gbpR(tx.netTD)+' → projected full year '+gbpR(tx.projAnnual)+'. Full-year tax '+gbpR(tx.calcProj.total)+' × '+pc+'% = <b>'+gbpR(tx.proRata)+'</b>.</p>'+
      taxBreakdown(tx.calcProj)+
      '<h3 style="margin-top:16px">If you stopped today'+(taxMode==="todate"?' · shown in table':'')+'</h3>'+
      '<p class="small muted">Tax on net to date '+gbpR(tx.netTD)+' = <b>'+gbpR(tx.calcI.total)+'</b>.</p>'+
      taxBreakdown(tx.calcI);}
  else {html='<p class="muted">This tax year hasn’t started yet.</p>';}
  body.innerHTML=html+'<p class="small muted mt">Covers Income Tax and Class 4'+(parseInt(y)<2024?' &amp; Class 2':'')+' National Insurance for a sole trader. A personal estimate, not tax advice.</p>';
  openSheet("Tax · "+y,body);}

/* ===== Monthly take-home & pension ===== */
function pensionPcm(){let v=150;try{const s=localStorage.getItem("tt_pension");if(s!==null&&s!==""&&!isNaN(+s))v=+s;}catch(e){}return v;}
function setPensionPcm(v){try{localStorage.setItem("tt_pension",String(v));}catch(e){}}
function defaultRate(){let v=90;try{const s=localStorage.getItem("tt_default_rate");if(s!=null&&s!==""&&!isNaN(+s))v=+s;}catch(e){}return v;}
function setDefaultRate(v){try{localStorage.setItem("tt_default_rate",String(v));}catch(e){}}
function clientCategory(status){const c=(S.clientCategories||[]).find(x=>x.status===status);return c?c.category:(status||"");}
function monthlyTakeHome(){const ty=curTaxYear();const tx=taxForYear(ty);
  let annualNet=0,annualTax=0;
  if(tx.status==="complete"){annualNet=tx.netAll;annualTax=tx.calc.total;}
  else if(tx.status==="inprogress"){annualNet=tx.projAnnual;annualTax=tx.calcProj.total;}
  const annualHome=annualNet-annualTax;
  return {ty,status:tx.status,annualNet,annualTax,annualHome,monthly:annualHome/12};}

VIEWS.income=function(){
  const v=el('<div class="view active"></div>');
  const der=S.sessions.map(s=>({s,d:derive(s)}));
  const sum=(rows,f)=>rows.reduce((a,x)=>a+(f(x)||0),0);

  const roomRows=Object.keys(roomGrp).map(k=>{const g=roomGrp[k];

  const th=monthlyTakeHome();
  const thBasis = th.status==="inprogress"
